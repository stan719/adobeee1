S01:
  nazwa: "Kosiński, Przewodnik heraldyczny (1885)"
  skrot: "Kosiński, *Przewodnik*"
  kategoria: druk
  opis_bibliograficzny: "Kosiński A. A., *Przewodnik heraldyczny. Monografie, genealogie i spis rodzin senatorskich i tytuły honorów posiadających*, t. V, Warszawa: Druk Braci Jeżyńskich (dawniej J. Ungra), 1885, s. 132–145 [dodatek do hasła „Grabowscy”: drzewo genealogiczne Radoszewskich h. Oksza]. Egzemplarz z odręcznymi znakami czytelnika, zbiory rodzinne."
  typ: druk
  tytul: "Przewodnik heraldyczny. Monografie, genealogje i spis rodzin senatorskich i tytuły honorowe posiadających. [T.] V"
  autor: "Ad. Am. Kosiński (ułożył)"
  miejsce_rok: "Warszawa 1885"
  wydawca: "Druk Braci Jeżyńskich (dawniej J. Ungra), przy ulicy Nowolipki Nr 3"
  zakres: "karta tytułowa + s. 132–145 — dodatek o rodzinie Radoszewskich h. Oksza, drukowany pod żywą paginą „GRABOWSKI” („Już po oddaniu do druku niniejszego Tomu Przewodnika, otrzymałem dawne […] drzewo genealogiczne rodziny Radoszewskich herbu Oksza…”)"
  zdjecia: "IMG_5810–IMG_5817 (8)"
  uwagi:
    - "Egzemplarz z odręcznymi znakami czytelnika (niebieski długopis/atrament): podkreślenia, gwiazdki, krzyżyki na marginesach, dopisek „85 lat” na s. 139."
    - "Zdjęcia rozkładówek obrócone o 90°; drobny druk przypisów — w Etapie 1 czytać na powiększeniach."
  do_ustalenia:
    - "Na żywej paginie widnieje „GRABOWSKI” — tekst o Radoszewskich jest częścią hasła Grabowskich (dodatek). Do odnotowania w opisie, nie błąd."

