<meta charset="utf-8">
<title>Kalkulator NK38</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: przyklejony pasek aplikacji; formularz w kartach po lewej, panel wyniku po prawej (cena wariantu na górze, szczegóły w zakładkach). Telefon: jedna kolumna + pasek ceny. */
:root {
  --bg: #f3f5f6; --surface: #ffffff; --sunken: #f7f8f9; --ink: #0e171c; --ink-2: #34424b; --muted: #6a7780;
  --line: #e3e7ea; --line-2: #d3d9dd;
  --accent: #0a6b74; --accent-ink: #ffffff; --accent-soft: #e3f2f2;
  --cheap: #00909c; --dear: #c2662d;
  --good: #13794a; --good-soft: #e3f4ea; --bad: #b42318; --bad-soft: #fdecea; --warn: #8a5300; --warn-soft: #fdf3dd;
  --shadow: 0 1px 2px rgba(14, 23, 28, .05), 0 4px 16px rgba(14, 23, 28, .05);
  --f-ui: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 12px; --r-s: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1013; --surface: #121a1f; --sunken: #0f161a; --ink: #e8eef1; --ink-2: #c3ccd2; --muted: #8b989f;
  --line: #222d33; --line-2: #2d3a41;
  --accent: #4fc0c4; --accent-ink: #06272a; --accent-soft: #11292c;
  --cheap: #2aa3a8; --dear: #d4733a;
  --good: #5cc98d; --good-soft: #12291c; --bad: #ff8b80; --bad-soft: #351816; --warn: #f2c066; --warn-soft: #2e2510;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b1013; --surface: #121a1f; --sunken: #0f161a; --ink: #e8eef1; --ink-2: #c3ccd2; --muted: #8b989f;
  --line: #222d33; --line-2: #2d3a41;
  --accent: #4fc0c4; --accent-ink: #06272a; --accent-soft: #11292c;
  --cheap: #2aa3a8; --dear: #d4733a;
  --good: #5cc98d; --good-soft: #12291c; --bad: #ff8b80; --bad-soft: #351816; --warn: #f2c066; --warn-soft: #2e2510;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .25);
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, input[type=number] { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

/* pasek aplikacji */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.appbar-in { max-width: 1360px; margin: 0 auto; display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; justify-content: space-between;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; letter-spacing: -.02em; flex: none; }
.brand h1 { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.brand p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52ch; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--line-2); background: var(--surface); padding: 7px 12px; border-radius: var(--r-s); font-size: 13.5px; font-weight: 500; line-height: 1.2; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--sunken); border-color: var(--muted); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.btn.primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunken); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.danger:hover { color: var(--bad); border-color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.wrap { max-width: 1360px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 100px; }
.layout { display: grid; grid-template-columns: minmax(0, 500px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* karty formularza */
.form { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
fieldset.card { margin: 0; padding: 14px 16px 16px; }
fieldset.card legend { float: left; width: 100%; padding: 0; margin-bottom: 12px; font-size: 13px; font-weight: 600; color: var(--ink); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
fieldset.card legend small { font-weight: 400; color: var(--muted); font-size: 12px; }
fieldset.card legend + * { clear: both; }
.g2, .g3 { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 480px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.full { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); min-width: 0; }
label.f .hint { font-weight: 400; font-size: 11.5px; color: var(--muted); }
input, select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-s); padding: 7px 10px; width: 100%; min-width: 0; transition: border-color .15s, box-shadow .15s; }
input:hover, select:hover { border-color: var(--muted); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input[type=number] { text-align: right; }
input.auto { background: var(--sunken); border-style: dashed; }
input::placeholder { color: var(--muted); }
input:disabled { opacity: .55; }
textarea { resize: vertical; min-height: 70px; font-family: var(--f-num); font-size: 12.5px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 7px; font-size: 13.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed=true] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(14, 23, 28, .12); }
.row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
details.dims { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
details.dims summary { cursor: pointer; font-size: 13px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
details.dims summary::-webkit-details-marker { display: none; }
details.dims summary::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details.dims[open] summary::before { transform: rotate(45deg); }
details.dims summary span { font-weight: 400; color: var(--muted); }
.dimtab { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
.dimtab th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px; font-size: 12px; }
.dimtab th.c { text-align: center; width: 86px; }
.dimtab td { padding: 2px 4px; }
.dimtab td.std { text-align: right; padding-right: 14px; color: var(--muted); font-family: var(--f-num); }
.dimtab input { padding: 4px 8px; }
.dimtab tr.gap th { padding-top: 12px; }

/* wynik */
.result { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); max-height: calc(100vh - env(safe-area-inset-top, 0px) - 86px); overflow-y: auto; overscroll-behavior: contain; scrollbar-gutter: stable; margin-right: -6px; padding-right: 6px; padding-bottom: 4px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (max-width: 1000px) { .result { position: static; max-height: none; overflow: visible; margin-right: 0; padding-right: 0; } }
.hero { padding: 18px 20px 16px; }
.hero-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; align-items: center; }
.eyebrow { font-size: 12px; font-weight: 500; color: var(--muted); }
.prices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }
@media (max-width: 560px) { .prices { grid-template-columns: minmax(0, 1fr); } }
.pz { min-width: 0; }
.pz + .pz { border-left: 1px solid var(--line); padding-left: 16px; }
@media (max-width: 560px) { .pz + .pz { border-left: 0; padding-left: 0; } }
.big { font-family: var(--f-num); font-weight: 500; font-size: clamp(26px, 3.4vw, 40px); letter-spacing: -.035em; line-height: 1.05; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.big small { font-size: .45em; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.pz.b .big { color: var(--ink-2); }
.pz .d { font-family: var(--f-num); font-size: 12px; color: var(--muted); margin-top: 3px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 0; margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.kpi { padding: 0 14px; border-left: 1px solid var(--line); min-width: 0; }
.kpi:first-child { border-left: 0; padding-left: 0; }
.kpi .l { font-size: 11.5px; color: var(--muted); }
.kpi .v { font-family: var(--f-num); font-size: 14.5px; font-weight: 500; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .v small { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
.kpi .v.t { color: var(--accent); }
.compare { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 760px) { .compare { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cmp { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); min-width: 0; transition: border-color .15s; }
.cmp:hover { border-color: var(--line-2); }
.cmp[aria-pressed=true] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.cmp .n { font-size: 12px; color: var(--muted); font-weight: 500; }
.cmp .p { font-family: var(--f-num); font-size: 15px; font-weight: 500; margin-top: 3px; white-space: nowrap; }
.cmp .d { font-family: var(--f-num); font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.calcline { margin-top: 12px; padding: 9px 12px; border-radius: var(--r-s); background: var(--accent-soft); color: var(--ink-2); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.calcline b { color: var(--accent); font-family: var(--f-num); font-size: 14px; }
.exp { display: inline-flex; gap: 6px; }
.btn[disabled] { opacity: .5; cursor: default; }
.info { padding: 10px 12px; border-radius: 10px; background: var(--sunken); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-2); margin-top: 12px; }
.ofgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .ofgrid { grid-template-columns: minmax(0, 1fr); } }
details.grp { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
details.grp > summary { cursor: pointer; font-weight: 600; font-size: 13px; }
details.grp[open] > summary { margin-bottom: 12px; }
.autotag { font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 99px; background: var(--sunken); color: var(--muted); margin-left: 6px; }
.autotag.ch { background: var(--warn-soft); color: var(--warn); }
.linkbtn { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 0; margin-left: 6px; }
.checks { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; }
.checks input { width: auto; }
.paper { background: #ffffff; color: #111111; border: 1px solid var(--line-2); border-radius: 6px; padding: 28px 32px; font-family: Calibri, Carlito, "Segoe UI", sans-serif; font-size: 12.5px; line-height: 1.4; box-shadow: var(--shadow); max-width: 760px; margin: 0 auto; }
.paper .hd { display: flex; justify-content: space-between; gap: 16px; align-items: center; border-bottom: 1px solid #dddddd; padding-bottom: 8px; margin-bottom: 14px; }
.paper .hd .lh { text-align: center; font-size: 10.5px; color: #333333; flex: 1; }
.paper .hd .lh b { display: block; font-size: 11px; color: #111111; }
.paper .hd img { max-height: 48px; max-width: 180px; }
.paper h4 { margin: 12px 0 4px; font-size: 12.5px; }
.paper p { margin: 0 0 4px; }
.paper .in { padding-left: 18px; }
.paper .blue { color: #1f4e9a; font-weight: 700; }
.paper .nr { font-weight: 700; font-style: italic; text-decoration: underline; margin: 10px 0; }
.paper .pr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 16px; padding-left: 18px; }
.paper .pr .v { text-align: right; font-weight: 700; white-space: nowrap; }
.paper .ft { border-top: 1px solid #dddddd; margin-top: 18px; padding-top: 6px; text-align: center; font-size: 10px; color: #555555; }
.paper .kl { font-size: 9.5px; color: #555555; margin-top: 14px; }
.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; border-radius: 10px; font-size: 13px; }
.alert b { font-weight: 600; }
.alert.blad { background: var(--bad-soft); color: var(--bad); }
.alert.uwaga { background: var(--warn-soft); color: var(--warn); }
.tabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 7px 12px; border-radius: 7px; color: var(--muted); font-weight: 500; font-size: 13.5px; white-space: nowrap; }
.tabs button:hover { color: var(--ink); background: var(--sunken); }
.tabs button[aria-selected=true] { color: var(--ink); background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line); }
.pane { padding: 16px 18px 18px; min-width: 0; }
.scroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; white-space: normal; min-width: 160px; padding-left: 0; }
table.t thead th { font-weight: 500; color: var(--muted); font-size: 12px; }
table.t th.sel { color: var(--accent); }
table.t td { font-family: var(--f-num); font-variant-numeric: tabular-nums; color: var(--ink-2); }
table.t td:first-child { font-family: var(--f-ui); color: var(--ink); }
table.t td.sel { color: var(--ink); background: var(--sunken); }
table.t tr.strong td { font-weight: 600; color: var(--ink); }
table.t tr.total td { font-weight: 600; color: var(--ink); border-bottom: 1px solid var(--line-2); }
table.t tr.grp td { font-family: var(--f-ui); font-weight: 500; color: var(--muted); font-size: 12px; padding-top: 16px; border-bottom-color: var(--line-2); }
table.t td.best { color: var(--good); font-weight: 600; }
table.t tr:last-child td { border-bottom: 0; }
h3.sec { font-size: 13px; font-weight: 600; margin: 22px 0 8px; }
h3.sec:first-child { margin-top: 0; }
.chart { display: grid; grid-template-columns: 112px minmax(0, 1fr) 120px; gap: 8px 12px; align-items: center; font-size: 13px; }
.chart .who { font-weight: 500; }
.chart .who small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.track { position: relative; height: 22px; }
.track::before { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--line-2); }
.track i { position: absolute; top: 4px; height: 14px; border-radius: 4px; }
.track i.cheap { background: var(--cheap); border-top-left-radius: 4px; border-bottom-left-radius: 4px; }
.track i.dear { background: var(--dear); }
.track i.zero { left: calc(50% - 1.5px); width: 3px; background: var(--ink-2); border-radius: 2px; }
.chart .val { font-family: var(--f-num); text-align: right; white-space: nowrap; }
.chart .val small { display: block; color: var(--muted); font-size: 11.5px; }
.chart-axis { display: grid; grid-template-columns: 112px minmax(0, 1fr) 120px; gap: 12px; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
.chart-axis div:nth-child(2) { display: flex; justify-content: space-between; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--good-soft); color: var(--good); margin-left: 6px; vertical-align: 1px; }
.offer { font-family: var(--f-num); font-size: 12.5px; line-height: 1.6; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 14px; white-space: pre-wrap; overflow-x: auto; margin: 0; color: var(--ink-2); }
.muted { color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) 130px; gap: 6px 14px; align-items: center; font-size: 13px; }
.kv input { padding: 5px 8px; font-size: 13px; }
.kv h3 { grid-column: 1 / -1; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); margin-left: 4px; }
ul.notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; max-width: 72ch; }
ul.notes li { padding-left: 16px; position: relative; color: var(--ink-2); }
ul.notes li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.saved { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.saved .it { display: flex; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; flex-wrap: wrap; }
.saved .it b { font-weight: 600; }
.empty { padding: 18px; text-align: center; color: var(--muted); border: 1px dashed var(--line-2); border-radius: 10px; font-size: 13px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 10px; font-size: 13.5px; z-index: 30; box-shadow: var(--shadow); }
.mbar { display: none; }
@media (max-width: 1000px) {
  .mbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; justify-content: space-between; align-items: center; gap: 10px;
    background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .mbar .p { font-family: var(--f-num); font-size: 18px; font-weight: 500; letter-spacing: -.02em; }
  .mbar .s { font-size: 11.5px; color: var(--muted); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* przewijanie: lewa kolumna kończy się nad dolną krawędzią, panel wyniku mieści się w oknie */
@media (min-width: 1001px) {

    if (!lista || !lista.length) {
      lista = E.szablonyWbudowane();
      var stary = lsGet(LS.cennikStary, null);   // zmiany cennika z poprzedniej wersji aplikacji
      if (stary) Object.keys(stary).forEach(function (k) { if (k in lista[0].cennik) lista[0].cennik[k] = stary[k]; });
    }
    szablony = lista.map(E.uzupelnijSzablon);
  }
  function zapiszSzablony() { Store.set("szablony", szablony); }
  function szablonAktywny() {
    var id = state.dane && state.dane.szablon;
    return szablony.filter(function (s) { return s.id === id; })[0] || szablony[0];
  }

  var state = { dane: null, tab: lsGet(LS.tab, "wynik"), sel: lsGet(LS.sel, 0), confirm: null, edytowany: null, ovView: "form" };
  if (!TABS.some(function (t) { return t[0] === state.tab; })) state.tab = "wynik";
  var wynik = null;

  /* --- formularz <-> dane --- */
  function wypelnijSzablony() {
    $("szablon").innerHTML = szablony.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.nazwa) + "</option>"; }).join("");
  }
  function buildDimTable() {
    var sz = szablonAktywny(), d = state.dane;
    var h = '<thead><tr><th>Zagłębienie</th><th class="c">S</th><th class="c">D</th></tr></thead><tbody>';
    h += '<tr><td>standard</td><td class="std" id="std_S"></td><td class="std" id="std_D"></td></tr>';
    sz.glebokosci.forEach(function (g) {
      h += '<tr><td>' + g.cm + ' cm</td><td><input type="number" min="0" step="1" data-gl="S" data-cm="' + g.cm + '" aria-label="Zagłębienie ' + g.cm + ' cm, S"></td><td><input type="number" min="0" step="1" data-gl="D" data-cm="' + g.cm + '" aria-label="Zagłębienie ' + g.cm + ' cm, D"></td></tr>';
    });
    h += '<tr class="gap"><th colspan="3">Szerokość i długość</th></tr>';
    var et = [["szer1", "Szerokość " + ((sz.szerokosci.S[0] || {}).nazwa || "–") + " (S) / " + ((sz.szerokosci.D[0] || {}).nazwa || "–") + " (D)"],
      ["szer2", "Szerokość " + ((sz.szerokosci.S[1] || {}).nazwa || "–") + " (S) / " + ((sz.szerokosci.D[1] || {}).nazwa || "–") + " (D)"]]
      .concat(sz.dlugosci.slice(0, 3).map(function (L, i) { return [["dl500", "dl540", "dl550"][i], "Długość " + L.nazwa]; }));
    et.forEach(function (x) {
      h += '<tr><td>' + esc(x[1]) + '</td><td><input type="number" min="0" step="1" id="' + x[0] + '_S" aria-label="' + esc(x[1]) + ', S"></td><td><input type="number" min="0" step="1" id="' + x[0] + '_D" aria-label="' + esc(x[1]) + ', D"></td></tr>';
    });
    $("dimTable").innerHTML = h + "</tbody>";
    if (d) {
      document.querySelectorAll("[data-gl]").forEach(function (el) { var v = (el.dataset.gl === "S" ? d.gl_S : d.gl_D)[el.dataset.cm]; el.value = v || ""; });
      DIMKEYS.forEach(function (k) { if ($(k + "_S")) { $(k + "_S").value = d[k + "_S"] || ""; $(k + "_D").value = d[k + "_D"] || ""; } });
    }
  }

  function toForm(d) {
    TXTF.forEach(function (k) { $(k).value = d[k] == null ? "" : d[k]; });
    NUMF.forEach(function (k) { $(k).value = d[k] == null ? "" : d[k]; });
    PCTF.forEach(function (k) { $(k).value = d[k] == null ? "" : +(d[k] * 100).toFixed(4); });
    $("szablon").value = szablonAktywny().id;
    renderPary(d);
    buildDimTable();
    lokButtons(d.lok);
  }

  /* Kolejne pary zagłębienie + prześwit (pierwsza to pola H1/H2/dł./prześwit). */
  function renderPary(d) {
    var pary = d.pary || [], inp = function (i, k, v, num, ph) {
      return '<input type="' + (num ? "number" : "text") + '"' + (num ? ' min="0" step="1"' : "") + ' data-para="' + i + '" data-k="' + k + '" value="' + esc(v == null ? "" : v) + '"' + (ph ? ' placeholder="' + esc(ph) + '"' : "") + ">";
    };
    $("paryBox").innerHTML = pary.map(function (p, i) {
      return '<div class="paryhd"><span class="ofsep">Para ' + (i + 2) + ' (w ofercie „lub”)</span><button type="button" class="linkbtn" data-para-del="' + i + '">Usuń</button></div><div class="para">' +
        '<label class="f">H1 [cm]' + inp(i, "h1", p.h1, 1) + '</label><label class="f">H2 [cm]' + inp(i, "h2", p.h2, 1) + '</label>' +
        '<label class="f">Długość [cm]' + inp(i, "dl", p.dl, 0, d.dl || "jak w parze 1") + '</label><label class="f">Prześwit [cm]' + inp(i, "przeswit", p.przeswit, 1) + "</label></div>";
    }).join("") + '<div class="row paryadd"><button type="button" class="btn small" id="bParaAdd">+ Dodaj parę zagłębienie / prześwit</button>' +
      '<span class="note">gdy w garażu są różne zagłębienia lub prześwity</span></div>';
  }

  function fromForm() {
    var d = E.domyslneDane(), s = state.dane;
    ["lok", "analiza", "oferta", "opis"].forEach(function (k) { if (s && s[k] !== undefined) d[k] = s[k]; });
    TXTF.forEach(function (k) { d[k] = $(k).value; });
    d.szablon = $("szablon").value;
    NUMF.forEach(function (k) {
      var v = $(k).value;
      d[k] = v === "" ? (OPTF[k] ? null : ({ osoby: 4, eur: 4.325, konserwA: 40, konserwB: 50 }[k] || 0)) : Number(v);
    });
    PCTF.forEach(function (k) { var v = $(k).value; d[k] = v === "" ? (k === "q2500" ? null : 0) : Number(v) / 100; });
    d.gl_S = {}; d.gl_D = {};
    document.querySelectorAll("[data-gl]").forEach(function (el) { var v = Number(el.value || 0); if (v) (el.dataset.gl === "S" ? d.gl_S : d.gl_D)[el.dataset.cm] = v; });
    DIMKEYS.forEach(function (k) { d[k + "_S"] = Number(($(k + "_S") || {}).value || 0); d[k + "_D"] = Number(($(k + "_D") || {}).value || 0); });
    d.pary = [];
    document.querySelectorAll("[data-para]").forEach(function (el) {
      var i = +el.dataset.para, k = el.dataset.k, v = el.value;
      d.pary[i] = d.pary[i] || { h1: null, h2: null, dl: "", przeswit: null };
      d.pary[i][k] = k === "dl" ? v : (v === "" ? null : Number(v));
    });
    var opisPole = $("opis").value;
    d.opis = opisPole === "" || opisPole === state.opisAuto ? "" : opisPole;
    return d;
  }

  function lokButtons(lok) {
    $("lokKrk").setAttribute("aria-pressed", lok === "Kraków");
    $("lokPoza").setAttribute("aria-pressed", lok !== "Kraków");
    $("lokNote").textContent = lok === "Kraków" ? "montaż w dniach, 20 km, bez hotelu i diet" : "montaż w tygodniach, z hotelem i dietami";
    $("km").disabled = lok === "Kraków";
  }

  function normalizujOferte(d) {
    var b = X.domyslnaOferta(), o = Object.assign(b, d.oferta || {});
    o.opcje = Object.assign(X.domyslnaOferta().opcje, (d.oferta || {}).opcje || {});
    o.adr = Object.assign(X.domyslnaOferta().adr, (d.oferta || {}).adr || {});
    o.ceny = Object.assign({}, (d.oferta || {}).ceny || {});
    o.tekst = Object.assign({}, (d.oferta || {}).tekst || {});
    o.wysPary = Array.isArray(o.wysPary) ? o.wysPary.slice() : [];
    return o;
  }
  function setDane(d) {
    state.dane = Object.assign(E.domyslneDane(), d);
    if (d.zysk2 === undefined && d.zysk_min !== undefined) state.dane.zysk2 = d.zysk_min;
    if (!d.szablon && d.typ === "NK37") state.dane.szablon = "nk37";
    state.dane.oferta = normalizujOferte(state.dane);
    toForm(state.dane);
    recalc();
  }

  function recalc() {
    wynik = E.oblicz(state.dane, szablonAktywny());
    lsSet(LS.draft, { dane: state.dane });
    render();
    if (!$("ov").hidden) renderPodglad();
  }

  /* --- render --- */
  function render() {
    var r = wynik, d = r.dane, m = r.mat, sel = state.sel, w = r.warianty[sel], T = r.szablon.typy;
    var zA = "zysk " + pct(d.zysk), zB = "zysk " + pct(d.zysk2);
    $("appTitle").textContent = "Kalkulator " + d.typ;
    $("projline").textContent = (d.nazwa || "Nowa wycena") + " · " + d.typ;
    $("mpNote").textContent = m.platformy + " platform · " + m.MP + " MP";
    ["S", "D", "NP"].forEach(function (k) { $("lbl" + k).textContent = T[k].nazwa; $("hint" + k).textContent = T[k].mp + " MP"; });
    $("std_S").textContent = Math.max(0, (d.S || 0) - sumO(d.gl_S));
    $("std_D").textContent = Math.max(0, (d.D || 0) - sumO(d.gl_D));
    var surowe = (d.magistrala || 0) * r.cennik.osd_magistrala + ((d.barierki || 0) + (d.maskownice || 0)) * r.cennik.osd_barierka;
    $("utrLine").innerHTML = "Utrudnienia razem <b>" + n2(m.utr) + " osd</b><span>= magistrala " + (d.magistrala || 0) + " × " + n2(r.cennik.osd_magistrala) +
      " + barierki i maskownice " + ((d.barierki || 0) + (d.maskownice || 0)) + " × " + n2(r.cennik.osd_barierka) + " = " + n2(surowe) + " → " + n2(m.utrAuto) +
      (d.utr_dod ? ", + ręcznie " + n2(d.utr_dod) : "") + "</span>";
    $("km_pom").placeholder = String(r.wspolne.kmPom);
    $("km_mon").placeholder = String(r.wspolne.kmMon);
    $("rozl_dni").placeholder = n2(r.wspolne.rozl);
    $("wyjazdy").placeholder = String(r.warianty[0].iteracje[4]);
    $("q2500").placeholder = n2(r.cennik.q2500 * 100);
    $("q2500Hint").textContent = "puste = " + n2(r.cennik.q2500 * 100) + "% z szablonu";
    var dzwAuto = r.cennik.dzwig * r.wspolne.dzwDni;
    $("dzwig_koszt").placeholder = String(Math.round(dzwAuto));
    $("dzwigHint").textContent = "Cena za 1 dzień: " + zl(r.cennik.dzwig) + " × " + r.wspolne.dzwDni + " dni = " + zl(dzwAuto) + (d.dzwig_koszt != null ? " (wpisano ręcznie " + zl(d.dzwig_koszt) + ")" : "");
    var auto = X.opisAuto(d, d.oferta);
    state.opisAuto = auto;
    if (document.activeElement !== $("opis")) $("opis").value = d.opis || auto;
    $("opis").classList.toggle("auto", !d.opis);
    $("opisTag").textContent = d.opis ? "zmieniony" : "automatyczny";
    $("opisTag").classList.toggle("ch", !!d.opis);
    $("opisReset").hidden = !d.opis;
    var ds = r.szablon.glebokosci.filter(function (g) { return d.gl_S[g.cm] || d.gl_D[g.cm]; }).map(function (g) { return g.cm + " cm"; });
    $("dimSummary").textContent = ds.length ? "· " + ds.join(", ") : "· wszystkie standardowe";

    var q = sel % 2, sl = sel >= 2 ? 1 : 0, recz = d.wyjazdy != null, K = r.konserwacja;
    $("hero").innerHTML =
      '<div class="hero-top"><div class="row">' +
      '<div class="seg" role="group" aria-label="Udźwig"><button type="button" data-q="0" aria-pressed="' + (q === 0) + '">2000 kg</button><button type="button" data-q="1" aria-pressed="' + (q === 1) + '">2500 kg</button></div>' +
      '<div class="seg" role="group" aria-label="Słupki e-ładowarek"><button type="button" data-sl="0" aria-pressed="' + (sl === 0) + '">Bez słupków</button><button type="button" data-sl="1" aria-pressed="' + (sl === 1) + '">Ze słupkami</button></div>' +
      '</div><span class="eyebrow">' + esc(d.typ) + ' · ' + m.MP + ' MP · ' + esc(d.lok) + '</span></div>' +
      '<div class="prices"><div class="pz"><div class="eyebrow">Cena netto · ' + zA + '</div><div class="big">' + fmtPLN.format(Math.round(w.cena)) + '<small>zł</small></div>' +
      '<div class="d">' + zl(w.cenaMP) + ' / MP · ' + eur(w.cenaMPeur) + ' / MP</div></div>' +
      '<div class="pz b"><div class="eyebrow">Cena netto · ' + zB + '</div><div class="big">' + fmtPLN.format(Math.round(w.cena2)) + '<small>zł</small></div>' +
      '<div class="d">' + zl(w.cenaMP2) + ' / MP · ' + sgn(w.cena2 - w.cena) + '</div></div></div>' +
      '<div class="kpis">' +
      kpi("Montaż", w.tygodnie + " tyg.<small>" + w.dni + " dni pracy, " + w.osoby + " os." + (recz ? ", tygodnie wpisane ręcznie" : "") + "</small>", true) +
      kpi("Zysk " + pct(d.zysk) + " / " + pct(d.zysk2), zl(w.zysk) + "<small>" + zl(w.zysk2) + "</small>") +
      kpi("Konserwacja roczna", zl(K[0].rok) + "<small>przy " + K[0].stawka + " zł/MP · " + zl(K[1].rok) + " przy " + K[1].stawka + " zł/MP</small>") +
      kpi("Przegląd półroczny", zl(K[0].pol) + "<small>przy " + K[0].stawka + " zł/MP · " + zl(K[1].pol) + " przy " + K[1].stawka + " zł/MP</small>") + "</div>";
    $("compare").innerHTML = r.warianty.map(function (x, i) {
      return '<button type="button" class="cmp" data-sel="' + i + '" aria-pressed="' + (i === sel) + '"><div class="n">' + esc(x.nazwa) +
        '</div><div class="p">' + zl(x.cena) + '</div><div class="d">' + pct(d.zysk2) + ': ' + zl(x.cena2) + "</div></button>";
    }).join("");
    var o = d.oferta;
    $("ofertaSub").textContent = (o.adr.firma || o.adr.imie ? "dla: " + [o.adr.imie, o.adr.firma].filter(Boolean).join(", ") + " · " : "") +
      "nr " + (o.nr || o.nrAuto || nastepnyNumer()) + " · adresat, opcje, ceny, podgląd i plik Word";
    $("alerts").innerHTML = r.ostrzezenia.map(function (a) {
      return '<div class="alert ' + a.typ + '"><b>' + (a.typ === "blad" ? "Błąd" : "Uwaga") + "</b>" + esc(a.tekst) + "</div>";
    }).join("");
    $("mbar").innerHTML = '<div><div class="s">' + esc(w.nazwa) + ' · ' + zA + ' · ' + w.tygodnie + ' tyg.</div><div class="p">' + zl(w.cena) +
      '</div></div><div style="text-align:right"><div class="s">' + zB + '</div><div class="p" style="font-size:15px">' + zl(w.cena2) + "</div></div>";
    $("tabs").innerHTML = TABS.map(function (t) {
      return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + "</button>";
    }).join("");
    if (state.tab === "szablony" && document.activeElement && document.activeElement.closest && document.activeElement.closest("#pane")) return;
    $("pane").innerHTML = ({ wynik: paneWynik, ekipa: paneEkipa, zestaw: paneZestaw, obl: paneObl, wyceny: paneWyceny, szablony: paneSzablony }[state.tab] || paneWynik)();
    if (state.tab === "wyceny") wypelnijWyceny();
  }
  function kpi(l, v, t) { return '<div class="kpi"><div class="l">' + l + '</div><div class="v' + (t ? " t" : "") + '">' + v + "</div></div>"; }

  function tableRows(rows, ws) {
    return rows.map(function (row) {
      if (typeof row === "string") return '<tr class="grp"><td colspan="' + (ws.length + 1) + '">' + row + "</td></tr>";
      return '<tr class="' + (row[2] || "") + '"><td>' + row[0] + "</td>" + ws.map(function (w, i) {
        return '<td class="' + (i === state.sel && ws.length === 4 ? "sel" : "") + '">' + row[1](w) + "</td>";
      }).join("") + "</tr>";
    }).join("");
  }
  function thead(first, ws) {
    return "<thead><tr><th>" + first + "</th>" + ws.map(function (w, i) { return '<th class="' + (i === state.sel ? "sel" : "") + '">' + esc(w.nazwa) + "</th>"; }).join("") + "</tr></thead>";
  }

  function paneWynik() {
    var r = wynik, ws = r.warianty, d = r.dane, zA = "zysk " + pct(d.zysk), zB = "zysk " + pct(d.zysk2);
    var h = '<div class="scroll"><table class="t">' + thead("Wariant", ws) + "<tbody>";
    h += tableRows([
      ["Cena netto, " + zA, function (w) { return zl(w.cena); }, "total"],
      ["Cena netto, " + zB, function (w) { return zl(w.cena2); }, "total"],
      ["Różnica", function (w) { return sgn(w.cena2 - w.cena); }],
      ["Cena za MP, " + zA, function (w) { return zl(w.cenaMP); }],
      ["Cena za MP, " + zB, function (w) { return zl(w.cenaMP2); }],
      ["Cena za MP w euro, " + zA, function (w) { return eur(w.cenaMPeur); }],
      ["Zysk " + pct(d.zysk) + " / " + pct(d.zysk2), function (w) { return zl(w.zysk) + " / " + zl(w.zysk2); }],
      ["Koszt rzeczywisty", function (w) { return zl(w.koszt); }],
      "Struktura kosztów",
      ["Urządzenia", function (w) { return zl(w.koszty.urzadzenia); }],
      ["Słupki e-ładowarek", function (w) { return zl(w.koszty.slupki); }],
      ["Transport, dźwig, rozładunek", function (w) { return zl(w.koszty.transport + w.koszty.dzwig + w.koszty.rozladunek_sprzet); }],
      ["Robocizna", function (w) { return zl(w.koszty.montaz + w.koszty.rozladunek_ludzie + w.koszty.dojazdy); }],
      ["Hotel, diety, paliwo", function (w) { return zl(w.koszty.hotel + w.koszty.diety + w.koszty.paliwo); }],
      ["KOB, GDW, podatek", function (w) { return zl(w.kob + w.gdw + w.podatek); }],
      "Czas",
      ["Dni pracy ekipy", function (w) { return w.dni; }, "strong"],
      ["Tygodnie montażu", function (w) { return w.tygodnie; }, "strong"],
      ["Osobodni razem", function (w) { return n2(w.osobodni); }]
    ], ws);
    h += "</tbody></table></div>";
    var O = r.opcje;
    h += '<h3 class="sec">Opcje do oferty, cena z narzutami</h3><div class="scroll"><table class="t"><thead><tr><th>Opcja</th><th>2000 kg, ' + zA + '</th><th>2500 kg, ' + zA + '</th><th>2000 kg, ' + zB + '</th><th>2500 kg, ' + zB + '</th></tr></thead><tbody>';
    h += "<tr><td>Słupki e-ładowarek 3,7 kW, z robocizną</td><td>" + [O.slupki37[0], O.slupki37[1], O.slupki37b[0], O.slupki37b[1]].map(zl).join("</td><td>") + "</td></tr>";
    h += "<tr><td>Słupki e-ładowarek 22 kW, z robocizną</td><td>" + [O.slupki22[0], O.slupki22[1], O.slupki22b[0], O.slupki22b[1]].map(zl).join("</td><td>") + "</td></tr>";
    h += "<tr><td>Malowanie proszkowe RAL</td><td>" + [O.malowanie, O.malowanie, O.malowanieB, O.malowanieB].map(zl).join("</td><td>") + "</td></tr>";
    return h + "</tbody></table></div>";
  }

  function paneEkipa() {
    var r = wynik, an = r.analiza, ref = r.warianty[r.dane.analiza];
    var deltas = an.map(function (a) { return a.cena - ref.cena; });
    var maxAbs = Math.max(1, Math.max.apply(null, deltas.map(Math.abs)));
    var min = Math.min.apply(null, an.map(function (a) { return a.cena; }));
    var h = '<div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="muted" style="max-width:52ch">Ta sama wycena przy innej liczbie osób, porównana z wpisaną liczbą (' + ref.osoby + ' os.), zysk ' + pct(r.dane.zysk) + '.</div>' +
      '<select id="analizaSel" style="width:auto" aria-label="Wariant analizy">' + E.WARIANTY.map(function (w, i) { return '<option value="' + i + '"' + (r.dane.analiza == i ? " selected" : "") + ">" + w + "</option>"; }).join("") + "</select></div>";
    h += '<div class="legend"><span><i style="background:var(--cheap)"></i>taniej</span><span><i style="background:var(--dear)"></i>drożej</span></div>';
    h += '<div class="chart">' + an.map(function (a, i) {
      var dlt = deltas[i], wpct = Math.abs(dlt) / maxAbs * 48, bar;
      if (Math.abs(dlt) < 0.5) bar = '<i class="zero"></i>';
      else if (dlt < 0) bar = '<i class="cheap" style="left:' + (50 - wpct).toFixed(2) + '%;width:' + wpct.toFixed(2) + '%"></i>';
      else bar = '<i class="dear" style="left:50%;width:' + wpct.toFixed(2) + '%"></i>';
      var tip = a.n + " os.: " + zl(a.cena) + ", " + a.tygodnie + " tyg., " + a.dni + " dni pracy";
      return '<div class="who">' + a.n + ' os.' + (a.cena === min ? '<span class="badge">najtaniej</span>' : "") + '<small>' + a.tygodnie + " tyg. · " + a.dni + " dni" + '</small></div><div class="track" title="' + esc(tip) + '">' + bar +
        '</div><div class="val">' + (Math.abs(dlt) < 0.5 ? "wpisana" : sgn(dlt)) + "<small>" + zl(a.cena) + "</small></div>";

    if (t.id === "szSel") { state.edytowany = t.value; state.szUsun = false; render(); return; }
    if (t.dataset.szp && t.tagName === "SELECT") { ustawSciezke(szEdytowany(), t.dataset.szp, t.value); zapiszSzablony(); recalcBezPanelu(); return; }
    if (t.dataset.szp) { state.dane = state.dane; buildDimTable(); }
  });
  $("pane").addEventListener("click", async function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.id === "bCopy") return copyText(zestawienie(), "Skopiowano tekst", "offerText");
    if (t.id === "bSave2") return zapiszBiezaca($("saveName").value || "Wycena");
    if (t.dataset.load !== undefined) {
      var w = (state.wyceny || []).filter(function (x) { return x.id === t.dataset.load; })[0];
      if (w) { setDane(w.dane); toast("Wczytano: " + w.nazwa); }
      return;
    }
    if (t.dataset.del !== undefined) { state.confirm = t.dataset.del; return wypelnijWyceny(); }
    if (t.dataset.delNo !== undefined) { state.confirm = null; return wypelnijWyceny(); }
    if (t.dataset.delYes !== undefined) {
      try { await Store.usunWycene(t.dataset.delYes); toast("Usunięto"); } catch (er) { toast("Nie udało się usunąć wyceny."); }
      state.confirm = null; return wypelnijWyceny();
    }
    /* szablony */
    var s = szEdytowany();
    if (t.id === "szPusty") {
      var np = E.szablonPusty(); np.id = "s" + Date.now().toString(36);
      szablony.push(np); state.edytowany = np.id; zapiszSzablony(); wypelnijSzablony(); $("szablon").value = szablonAktywny().id; render();
      toast("Utworzono pusty szablon. Wpisz nazwę, MP, osobodni, ceny i tabele."); return;
    }
    if (t.id === "szNowy") {
      var n = E.uzupelnijSzablon(kopia(s)); n.id = "s" + Date.now().toString(36); n.nazwa = s.nazwa + " (kopia)"; n.wbudowany = false;
      szablony.push(n); state.edytowany = n.id; zapiszSzablony(); wypelnijSzablony(); $("szablon").value = szablonAktywny().id; render();
      toast("Utworzono szablon „" + n.nazwa + "”. Zmień nazwę i ceny."); return;
    }
    if (t.id === "szReset") {
      var b = E.szablonyWbudowane().filter(function (x) { return x.id === s.id; })[0];
      if (b) { szablony[szablony.indexOf(s)] = b; zapiszSzablony(); wypelnijSzablony(); $("szablon").value = szablonAktywny().id; buildDimTable(); recalc(); toast("Przywrócono domyślne wartości " + b.nazwa); }
      return;
    }
    if (t.id === "szUsun") { state.szUsun = true; render(); return; }
    if (t.id === "szUsunNie") { state.szUsun = false; render(); return; }
    if (t.id === "szUsunTak") {
      szablony = szablony.filter(function (x) { return x !== s; }); state.szUsun = false; state.edytowany = null;
      if (state.dane.szablon === s.id) state.dane.szablon = szablony[0].id;
      zapiszSzablony(); wypelnijSzablony(); $("szablon").value = szablonAktywny().id; buildDimTable(); recalc(); toast("Usunięto szablon"); return;
    }
    if (t.dataset.szadd) {
      if (t.dataset.szadd === "glebokosci") s.glebokosci.push({ cm: 230, doplata: 0, silownik: "2250" });
      else s.skladowe.push({ nazwa: "Nowa pozycja", cena: 0, ilS: 0, ilD: 0, grupa: "Mechanika" });
      zapiszSzablony(); buildDimTable(); state.dane = fromForm(); recalc(); return;
    }
    if (t.dataset.szdel) {
      var p = t.dataset.szdel.split("."); s[p[0]].splice(+p[1], 1);
      zapiszSzablony(); buildDimTable(); state.dane = fromForm(); recalc(); return;
    }
    if (t.id === "szExport") { var txt = JSON.stringify({ szablony: szablony }); $("szIo").value = txt; return copyText(txt, "Skopiowano eksport szablonów", "szIo"); }
    if (t.id === "szImport") {
      try {
        var o = JSON.parse($("szIo").value), lista = (o.szablony || []).map(E.uzupelnijSzablon);
        if (!lista.length) throw new Error("pusty");
        lista.forEach(function (x) { var i = szablony.map(function (y) { return y.id; }).indexOf(x.id); if (i >= 0) szablony[i] = x; else szablony.push(x); });
        zapiszSzablony(); wypelnijSzablony(); $("szablon").value = szablonAktywny().id; buildDimTable(); recalc(); toast("Zaimportowano szablony: " + lista.length);
      } catch (er) { toast("Nie udało się odczytać tekstu. Wklej cały eksport szablonów."); }
    }
  });

  /* --- zdarzenia: panel oferty --- */
  var pvTimer = null;
  function odswiezPodglad() { clearTimeout(pvTimer); pvTimer = setTimeout(renderPodglad, 200); }
  $("ovForm").addEventListener("input", function (e) {
    var t = e.target, o = state.dane.oferta;
    if (t.dataset.of && t.type !== "checkbox" && t.tagName !== "SELECT") {
      var path = t.dataset.of.split("."), v = t.value;
      if (path[0] === "ceny") { if (v === "") delete o.ceny[path[1]]; else o.ceny[path[1]] = Number(v); }
      else if (path[0] === "tekst") { o.tekst[path[1]] = v; var tag = $("tag_" + path[1]); if (tag) { tag.textContent = "zmieniony"; tag.classList.add("ch"); tag.nextElementSibling.hidden = false; } }
      else if (path[0] === "adr") o.adr[path[1]] = v;
      else if (path[0] === "wysPary") { o.wysPary = o.wysPary || []; var pw = o.wysPary[+path[1]] = o.wysPary[+path[1]] || {}; pw[path[2]] = v === "" ? "" : Number(v); }
      else o[path[0]] = t.type === "number" ? (v === "" ? "" : Number(v)) : v;
      if (path[0] === "hd" || path[0] === "hg" || path[0] === "wysPary") { wynik = E.oblicz(state.dane, szablonAktywny()); }
      lsSet(LS.draft, { dane: state.dane });
      odswiezPodglad();
    }
    if (t.dataset.tx) { var tx = Store.get("tekstyOferty", {}) || {}; tx[t.dataset.tx] = t.value; Store.set("tekstyOferty", tx); odswiezPodglad(); }
  });
  $("ovForm").addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.of && (t.type === "checkbox" || t.tagName === "SELECT")) {
      var path = t.dataset.of.split(".");
      if (path[0] === "opcje") state.dane.oferta.opcje[path[1]] = t.checked;
      else if (path[0] === "adr") state.dane.oferta.adr[path[1]] = t.value;
      else state.dane.oferta[path[0]] = t.value;
      lsSet(LS.draft, { dane: state.dane });
      renderOfertaForm(); renderPodglad(); return;
    }
    if ((t.id === "logoFile" || t.id === "podpisFile") && t.files && t.files[0]) {
      var klucz = t.id === "logoFile" ? LS.logo : LS.podpis, wys = t.id === "logoFile" ? 58 : 47, fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () { lsSet(klucz, { dataUrl: fr.result, w: Math.round(img.width * wys / img.height), h: wys }); renderOfertaForm(); renderPodglad(); toast(t.id === "logoFile" ? "Wgrano logo" : "Wgrano podpis"); };
        img.src = fr.result;
      };
      fr.readAsDataURL(t.files[0]);
    }
  });
  $("ovForm").addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.ofzysk) { state.dane.oferta.zysk = t.dataset.ofzysk; lsSet(LS.draft, { dane: state.dane }); renderOfertaForm(); renderPodglad(); return; }
    if (t.dataset.reset) { delete state.dane.oferta.tekst[t.dataset.reset]; renderOfertaForm(); renderPodglad(); return; }
    if (t.id === "bNowyNr") { state.dane.oferta.nrAuto = nadajNumer(); renderOfertaForm(); renderPodglad(); return; }
    if (t.id === "bSzReset") { Store.set("tekstyOferty", {}); renderOfertaForm(); renderPodglad(); toast("Przywrócono teksty stałe"); return; }
    if (t.id === "bLogoDel") { try { localStorage.removeItem(LS.logo); } catch (er) { /* brak pamięci */ } renderOfertaForm(); renderPodglad(); return; }
    if (t.id === "bPodpisDel") { try { localStorage.removeItem(LS.podpis); } catch (er) { /* brak pamięci */ } renderOfertaForm(); renderPodglad(); }
  });
  document.querySelectorAll("[data-ovview]").forEach(function (b) { b.addEventListener("click", function () { state.ovView = b.dataset.ovview; ustawWidokOv(); }); });

  function copyText(txt, msg, selId) {
    function fallback() { var el = $(selId); if (!el) return; if (el.select) el.select(); else { var rg = document.createRange(); rg.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(rg); } toast("Zaznaczono tekst. Skopiuj Ctrl+C"); }
    try { navigator.clipboard.writeText(txt).then(function () { toast(msg); }, fallback); } catch (e) { fallback(); }
  }

  /* --- start --- */
  (async function start() {
    szablony = E.szablonyWbudowane();
    wypelnijSzablony();
    var draft = lsGet(LS.draft, null);
    setDane(draft && draft.dane ? draft.dane : Object.assign(E.domyslneDane(), { data: dzis() }));
    await Store.init();
    wczytajSzablony(); wypelnijSzablony();
    $("szablon").value = szablonAktywny().id; buildDimTable();
    var tag = $("storeTag"); tag.hidden = false;
    tag.textContent = Store.db ? "Zapis przy kalkulatorze" : "Zapis w tej przeglądarce";
    tag.title = Store.db ? "Szablony, wyceny i numery ofert zapisują się trwale i są dostępne na każdym urządzeniu." : "Baza kalkulatora jest niedostępna w tym widoku. Dane zostają tylko w tej przeglądarce.";
    tag.classList.toggle("ok", !!Store.db);
    recalc();
  })();
})();
</script>
