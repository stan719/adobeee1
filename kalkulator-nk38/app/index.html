<title>Kalkulator NK38</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: formularz po lewej (jak arkusz Dane), wynik przyklejony po prawej; na telefonie jedna kolumna + pasek ceny u dołu. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --sunken: #f6f8fa; --ink: #16202b; --muted: #5a6774;
  --line: #d6dce2; --accent: #d99a00; --accent-soft: #fff4d6; --steel: #1f4f7a; --steel-soft: #e3edf6;
  --good: #1d7a46; --good-soft: #e1f3e8; --bad: #b3261e; --bad-soft: #fbe5e3; --warn: #8a5a00; --warn-soft: #fdf0d2;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141a; --surface: #161f28; --sunken: #121a22; --ink: #e5eaef; --muted: #93a1ae;
  --line: #2a3643; --accent: #f0b72f; --accent-soft: #3a2f12; --steel: #7fb2e0; --steel-soft: #1b2b3b;
  --good: #5fc68b; --good-soft: #16301f; --bad: #ff8a80; --bad-soft: #3a1c1a; --warn: #f0c060; --warn-soft: #33290f;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #161f28; --sunken: #121a22; --ink: #e5eaef; --muted: #93a1ae;
  --line: #2a3643; --accent: #f0b72f; --accent-soft: #3a2f12; --steel: #7fb2e0; --steel-soft: #1b2b3b;
  --good: #5fc68b; --good-soft: #16301f; --bad: #ff8a80; --bad-soft: #3a1c1a; --warn: #f0c060; --warn-soft: #33290f;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 96px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
.num, input[type=number], .tab-num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }

/* nagłówek */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); margin-bottom: 18px; }
.brand h1 { font-size: 30px; font-weight: 700; line-height: 1; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: var(--r); font-size: 14px; font-weight: 500; }
.btn:hover { border-color: var(--steel); color: var(--steel); }
.btn.primary { background: var(--steel); border-color: var(--steel); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.08); color: var(--surface); }
.btn.small { padding: 4px 9px; font-size: 13px; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }

.layout { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr); } }

/* formularz */
.form { display: flex; flex-direction: column; gap: 14px; }
fieldset { margin: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 12px 14px 14px; min-width: 0; }
legend { font-family: var(--f-display); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 6px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 12px; }
@media (max-width: 460px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.full { grid-column: 1 / -1; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); min-width: 0; }
label.f .hint { font-size: 11.5px; color: var(--muted); opacity: .85; }
input, select, textarea { font: inherit; color: var(--ink); background: var(--accent-soft); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px; padding: 6px 8px; width: 100%; min-width: 0; }
input[type=number] { text-align: right; }
input::placeholder { color: var(--muted); opacity: .8; }
input.auto { background: var(--sunken); border-left-color: var(--line); }
textarea { resize: vertical; min-height: 60px; background: var(--sunken); border-left-color: var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--muted); padding: 6px 12px; font-size: 14px; }
.seg button[aria-pressed=true] { background: var(--steel); color: var(--surface); }
details { border-top: 1px dashed var(--line); margin-top: 10px; padding-top: 8px; }
summary { cursor: pointer; font-size: 13.5px; font-weight: 600; color: var(--steel); }
.dimtab { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
.dimtab th { text-align: left; font-weight: 500; color: var(--muted); padding: 3px 4px; }
.dimtab th.c { text-align: center; width: 84px; }
.dimtab td { padding: 2px 4px; }
.dimtab td.std { text-align: right; padding-right: 12px; color: var(--muted); font-family: var(--f-num); }
.dimtab input { padding: 3px 6px; }
.note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

/* wynik */
.result { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 980px) { .result { position: static; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.hero { padding: 14px 16px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
@media (max-width: 720px) { .hero { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 14px; } }
.var { padding: 0 12px; border-left: 1px solid var(--line); min-width: 0; }
.var:first-child { border-left: 0; padding-left: 0; }
@media (max-width: 720px) { .var:nth-child(3) { border-left: 0; padding-left: 0; } }
.var .lab { font-family: var(--f-display); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.var .price { font-family: var(--f-num); font-size: clamp(17px, 1.9vw, 22px); font-weight: 500; margin-top: 2px; white-space: nowrap; }
.var:first-child .price { color: var(--steel); }
.var .sub { font-size: 12.5px; color: var(--muted); font-family: var(--f-num); }
.var .time { margin-top: 6px; display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 10px; background: var(--steel-soft); color: var(--steel); font-weight: 600; }
.alerts { display: flex; flex-direction: column; gap: 6px; }
.alert { padding: 7px 12px; border-radius: var(--r); font-size: 13.5px; }
.alert.blad { background: var(--bad-soft); color: var(--bad); }
.alert.uwaga { background: var(--warn-soft); color: var(--warn); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 10px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 12px 9px; color: var(--muted); font-family: var(--f-display); font-weight: 600; font-size: 15px; border-bottom: 3px solid transparent; white-space: nowrap; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
.tabpane { padding: 14px 16px 16px; min-width: 0; }
.scroll { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.t th, table.t td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; white-space: normal; min-width: 150px; }
table.t thead th { font-family: var(--f-display); font-weight: 600; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 2px solid var(--ink); }
table.t td { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
table.t td:first-child { font-family: var(--f-body); }
table.t tr.strong td { font-weight: 600; }
table.t tr.total td { font-weight: 600; background: var(--good-soft); }
table.t tr.sep td { border-bottom: 0; padding: 4px; }
table.t tr.grp td { font-family: var(--f-display); font-weight: 600; color: var(--muted); text-transform: uppercase; font-size: 12px; letter-spacing: .06em; padding-top: 12px; }
table.t td.best { background: var(--good-soft); color: var(--good); font-weight: 600; }
table.t td.cur { box-shadow: inset 0 -2px 0 var(--steel); }
h3.sec { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 8px; }
h3.sec:first-child { margin-top: 0; }
.bars { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; font-size: 13.5px; }
.bar { height: 14px; background: var(--sunken); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--steel); opacity: .55; }
.bar.best i { background: var(--good); opacity: .8; }
.bars .v { font-family: var(--f-num); text-align: right; white-space: nowrap; }
.offer { font-family: var(--f-num); font-size: 13px; background: var(--sunken); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; white-space: pre-wrap; overflow-x: auto; margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.muted { color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 6px 12px; align-items: center; font-size: 13.5px; }
.kv input { padding: 4px 6px; }
.kv .src { grid-column: 1 / -1; margin-top: -4px; font-size: 11.5px; color: var(--muted); }
ul.notes { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; max-width: 70ch; }
.saved { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.saved .it { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--sunken); flex-wrap: wrap; }
.saved .it b { font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: var(--r); font-size: 14px; z-index: 30; }
.mbar { display: none; }
@media (max-width: 980px) {
  .mbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; justify-content: space-between; align-items: center; gap: 10px;
    background: var(--surface); border-top: 2px solid var(--accent);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .mbar .p { font-family: var(--f-num); font-size: 17px; font-weight: 500; }
  .mbar .s { font-size: 12px; color: var(--muted); }
}
.example { font-size: 12.5px; padding: 4px 10px; border-radius: 10px; background: var(--accent-soft); color: var(--warn); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Kalkulator <span>NK38</span></h1>
      <p id="projline">Cena kontraktu: urządzenia + montaż + narzuty</p>
    </div>
    <div class="actions">
      <span class="example" id="exampleTag" hidden>Przykład</span>
      <button class="btn" id="bNew" type="button">Nowa wycena</button>
      <button class="btn" id="bWaw" type="button">Przykład WAW</button>
      <button class="btn" id="bKrk" type="button">Przykład KRK</button>
      <button class="btn primary" id="bSave" type="button">Zapisz wycenę</button>
    </div>
  </header>

  <div class="layout">
    <form class="form" id="form" autocomplete="off">
      <fieldset>
        <legend>Inwestycja</legend>
        <div class="grid2">
          <label class="f full">Nazwa / adres<input id="nazwa" type="text" placeholder="ul. Kasprowicza 18 Warszawa"></label>
          <label class="f">Data oferty<input id="data" type="date"></label>
          <label class="f">Nr oferty / handlowiec<input id="nr" type="text" placeholder="20261014-SNK"></label>
          <label class="f full">Opis / wariant<input id="opis" type="text" placeholder="H-195 | L-530 | P-380 | ..."></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Lokalizacja</legend>
        <div class="grid2">
          <div class="full row"><div class="seg" role="group" aria-label="Lokalizacja">
            <button type="button" id="lokKrk">Kraków</button><button type="button" id="lokPoza">Poza Krakowem</button>
          </div><span class="note" id="lokNote"></span></div>
          <label class="f">Odległość od Krakowa [km]<input id="km" type="number" min="0" step="1"><span class="hint">faktyczna, w jedną stronę</span></label>
          <div></div>
          <label class="f">Km na pomiary / odbiory<input id="km_pom" type="number" min="0" class="auto"><span class="hint">puste = automatycznie</span></label>
          <label class="f">Km na montaż<input id="km_mon" type="number" min="0" class="auto"><span class="hint">puste = odległość + 50</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Urządzenia</legend>
        <div class="grid3">
          <label class="f">Typ<select id="typ"><option>NK38</option><option>NK37</option></select></label>
          <label class="f">Platformy S<input id="S" type="number" min="0" step="1"><span class="hint">2 MP</span></label>
          <label class="f">Platformy D<input id="D" type="number" min="0" step="1"><span class="hint">4 MP</span></label>
          <label class="f">Systemy N.P.<input id="NP" type="number" min="0" step="1"><span class="hint">2 MP, jak D</span></label>
          <label class="f">Agregaty<input id="agregaty" type="number" min="0" step="1"><span class="hint">wg układu garażu</span></label>
          <label class="f">Magistrala 6 m<input id="magistrala" type="number" min="0" step="1"></label>
          <label class="f">Barierki<input id="barierki" type="number" min="0" step="1"><span class="hint">szt. na stronę</span></label>
          <label class="f">Maskownice<input id="maskownice" type="number" min="0" step="1"></label>
          <label class="f">Utrudnienia +<input id="utr_dod" type="number" min="0" step="0.5"><span class="hint" id="utrHint">osobodni ręcznie</span></label>
        </div>
        <details id="dimDetails">
          <summary>Wymiary niestandardowe <span class="muted" id="dimSummary"></span></summary>
          <p class="note">Wpisz, ile platform ma dany wymiar. Pozostałe są standardowe (szer. 250/500, zagłębienie 170, długość 530).</p>
          <table class="dimtab" id="dimTable"></table>
        </details>
      </fieldset>

      <fieldset>
        <legend>Transport i ekipa</legend>
        <div class="grid2">
          <label class="f">Liczba TIR<input id="tir" type="number" min="0" step="1"></label>
          <label class="f">Cena / TIR [zł]<input id="tir_cena" type="number" min="0" step="100"><span class="hint">KRK 1600, WAW/WRO 3300, POZ/ZG 4500</span></label>
          <label class="f">Rozładunek sprzęt / TIR [zł]<input id="rozl_cena" type="number" min="0" step="100"><span class="hint">WAW 1700, KRK 500</span></label>
          <label class="f">Dni rozładunku<input id="rozl_dni" type="number" min="0" step="0.5" class="auto"><span class="hint">puste = 0,5 / TIR</span></label>
          <label class="f">Osób na montażu<input id="osoby" type="number" min="1" max="12" step="1"><span class="hint">500 / 400 / kolejne 350 zł</span></label>
          <label class="f">Tygodnie montażu<input id="wyjazdy" type="number" min="0" step="1" class="auto"><span class="hint">puste = automatycznie</span></label>
          <label class="f full">Czas podróży<select id="wzor"><option value="stary">Stary wzór (poprawiony dla ≥ 800 km)</option><option value="uproszczony">Uproszczony: 650 km dziennie</option></select></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Narzuty</legend>
        <div class="grid2">
          <label class="f">Zysk [%]<input id="zysk" type="number" min="0" max="60" step="0.5"></label>
          <label class="f">Zysk do sprawdzenia [%]<input id="zysk_min" type="number" min="0" max="60" step="0.5"><span class="hint">do ilu możemy zejść</span></label>
          <label class="f">Dopłata Q=2500 [%]<input id="q2500" type="number" min="0" max="50" step="0.5" class="auto"><span class="hint">puste = 7%</span></label>
          <label class="f">Kurs EUR/PLN<input id="eur" type="number" min="0" step="0.001"></label>
        </div>
      </fieldset>
    </form>

    <section class="result" aria-live="polite">
      <div class="panel hero" id="hero"></div>
      <div class="alerts" id="alerts"></div>
      <div class="panel">
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="tabpane" id="pane"></div>
      </div>
    </section>
  </div>
</div>
<div class="mbar" id="mbar"></div>
<div class="toast" id="toast" hidden></div>

<script src="nk38-engine.js"></script>

  ];
  var TABS = [["wynik", "Wynik"], ["ekipa", "Ekipa"], ["oferta", "Do oferty"], ["obl", "Obliczenia"], ["wyceny", "Wyceny"], ["cennik", "Cennik"], ["uwagi", "Uwagi"]];

  var $ = function (id) { return document.getElementById(id); };
  var fmtPLN = new Intl.NumberFormat("pl-PL", { maximumFractionDigits: 0 });
  var fmt2 = new Intl.NumberFormat("pl-PL", { maximumFractionDigits: 2 });
  function zl(v) { return fmtPLN.format(Math.round(v)) + " zł"; }
  function eur(v) { return fmtPLN.format(Math.round(v)) + " €"; }
  function n2(v) { return fmt2.format(v); }
  function pct(v) { return fmt2.format(v * 100) + "%"; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* brak pamięci przeglądarki */ } }

  var state = { dane: null, tab: lsGet(LS_TAB, "wynik"), przyklad: null, cennik: lsGet(LS_CENNIK, {}), confirm: null };
  var wynik = null;

  function toast(t) {
    var el = $("toast"); el.textContent = t; el.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2200);
  }

  /* --- formularz <-> dane --- */
  function buildDimTable() {
    var h = '<thead><tr><th>Zagłębienie</th><th class="c">S</th><th class="c">D</th></tr></thead><tbody>';
    h += '<tr><td>170 cm (standard)</td><td class="std" id="std_S"></td><td class="std" id="std_D"></td></tr>';
    E.GLEBOKOSCI.forEach(function (cm) {
      h += '<tr><td>' + cm + ' cm</td><td><input type="number" min="0" step="1" id="glS_' + cm + '"></td><td><input type="number" min="0" step="1" id="glD_' + cm + '"></td></tr>';
    });
    h += '<tr><th colspan="3" style="padding-top:10px">Szerokość i długość</th></tr>';
    DIMS.forEach(function (d) {
      h += '<tr><td>' + d[1] + '</td><td><input type="number" min="0" step="1" id="' + d[0] + '_S"></td><td><input type="number" min="0" step="1" id="' + d[0] + '_D"></td></tr>';
    });
    $("dimTable").innerHTML = h + "</tbody>";
  }

  function toForm(d) {
    TXTF.forEach(function (k) { $(k).value = d[k] == null ? "" : d[k]; });
    NUMF.forEach(function (k) { $(k).value = d[k] == null ? "" : d[k]; });
    PCTF.forEach(function (k) { $(k).value = d[k] == null ? "" : +(d[k] * 100).toFixed(4); });
    E.GLEBOKOSCI.forEach(function (cm) {
      $("glS_" + cm).value = d.gl_S && d.gl_S[cm] ? d.gl_S[cm] : "";
      $("glD_" + cm).value = d.gl_D && d.gl_D[cm] ? d.gl_D[cm] : "";
    });
    DIMS.forEach(function (x) {
      $(x[0] + "_S").value = d[x[0] + "_S"] || ""; $(x[0] + "_D").value = d[x[0] + "_D"] || "";
    });
    var anyDim = Object.keys(d.gl_S || {}).length + Object.keys(d.gl_D || {}).length +
      DIMS.reduce(function (a, x) { return a + (d[x[0] + "_S"] || 0) + (d[x[0] + "_D"] || 0); }, 0);
    $("dimDetails").open = anyDim > 0;
    lokButtons(d.lok);
  }

  function fromForm() {
    var d = E.domyslneDane();
    d.lok = state.dane ? state.dane.lok : d.lok;
    d.analiza = state.dane ? state.dane.analiza : 0;
    TXTF.forEach(function (k) { d[k] = $(k).value; });
    NUMF.forEach(function (k) {
      var v = $(k).value;
      d[k] = v === "" ? (OPTF[k] ? null : (k === "osoby" ? 4 : (k === "eur" ? 4.325 : 0))) : Number(v);
    });
    PCTF.forEach(function (k) {
      var v = $(k).value; d[k] = v === "" ? (OPTF[k] ? null : 0) : Number(v) / 100;
    });
    d.gl_S = {}; d.gl_D = {};
    E.GLEBOKOSCI.forEach(function (cm) {
      var s = Number($("glS_" + cm).value || 0), dd = Number($("glD_" + cm).value || 0);
      if (s) d.gl_S[cm] = s; if (dd) d.gl_D[cm] = dd;
    });
    DIMS.forEach(function (x) {
      d[x[0] + "_S"] = Number($(x[0] + "_S").value || 0); d[x[0] + "_D"] = Number($(x[0] + "_D").value || 0);
    });
    return d;
  }

  function lokButtons(lok) {
    $("lokKrk").setAttribute("aria-pressed", lok === "Kraków");
    $("lokPoza").setAttribute("aria-pressed", lok !== "Kraków");
    $("lokNote").textContent = lok === "Kraków" ? "montaż w dniach, 20 km, bez hotelu i diet" : "montaż w tygodniach, hotel i diety";
    $("km").disabled = lok === "Kraków";
  }

  function setDane(d, przyklad) {
    state.dane = Object.assign(E.domyslneDane(), d);
    state.przyklad = przyklad || null;
    toForm(state.dane);
    recalc();
  }

  /* --- obliczenia i render --- */
  function recalc() {
    wynik = E.oblicz(state.dane, state.cennik);
    lsSet(LS_DRAFT, { dane: state.dane, przyklad: state.przyklad });
    render();
  }

  function render() {
    var r = wynik, d = r.dane, m = r.mat;
    $("exampleTag").hidden = !state.przyklad;
    $("exampleTag").textContent = state.przyklad ? "Przykład: " + state.przyklad : "";
    $("projline").textContent = (d.nazwa || "Nowa wycena") + " · " + d.typ + " · " + m.platformy + " platform · " + m.MP + " MP";
    $("std_S").textContent = Math.max(0, (d.S || 0) - sumO(d.gl_S));
    $("std_D").textContent = Math.max(0, (d.D || 0) - sumO(d.gl_D));
    $("utrHint").textContent = "auto z magistrali i barierek: " + n2(m.utrAuto) + " osd";
    $("km_pom").placeholder = String(r.wspolne.kmPom);
    $("km_mon").placeholder = String(r.wspolne.kmMon);
    $("rozl_dni").placeholder = n2(r.wspolne.rozl);
    $("wyjazdy").placeholder = String(r.warianty[0].iteracje[4]);
    $("q2500").placeholder = n2(r.cennik.q2500 * 100);
    var ds = [];
    E.GLEBOKOSCI.forEach(function (cm) { var s = d.gl_S[cm] || 0, dd = d.gl_D[cm] || 0; if (s || dd) ds.push(cm + " cm"); });
    $("dimSummary").textContent = ds.length ? "· " + ds.join(", ") : "";

    var jed = r.wspolne.krk ? "dni" : "tyg.";
    $("hero").innerHTML = r.warianty.map(function (w) {
      return '<div class="var"><div class="lab">' + esc(w.nazwa) + '</div><div class="price">' + zl(w.cena) +
        '</div><div class="sub">' + zl(w.cenaMP) + ' / MP · ' + eur(w.cenaMPeur) + '</div><span class="time">' +
        w.wyjazdy + ' ' + jed + ' · ' + w.dni + ' dni pracy</span></div>';
    }).join("");
    $("alerts").innerHTML = r.ostrzezenia.map(function (a) {
      return '<div class="alert ' + a.typ + '">' + (a.typ === "blad" ? "Błąd: " : "Uwaga: ") + esc(a.tekst) + "</div>";
    }).join("");
    var w0 = r.warianty[0];
    $("mbar").innerHTML = '<div><div class="s">2000 kg · ' + w0.wyjazdy + ' ' + jed + '</div><div class="p">' + zl(w0.cena) +
      '</div></div><div style="text-align:right"><div class="s">2500 kg</div><div class="p">' + zl(r.warianty[1].cena) + '</div></div>';

    $("tabs").innerHTML = TABS.map(function (t) {
      return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + "</button>";
    }).join("");
    $("pane").innerHTML = ({ wynik: paneWynik, ekipa: paneEkipa, oferta: paneOferta, obl: paneObl, wyceny: paneWyceny, cennik: paneCennik, uwagi: paneUwagi }[state.tab] || paneWynik)();
  }

  function sumO(o) { var s = 0; for (var k in o) s += Number(o[k] || 0); return s; }

  function tableRows(rows, ws) {
    return rows.map(function (row) {
      if (row === "sep") return '<tr class="sep"><td colspan="' + (ws.length + 1) + '"></td></tr>';
      if (typeof row === "string") return '<tr class="grp"><td colspan="' + (ws.length + 1) + '">' + row + "</td></tr>";
      return '<tr class="' + (row[2] || "") + '"><td>' + row[0] + "</td>" + ws.map(function (w) { return "<td>" + row[1](w) + "</td>"; }).join("") + "</tr>";
    }).join("");
  }

  function paneWynik() {
    var r = wynik, ws = r.warianty, jed = r.wspolne.krk ? "dni" : "tygodnie";
    var h = '<div class="scroll"><table class="t"><thead><tr><th>Wariant</th>' + ws.map(function (w) { return "<th>" + esc(w.nazwa) + "</th>"; }).join("") + "</tr></thead><tbody>";
    h += tableRows([
      ["Cena kontraktu netto", function (w) { return zl(w.cena); }, "total"],
      ["Cena za MP", function (w) { return zl(w.cenaMP); }],
      ["Cena za MP [EUR]", function (w) { return eur(w.cenaMPeur); }],
      ["Cena minimalna (zysk " + pct(r.dane.zysk_min) + ")", function (w) { return zl(w.cenaMin); }, "strong"],
      ["Zysk (" + pct(r.dane.zysk) + ")", function (w) { return zl(w.zysk); }],
      ["Koszt rzeczywisty", function (w) { return zl(w.koszt); }],
      "Struktura",
      ["Urządzenia", function (w) { return zl(w.koszty.urzadzenia); }],
      ["Słupki e-ładowarek", function (w) { return zl(w.koszty.slupki); }],
      ["Transport, dźwig, rozładunek", function (w) { return zl(w.koszty.transport + w.koszty.dzwig + w.koszty.rozladunek_sprzet); }],
      ["Robocizna", function (w) { return zl(w.koszty.montaz + w.koszty.rozladunek_ludzie + w.koszty.dojazdy); }],
      ["Hotel, diety, paliwo", function (w) { return zl(w.koszty.hotel + w.koszty.diety + w.koszty.paliwo); }],
      ["KOB + GDW + podatek", function (w) { return zl(w.kob + w.gdw + w.podatek); }],
      "Czas",
      ["Dni pracy ekipy", function (w) { return w.dni; }, "strong"],
      ["Montaż (" + jed + ")", function (w) { return w.wyjazdy; }, "strong"],
      ["Osobodni razem", function (w) { return n2(w.osobodni); }]
    ], ws);
    h += "</tbody></table></div>";
    h += '<h3 class="sec">Opcje do oferty (cena z narzutami)</h3><div class="scroll"><table class="t"><thead><tr><th>Opcja</th><th>Q=2000 kg</th><th>Q=2500 kg</th></tr></thead><tbody>';
    h += "<tr><td>Słupki e-ładowarek 3,7 kW (z robocizną)</td><td>" + zl(r.opcje.slupki37[0]) + "</td><td>" + zl(r.opcje.slupki37[1]) + "</td></tr>";
    h += "<tr><td>Słupki e-ładowarek 22 kW (z robocizną)</td><td>" + zl(r.opcje.slupki22[0]) + "</td><td>" + zl(r.opcje.slupki22[1]) + "</td></tr>";
    h += "<tr><td>Malowanie proszkowe RAL</td><td>" + zl(r.opcje.malowanie) + "</td><td>" + zl(r.opcje.malowanie) + "</td></tr>";
    return h + "</tbody></table></div>";
  }

  function paneEkipa() {
    var r = wynik, an = r.analiza, min = Math.min.apply(null, an.map(function (a) { return a.cena; }));
    var max = Math.max.apply(null, an.map(function (a) { return a.cena; })), base = min - (max - min) * 0.6 - 1;
    var jed = r.wspolne.krk ? "dni" : "tyg.";
    var h = '<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="muted">Ta sama wycena przy różnej liczbie osób. Wariant:</div>' +
      '<select id="analizaSel" style="width:auto">' + E.WARIANTY.map(function (w, i) { return "<option value=\"" + i + "\"" + (r.dane.analiza == i ? " selected" : "") + ">" + w + "</option>"; }).join("") + "</select></div>";
    h += '<div class="bars">' + an.map(function (a) {
      var best = a.cena === min, cur = a.n === r.warianty[0].osoby;
      return "<div><b>" + a.n + " os.</b>" + (cur ? ' <span class="muted">·</span>' : "") + '</div><div class="bar' + (best ? " best" : "") + '"><i style="width:' +
        Math.max(3, (a.cena - base) / (max - base) * 100).toFixed(1) + '%"></i></div><div class="v">' + zl(a.cena) + "</div>";
    }).join("") + "</div>";
    h += '<div class="scroll" style="margin-top:14px"><table class="t"><thead><tr><th>Liczba osób</th>' + an.map(function (a) { return "<th>" + a.n + "</th>"; }).join("") + "</tr></thead><tbody>";
    function row(lab, f, cls) {
      return "<tr><td>" + lab + "</td>" + an.map(function (a) {
        var c = (cls && a.cena === min ? "best" : "") + (a.n === r.warianty[0].osoby ? " cur" : "");
        return '<td class="' + c + '">' + f(a) + "</td>";
      }).join("") + "</tr>";
    }
    h += row("Cena kontraktu", function (a) { return zl(a.cena); }, true);
    var ref = r.warianty[r.dane.analiza].cena;
    h += row("Różnica do wpisanej liczby osób", function (a) { var dlt = Math.round(a.cena - ref); return (dlt > 0 ? "+" : "") + fmtPLN.format(dlt); });
    h += row("Średnia stawka", function (a) { return zl(a.stawka); });
    h += row("Dni pracy", function (a) { return a.dni; });
    h += row("Montaż (" + jed + ")", function (a) { return a.wyjazdy; });
    h += row("Hotel + diety", function (a) { return zl(a.koszty.hotel + a.koszty.diety); });
    h += row("Robocizna", function (a) { return zl(a.koszty.montaz + a.koszty.dojazdy + a.koszty.rozladunek_ludzie); });
    h += "</tbody></table></div><p class=\"note\">Zielone = najtańsza liczba osób, podkreślone = liczba osób wpisana w formularzu. Jeśli tygodnie montażu są wpisane ręcznie, analiza też ich używa. Wyczyść to pole, żeby porównać liczbę osób.</p>";
    return h;
  }

  function ofertaText() {
    var r = wynik, d = r.dane, m = r.mat, w = r.wspolne, ws = r.warianty, jed = w.krk ? "dni" : "tyg.";
    var urz = [d.S ? d.S + " × S (2 MP)" : "", d.D ? d.D + " × D (4 MP)" : "", d.NP ? d.NP + " × N.P." : ""].filter(Boolean).join(", ");
    var gl = E.GLEBOKOSCI.filter(function (cm) { return d.gl_S[cm] || d.gl_D[cm]; }).map(function (cm) {
      return cm + " cm: " + [d.gl_S[cm] ? d.gl_S[cm] + "S" : "", d.gl_D[cm] ? d.gl_D[cm] + "D" : ""].filter(Boolean).join("+");
    });
    var dims = DIMS.filter(function (x) { return d[x[0] + "_S"] || d[x[0] + "_D"]; }).map(function (x) {
      return x[1] + ": " + [d[x[0] + "_S"] ? d[x[0] + "_S"] + "S" : "", d[x[0] + "_D"] ? d[x[0] + "_D"] + "D" : ""].filter(Boolean).join("+");
    });
    var L = [];
    L.push((d.nazwa || "Inwestycja") + (d.data ? "  |  " + d.data : "") + (d.nr ? "  |  " + d.nr : ""));
    if (d.opis) L.push(d.opis);
    L.push("");
    L.push("Urządzenia:        " + d.typ + " " + (urz || "-") + " = " + m.MP + " MP");
    L.push("Agregaty:          " + (d.agregaty || 0) + " szt.");
    L.push("Zagłębienia:       " + (gl.length ? gl.join("; ") : "standard 170 cm"));
    L.push("Wymiary:           " + (dims.length ? dims.join("; ") : "standard"));
    L.push("Magistrala EXTRA:  " + (d.magistrala || 0) + " × 6 m");
    L.push("Barierki:          " + (d.barierki || 0) + " szt. na stronę, maskownice " + (d.maskownice || 0) + " szt.");
    L.push("Utrudnienia:       " + n2(m.utr) + " osd (auto " + n2(m.utrAuto) + ", ręcznie " + n2(d.utr_dod || 0) + ")");
    L.push("Lokalizacja:       " + d.lok + (w.krk ? "" : " (" + (d.km || 0) + " km od Krakowa)") + ", pomiary " + w.kmPom + " km, montaż " + w.kmMon + " km");
    L.push("Transport:         " + (d.tir || 0) + " TIR × " + zl(d.tir_cena || 0) + ", rozładunek " + zl(d.rozl_cena || 0) + "/TIR, " + n2(w.rozl) + " dni");
    L.push("Ekipa:             " + ws[0].osoby + " os., średnio " + zl(ws[0].stawka) + "/dzień; dźwig " + w.dzwDni + " dni");
    L.push("");
    L.push("Wariant                Cena netto     Cena/MP   Montaż");
    ws.forEach(function (x) {
      L.push(pad(x.nazwa, 20) + lpad(zl(x.cena), 14) + lpad(zl(x.cenaMP), 12) + "   " + x.wyjazdy + " " + jed + " (" + x.dni + " dni pracy)");
    });
    L.push("");
    L.push("Opcje:  słupki 3,7 kW +" + zl(r.opcje.slupki37[0]) + "  |  słupki 22 kW +" + zl(r.opcje.slupki22[0]) + "  |  malowanie RAL +" + zl(r.opcje.malowanie));
    L.push("Cena minimalna (zysk " + pct(d.zysk_min) + "): " + zl(ws[0].cenaMin) + " (2000 kg)");
    L.push("Konserwacja roczna: " + r.cennik.konserw.map(function (k) { return fmtPLN.format(k * m.MP * 12); }).join(" / ") + " zł (40 / 45 / 50 zł/MP/mies.)");
    return L.join("\n");
  }
  function pad(s, n) { s = String(s); return s.length >= n ? s : s + " ".repeat(n - s.length); }
  function lpad(s, n) { s = String(s); return s.length >= n ? s : " ".repeat(n - s.length) + s; }

  function paneOferta() {
    return '<div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="muted">Wpisane dane i wyniki potrzebne do napisania oferty.</div>' +
      '<button class="btn small" type="button" id="bCopy">Kopiuj</button></div><pre class="offer" id="offerText">' + esc(ofertaText()) + "</pre>";
  }

  function paneObl() {
    var r = wynik, m = r.mat, w = r.wspolne, ws = r.warianty;
    var h = '<h3 class="sec">Materiały i urządzenia</h3><div class="scroll"><table class="t"><tbody>';
    [["Cena platformy D / S / N.P.", zl(m.cenaD) + " / " + zl(m.cenaS) + " / " + zl(m.cenaNP)],
      ["Platformy S z dopłatami", zl(m.platS)], ["Platformy D z dopłatami", zl(m.platD)], ["Platformy N.P.", zl(m.platNP)],
      ["Siłowniki (pary): std / 2000 / 2250", m.sil.std + " / " + m.sil.s2000 + " / " + m.sil.s2250],
      ["Hydraulika", zl(m.hydraulika)], ["Barierki i maskownice", zl(m.barierki)], ["Elektryka", zl(m.elektryka)],
      ["Mechanika zakupowa i pozostałe", zl(m.mechanika)], ["Suma standard Q=2000 (dawne F87)", zl(m.suma2000)],
      ["Suma Q=2500 (dawne F90, +" + pct(m.q2500) + ")", zl(m.suma2500)]
    ].forEach(function (x, i) { h += '<tr class="' + (i >= 9 ? "strong" : "") + '"><td>' + x[0] + "</td><td>" + x[1] + "</td></tr>"; });
    h += '</tbody></table></div><h3 class="sec">Montaż</h3><p class="note" style="margin-top:-4px">Km pomiary ' + w.kmPom + " / montaż " + w.kmMon +
      " · podróże pomiary+odbiory " + n2(w.podrPom) + " osd · rozładunek " + n2(w.rozl) + " dni · dźwig " + w.dzwDni + " dni</p>";
    h += '<div class="scroll"><table class="t"><thead><tr><th>Pozycja</th>' + ws.map(function (x) { return "<th>" + esc(x.nazwa) + "</th>"; }).join("") + "</tr></thead><tbody>";
    h += tableRows([
      ["Osoby / średnia stawka", function (x) { return x.osoby + " / " + zl(x.stawka); }],
      ["Osobodni montażu (dawne F50)", function (x) { return n2(x.osd); }],
      ["Iteracje tygodni / dni", function (x) { return x.iteracje.join(" → "); }],
      ["Tygodnie / dni montażu (dawne B55)", function (x) { return x.wyjazdy; }, "strong"],
      ["Osobodni podróży i rozładunku (G59)", function (x) { return n2(x.podroze); }],
      ["Dni pracy ekipy (J39)", function (x) { return x.dni; }, "strong"],
      ["Kilometry auta", function (x) { return fmtPLN.format(x.km); }],
      "Koszty",
      ["Urządzenia", function (x) { return zl(x.koszty.urzadzenia); }],
      ["Słupki", function (x) { return zl(x.koszty.slupki); }],
      ["Paliwo", function (x) { return zl(x.koszty.paliwo); }],
      ["Hotel", function (x) { return zl(x.koszty.hotel); }],
      ["Transport TIR", function (x) { return zl(x.koszty.transport); }],
      ["Spider Crane", function (x) { return zl(x.koszty.dzwig); }],
      ["Rozładunek (sprzęt)", function (x) { return zl(x.koszty.rozladunek_sprzet); }],
      ["Rozładunek (ludzie)", function (x) { return zl(x.koszty.rozladunek_ludzie); }],
      ["Dojazdy (ludzie)", function (x) { return zl(x.koszty.dojazdy); }],
      ["Montaż", function (x) { return zl(x.koszty.montaz); }],
      ["Diety", function (x) { return zl(x.koszty.diety); }],
      ["Suma przed narzutami", function (x) { return zl(x.baza); }, "strong"],
      ["KOB", function (x) { return zl(x.kob); }], ["GDW", function (x) { return zl(x.gdw); }],
      ["Zysk", function (x) { return zl(x.zysk); }], ["Podatek", function (x) { return zl(x.podatek); }],
      ["Cena kontraktu (dawne K39)", function (x) { return zl(x.cena); }, "total"]
    ], ws);
    return h + "</tbody></table></div>";
  }

  function paneWyceny() {
    var saved = lsGet(LS_SAVED, []);
    var h = '<div class="row"><input id="saveName" type="text" placeholder="Nazwa wyceny" style="flex:1;min-width:180px" value="' +
      esc((wynik.dane.nazwa || "Wycena") + (wynik.dane.data ? " " + wynik.dane.data : "")) + '"><button class="btn primary small" type="button" id="bSave2">Zapisz bieżącą</button></div>';
    h += '<p class="note">Wyceny zapisują się w tej przeglądarce. Aby przenieść je na inny komputer, użyj eksportu niżej.</p><div class="saved">';
    if (!saved.length) h += '<div class="muted">Brak zapisanych wycen.</div>';
    saved.forEach(function (s, i) {
      var conf = state.confirm === i;
      h += '<div class="it"><div><b>' + esc(s.nazwa) + '</b> <span class="muted">· ' + esc(s.kiedy) + " · " + zl(s.cena) + '</span></div><div class="row">' +
        (conf ? '<span class="muted">Usunąć?</span><button class="btn small danger" type="button" data-del-yes="' + i + '">Tak, usuń</button><button class="btn small" type="button" data-del-no="1">Anuluj</button>'
          : '<button class="btn small" type="button" data-load="' + i + '">Wczytaj</button><button class="btn small danger" type="button" data-del="' + i + '">Usuń</button>') + "</div></div>";
    });
    h += '</div><h3 class="sec">Eksport / import</h3><p class="note">Kopiuj zapisuje wszystkie wyceny i zmieniony cennik jako tekst. Wklej taki tekst w pole i kliknij Importuj.</p>' +
      '<textarea id="ioText" rows="4" placeholder="Wklej tu tekst eksportu"></textarea><div class="row" style="margin-top:8px"><button class="btn small" type="button" id="bExport">Kopiuj eksport</button><button class="btn small" type="button" id="bImport">Importuj</button></div>';
    return h;
  }

  function paneCennik() {
    var c = wynik.cennik, h = '<div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="muted">Zmiany działają od razu i zapisują się w tej przeglądarce. Zmienione pozycje: ' +
      Object.keys(state.cennik).length + '.</div><button class="btn small" type="button" id="bCenReset">Przywróć ceny domyślne</button></div><div class="kv">';
    CENNIK_POLA.forEach(function (p) {
      if (!p[1]) { h += '<h3 class="sec" style="grid-column:1/-1;margin-bottom:0">' + p[0] + "</h3>"; return; }
      var changed = state.cennik[p[0]] !== undefined;
      h += '<label for="cen_' + p[0] + '">' + p[1] + (p[2] ? ' <span class="muted">[' + p[2] + "]</span>" : "") + (changed ? ' <span class="example">zmienione</span>' : "") +
        '</label><input type="number" step="any" id="cen_' + p[0] + '" data-cen="' + p[0] + '" value="' + +Number(c[p[0]]).toFixed(5) + '">';
    });
    return h + '</div><p class="note">Tabela dopłat za zagłębienia i lista składowych platformy są w Excelu (arkusz Cennik). W aplikacji obowiązują wartości ze starego arkusza.</p>';
  }

  function paneUwagi() {
    return '<h3 class="sec">Do sprawdzenia</h3><ul class="notes">' + UWAGI.map(function (u) { return "<li>" + esc(u) + "</li>"; }).join("") + "</ul>";
  }

  /* --- zdarzenia --- */
  $("form").addEventListener("input", function (e) {
    if (e.target.id === "saveName" || e.target.id === "ioText") return;
    state.dane = fromForm(); state.przyklad = null; recalc();
  });
  $("form").addEventListener("submit", function (e) { e.preventDefault(); });
  $("lokKrk").addEventListener("click", function () { state.dane.lok = "Kraków"; lokButtons("Kraków"); recalc(); });
  $("lokPoza").addEventListener("click", function () { state.dane.lok = "Poza Krakowem"; lokButtons("Poza Krakowem"); recalc(); });
  $("bNew").addEventListener("click", function () { setDane(E.domyslneDane(), null); toast("Nowa wycena"); });
  $("bWaw").addEventListener("click", function () { setDane(PRZYKLADY.waw, "Kasprowicza 18 Warszawa"); });
  $("bKrk").addEventListener("click", function () { setDane(PRZYKLADY.krk, "Dekerta Kraków"); });
  $("bSave").addEventListener("click", function () { saveCurrent((wynik.dane.nazwa || "Wycena") + (wynik.dane.data ? " " + wynik.dane.data : "")); });

  function saveCurrent(nazwa) {
    var saved = lsGet(LS_SAVED, []);
    saved.unshift({ nazwa: nazwa, kiedy: new Date().toLocaleString("pl-PL"), cena: wynik.warianty[0].cena, dane: state.dane });
    lsSet(LS_SAVED, saved.slice(0, 200));
    toast("Zapisano: " + nazwa);
    if (state.tab === "wyceny") render();
  }

  $("pane").addEventListener("click", function (e) {
    var t = e.target;
    if (t.id === "bCopy") copyText(ofertaText(), "Skopiowano zestawienie", "offerText");
    if (t.id === "bSave2") saveCurrent($("saveName").value || "Wycena");
    if (t.dataset.load !== undefined) { var s = lsGet(LS_SAVED, [])[+t.dataset.load]; if (s) { setDane(s.dane, null); toast("Wczytano: " + s.nazwa); } }
    if (t.dataset.del !== undefined) { state.confirm = +t.dataset.del; render(); }
    if (t.dataset.delNo !== undefined) { state.confirm = null; render(); }
    if (t.dataset.delYes !== undefined) {
      var arr = lsGet(LS_SAVED, []); arr.splice(+t.dataset.delYes, 1); lsSet(LS_SAVED, arr); state.confirm = null; render(); toast("Usunięto");
    }
    if (t.id === "bExport") {
      var txt = JSON.stringify({ wyceny: lsGet(LS_SAVED, []), cennik: state.cennik });
      $("ioText").value = txt; copyText(txt, "Skopiowano eksport", "ioText");
    }
    if (t.id === "bImport") {
      try {
        var o = JSON.parse($("ioText").value);
        if (o.wyceny) lsSet(LS_SAVED, o.wyceny.concat(lsGet(LS_SAVED, [])).slice(0, 200));
        if (o.cennik) { state.cennik = o.cennik; lsSet(LS_CENNIK, o.cennik); }
        recalc(); toast("Zaimportowano");
      } catch (err) { toast("Nie udało się odczytać tekstu. Wklej cały eksport."); }
    }
    if (t.id === "bCenReset") { state.cennik = {}; lsSet(LS_CENNIK, {}); recalc(); toast("Przywrócono ceny domyślne"); }
  });
  $("pane").addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "analizaSel") { state.dane.analiza = +t.value; recalc(); }
    if (t.dataset.cen) {
      var k = t.dataset.cen, v = t.value === "" ? null : Number(t.value);
      if (v === null || v === E.CENNIK[k]) delete state.cennik[k]; else state.cennik[k] = v;
      lsSet(LS_CENNIK, state.cennik); recalc();
    }
  });
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]"); if (!b) return;
    state.tab = b.dataset.tab; state.confirm = null; lsSet(LS_TAB, state.tab); render();
  });

  function copyText(txt, msg, selId) {
    function fallback() { var el = $(selId); if (!el) return; var rg = document.createRange(); rg.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Zaznaczono tekst – skopiuj Ctrl+C"); }
    try { navigator.clipboard.writeText(txt).then(function () { toast(msg); }, fallback); } catch (e) { fallback(); }
  }

  /* --- start --- */
  buildDimTable();
  var draft = lsGet(LS_DRAFT, null);
  if (draft && draft.dane) setDane(draft.dane, draft.przyklad);
  else setDane(PRZYKLADY.waw, "Kasprowicza 18 Warszawa");
})();
</script>
