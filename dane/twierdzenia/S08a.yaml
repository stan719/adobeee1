- {id: S08-024, podmiot: koscierzyn, relacja: opis, wartosc: "rezydencją Prządzyńskich do budowy murowanego dworu był drewniany dwór obok kopca, spalony ok. 1926 r.; po śmierci Wincentego mieszkali w nim Stanisław Prządzyński (1871–1957) z żoną Stanisławą z Grabińskich (1890–1980); majątek ok. 380 ha",
   zrodla: [{segment: S08-p064-s03, cytat: "Rezydencją Prządzyńskich od kupna Kościerzyna do wybudowania budynku murowanego był dwór drewniany stojący obok kopca"}, {segment: S08-p064-s03, cytat: "Uległ on ostatecznemu zniszczeniu, na skutek pożaru, dopiero około 1926 r."}, {segment: S08-p064-s03, cytat: "Majątek kościerzyński nie był duży i obejmował około 380 ha gruntów."}], pewnosc_odczytu: pewna}
- {id: S08-025, podmiot: przadzynski-stanislaw-1871, relacja: zamieszkanie, miejsce: koscierzyn, wartosc: "po śmierci Wincentego zamieszkał z żoną w drewnianym dworku",
   zrodla: [{segment: S08-p064-s03, cytat: "Po śmierci Wincentego dworek ten zamieszkiwali Stanisław Prządzyński (1871–1957) i jego żona Stanisława z Grabińskich (1890–1980)."}], pewnosc_odczytu: pewna}
