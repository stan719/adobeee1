- {id: S08-031, podmiot: przadzynski-stanislaw-1871, relacja: fundacja, obiekt: koscierzyn-dwor, wartosc: "z jego inicjatywy, bezpośrednio przed I wojną, zbudowano murowany dwór (ukończony ok. 1915, na pewno przed 1917); wg rodziny sam go zaprojektował", data: {tekst: "około roku 1915", od: 1913, do: 1917},
   zrodla: [{segment: S08-p064-s02, cytat: "Ostatni, zachowany do dziś murowany dwór powstał, według przekazów rodzinnych, około roku 1915 i wzniesiony został z inicjatywy Stanisława Prządzyńskiego"}, {segment: S08-p064-s04, cytat: "Bezpośrednio przed I wojną światową Stanisław Prządzyński rozpoczął budowę nowej murowanej rezydencji, którą ukończono około 1915 r., a na pewno przed 1917 r."}, {segment: S08-p064-s04, cytat: "w rodzinie zachowało się przekonanie, że autorem był sam Stanisław Prządzyński."}], pewnosc_odczytu: pewna}
- {id: S08-032, podmiot: przadzynski-andrzej-1917, relacja: urodzenie, miejsce: koscierzyn-dwor, wartosc: "urodził się już w nowym dworze",
   zrodla: [{segment: S08-p064-s04, cytat: "gdyż syn Stanisława Andrzej Prządzyński urodził się już w nowym dworze."}], pewnosc_odczytu: pewna}
