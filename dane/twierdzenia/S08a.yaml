- {id: S08-034, podmiot: koscierzyn-dwor, relacja: opis, wartosc: "budynek murowany, piętrowy, podpiwniczony, z kanalizacją, centralnym ogrzewaniem, własną „elektrownią” (akumulatory w podwórzu) i telefonem; plan krótkiego prostokąta 27,8×22,1 m z dwoma ryzalitami od ogrodu (zamykającymi taras), ryzalitem osiowym od frontu i skrzydłem gospodarczym (12 m) od północy; łamany dach polski z czerwonej dachówki; bryła nawiązuje do dworów barokowo-klasycystycznych",
   zrodla: [{segment: S08-p064-s05, cytat: "Był to budynek murowany, piętrowy, podpiwniczony, zaopatrzony w urzą-dzenia kanalizacyjne, centralne ogrzewanie, własną „elektrownię” i telefon."}, {segment: S08-p064-s05, cytat: "Wzniesiono go na planie krótkiego prostokąta (27,8×22,1 m)"}, {segment: S08-p066-s01, cytat: "łamanym polskim dachem z czerwonej dachówki i bryła jego w oczywisty sposób nawiązywała do polskich dworów barokowo-klasycystycznych."}, {segment: S08-p064-f25, cytat: "Opis dworu w Kościerzynie. Brwinów 1991, opracowanie sporządzone na prośbę autora w moim posiadaniu."}], pewnosc_odczytu: pewna}
- {id: S08-035, podmiot: koscierzyn-dwor, relacja: opis, wartosc: "rzuty parteru i piętra oraz plan sytuacyjny (stawy, kopiec-wyspa, park, folwark) — kreśliły Maria Cyrek i Anna Marciniak-Kajzer",
   zrodla: [{segment: S08-p060-s01, cytat: "Kościerzyn. Plan sytuacyjny. Kreśliły Maria Cyrek i Anna Marciniak-Kajzer"}, {segment: S08-p065-s01, cytat: "Kościerzyn. Dwór — rzut parteru. Kreśliły Maria Cyrek i Anna Marciniak-Kajzer"}, {segment: S08-p065-s02, cytat: "Kościerzyn. Dwór — rzut piętra. Kreśliły Maria Cyrek i Anna Marciniak-Kajzer"}], pewnosc_odczytu: pewna}
- {id: S08-036, podmiot: koscierzyn-dwor, relacja: opis, wartosc: "elewacja frontowa (wschodnia) siedmioosiowa, z ryzalitem i szerokim gankiem otwartym płaskim łukiem, nad nim taras na dwóch parach baniastych kolumn i trójkątny szczyt licowany drewnem „w jodełkę”, po bokach mansardy; mały ganeczek w narożniku NE do kancelarii; skrzydło gospodarcze z „kubikiem” 7,5×7,5 m (kuchnie, pokoje służby); elewacja ogrodowa siedmioosiowa",
   zrodla: [{segment: S08-p066-s01, cytat: "Fronton (elewacja wschodnia) posiadał na osi ryzalit, mieszczący szeroki ganek, otwarty płaskim łukiem o wyraźnie obniżonej strzałce i poprzedzony kamiennymi stopniami."}, {segment: S08-p066-s01, cytat: "„kubikiem” (7,5×7,5 m) mieszczącym na dole kuchnie, a na górze pokoje służbowe."}, {segment: S08-p066-s01, cytat: "trójkątny, licowany drewnem „w jodełkę” szczyt."}, {segment: S08-p067-s01, cytat: "Malownicza bryła dworu wystawia jednak dobre świadectwo architektowi (może właś-cicielowi?)"}, {segment: S08-p066-s03, cytat: "Opisany budynek uznać należy za udaną realizację siedziby wiejskiej utrzymanej w manierze „stylu dworkowego”"}], pewnosc_odczytu: pewna}
- {id: S08-037, podmiot: koscierzyn-dwor, relacja: opis, wartosc: "w okresie międzywojennym otynkowany, porośnięty winem, caprifolium, bluszczem i clematisem; ok. 1970 dachówkę zastąpiono blachą, wymieniono okna mansard, dodano tralki tarasu; zachowały się tylko paradne schody z ciemnego drewna, drzwi parteru i wysoki zegar stojący w hallu piętra",
   zrodla: [{segment: S08-p066-s02, cytat: "W okresie międzywojennym dwór był otynkowany i ściany jego w znacznej partii obrośnięte były pachnącym winem, caprifolium, bluszczem i clematisem."}, {segment: S08-p066-s02, cytat: "wymianę (około 1970 r.) pokrycia ceramicznego dachu na blachę"}, {segment: S08-p066-s02, cytat: "jedyny przedmiot z przedwojennego wyposażenia ustawiony w hallu piętra — wysoki stojący zegar."}], pewnosc_odczytu: pewna}
- {id: S08-038, podmiot: koscierzyn-dwor, relacja: opis, wartosc: "układ wnętrz: ganek, hall-sień, schody; na północ apartament pana domu (gabinet, kancelaria, łazienka), jadalnia, kredens, spiżarnia, kuchnia; na południe część rodzinna: pięciookienny salon, sypialnia, dwa pokoje dziecinne, kaplica między hallem a sypialnią; na piętrze pokój z tarasem i szafami bibliotecznymi, pokoje gościnne, mieszkanie kucharza; tapety, parkiety, meble: jadalnia neorenesansowa/neobarokowa „gdańska”, salon i sypialnia biedermeier, gabinet Ludwik Filip",
   zrodla: [{segment: S08-p067-s02, cytat: "Na prawo od tej osi (czyli na północ) mieściły się: gabinet, kancelaria i łazienka (z WC) a więc był to apartament pana domu."}, {segment: S08-p067-s02, cytat: "Między hallem-sienią a sypialnią znajdowała się kaplica"}, {segment: S08-p067-s03, cytat: "Meble w jadalni były neorenesansowe — czy może raczej neobarokowe — w stylu „gdańskim”, salon i sypialnię umeblowano meblami biedermeierowskimi, a gabinet pana domu w stylu Ludwika Filipa."}], pewnosc_odczytu: pewna}
- {id: S08-039, podmiot: koscierzyn-dwor, relacja: opis, wartosc: "duża polsko-francuska biblioteka (stare książki w skórze) i archiwum rodzinne (drzewa genealogiczne Prządzyńskich i rodzin spokrewnionych, dokumenty rodzinne i majątkowe) — zaginęły wskutek obrabowania dworu w czasie II wojny i tuż po niej",
   zrodla: [{segment: S08-p067-s03, cytat: "We dworze znajdowała się duża polsko-francuska biblioteka, z wieloma starymi, oprawnymi w skórę książkami oraz archiwum rodzinne, obejmujące drzewa genealogiczne Prządzyńskich i rodzin z nimi spokrewnionych, stare dokumenty rodzinne i majątkowe itp. To wszystko zaginęło na skutek obrabowania siedziby w okresie II wojny światowej i bezpośrednio po jej zakończeniu."}], pewnosc_odczytu: pewna}
- {id: S08-040, podmiot: przadzynski-stanislaw-1871, relacja: zawod, wartosc: "ziemianin; gospodarował w Kościerzynie do II wojny — gospodarstwo rolno-hodowlane (ogiery z Węgier, konie remontowe dla wojska) i nasienne (pszenica, buraki cukrowe); od 1922 r. do wojny prezes sieradzkiego oddziału Związku Ziemian; organizował Spółdzielnię Rolniczą w Sieradzu; przyjmował studentów na praktyki", data: {tekst: "do II wojny; od 1922 r.", od: 1922, do: 1939},
   zrodla: [{segment: S08-p067-s03, cytat: "Stanisław Prządzyński gospodarował w Koś-cierzynie do II wojny, doprowadzając majątek do wysokiej kultury rolnej."}, {segment: S08-p067-s03, cytat: "(ogiery kupowane na Węgrzech i hodowla koni remontowych dla wojska), a także nasienne (pszenica i buraki cukrowe). Będąc od 1922 r. do wojny prezesem sieradzkiego Oddziału Związku Ziemian — organizował w Sieradzu Spółdzielnię Rolniczą, a do Kościerzyna sprowadzał studentów na praktyki rolne."}], pewnosc_odczytu: pewna}
- {id: S08-041, podmiot: koscierzyn-park, relacja: opis, wartosc: "park naturalistyczny, niecałe 5 ha (ok. 1 ha wody); południowa partia ze strzyżonym szpalerem grabowym zniszczona po wojnie (boisko, pawilon hotelowy); wg L. Kózki park powstał 1915–1920; od zachodu sad oddzielony aleją świerków i topoli włoskich; 35 gatunków drzew, przewaga olszy i jesionu; ok. 700 m od dworu w stronę Wróblewa piaszczyste wyniesienie z urnami (zapewne cmentarzysko kultury łużyckiej) — urny przechowywano we dworze do II wojny",
   zrodla: [{segment: S08-p067-s04, cytat: "Powierzchnia jego wynosi niecałe 5 ha, z czego blisko 1 ha zajmowały stawy i inne wody."}, {segment: S08-p068-s01, cytat: "Zdaniem mono-grafisty27 park powstał dopiero w latach 1915–1920."}, {segment: S08-p068-s01, cytat: "Monografista stwierdził w parku obecność 35 gatunków drzew"}, {segment: S08-p068-f28, cytat: "Ibidem, s. 3 nn."}, {segment: S08-p068-f29, cytat: "Było to prawdopodobnie cmentarzysko kultury łużyckiej. „Urny” do II wojny światowej przechowywano we dworze."}], pewnosc_odczytu: pewna}
- {id: S08-042, podmiot: koscierzyn-dwor, relacja: opis, wartosc: "po wojnie ośrodek szkolenia rolników: Wojewódzki Ośrodek Postępu Rolniczego (gruntowny remont, boazerie, pawilon hotelowy dla 60 kursantów ok. 1970, parking na miejscu zasypanego stawu), od 1991 r. Wojewódzki Ośrodek Doskonalenia Rolniczego (WODR) — biura we dworze; znakomity, nieznany w literaturze przykład XX-wiecznego stylu dworkowego", data: {tekst: "po 1945; 1991", od: 1945, do: 1991},
   zrodla: [{segment: S08-p067-s03, cytat: "Do tradycji tej nawiązano po wojnie, tworząc w Kościerzynie ośrodek szkolenia rolników."}, {segment: S08-p068-s02, cytat: "Osta-tnio, w 1991 r. WOPR został przemianowany na Wojewódzki Ośrodek Doskonalenia Rolniczego"}, {segment: S08-p068-s02, cytat: "Dwór w Kościerzynie stanowi bowiem kompletnie nieznany w literaturze, znakomity przykład XX-wiecznego stylu dworkowego"}, {segment: S08-p060-s02, cytat: "Wojewódzki Ośrodek Doskonalenia Rolniczego, którego biura mieszczą się we dworze."}], pewnosc_odczytu: pewna}
- {id: S08-043, podmiot: przadzynska-anna-1914, relacja: opis, wartosc: "źródło informacji L. Kajzera o Kościerzynie: list z 18 III 1991 i „Opis dworu w Kościerzynie” (Brwinów 1991) oraz stare fotografie — jedyne źródła do rekonstrukcji dworu w okresie międzywojennym", miejsce: brwinow, data: {tekst: "18 III 1991", od: 1991-03-18, do: 1991-03-18},
   zrodla: [{segment: S08-p064-f25, cytat: "A. Radoszewska, Opis dworu w Kościerzynie. Brwinów 1991"}, {segment: S08-p064-f26, cytat: "Za sporządzenie opracowania i liczne informacje o dworze, a także dostarczenie starych materiałów fotograficznych serdecznie Pani Annie z Prządzyńskich Radoszewskiej dziękuję."}], pewnosc_odczytu: pewna}
