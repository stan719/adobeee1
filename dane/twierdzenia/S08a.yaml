# S08 cz. 1: L. Kajzer, „Kościerzyn — dwory”, w: Pałace i dwory w dawnym województwie sieradzkim t. 2, s. 57–68

- {id: S08-001, podmiot: kajzer-leszek, relacja: opis, wartosc: "autor rozdziału „Kościerzyn — dwory” w tomie 2 „Pałace i dwory w dawnym województwie sieradzkim” (na okładce zdjęcie nieokreślonego dworu z gankiem kolumnowym)",
   zrodla: [{segment: S08-p000-s02, cytat: "PAŁACE I DWORY W DAWNYM WOJEWÓDZTWIE SIERADZKIM TOM 2"}, {segment: S08-p057-s01, cytat: "KOŚCIERZYN — DWORY"}, {segment: S08-p057-s02, cytat: "1. Informacje wstępne i stan badań. 2. Dzieje wsi i jej właścicieli. 3. Starsze rezydencje. 4. Dwór Prządzyńskich. 5. Aneks źródłowy."}], pewnosc_odczytu: pewna}
- {id: S08-002, podmiot: koscierzyn, relacja: opis, wartosc: "niewielka wieś na NW od Sieradza, ok. 3 km na północ od szosy Sieradz–Błaszki–Kalisz; w I Rzeczypospolitej pow. i woj. sieradzkie (sieradzkie skupisko osadnicze); potem Księstwo Warszawskie, Królestwo Polskie, gubernia kaliska; 1918–1975 pow. sieradzki woj. łódzkiego; obecnie gm. Wróblew, woj. sieradzkie",
   zrodla: [{segment: S08-p057-s03, cytat: "Kościerzyn to niewielka wieś położona na północny-zachód od Sieradza, około 3 km na północ od szosy Sieradz-Błaszki-Kalisz."}, {segment: S08-p057-s03, cytat: "Od 1918 do 1975 r. (z przerwą okupacyjną) należała do powiatu sieradzkiego województwa łódzkiego, obecnie znajduje się w gminie Wróblew województwa sieradzkiego."}], pewnosc_odczytu: pewna}
- {id: S08-003, podmiot: koscierzyn-dwor, relacja: opis, wartosc: "stan badań: dwór nie był wzmiankowany w Katalogu Zabytków ani w kartotece WKZ w Sieradzu (brak „białej karty”); wiosną 1991 r. podjęto starania o wpis zespołu dworsko-parkowego do rejestru zabytków; o dworach obronnych pisali w 1986 r. L. Kajzer i J. Augustyniak; najwięcej informacji o wsi w SGKP; w 1983 r. archeologiczne badania weryfikacyjne dwóch nasypów", data: {tekst: "1983–1991", od: 1983, do: 1991},
   zrodla: [{segment: S08-p057-s04, cytat: "Dwór w Kościerzynie nie budził dotychczas zainteresowania badaczy i wzmianka o nim nie pojawiła się nawet w Katalogu Zabytków"}, {segment: S08-p057-s04, cytat: "Dopiero wiosną 1991 r. podjęto starania o wpisanie całego zespołu dworsko-parkowego do rejestru zabytków."}, {segment: S08-p057-s04, cytat: "W roku 1983 przeprowadzono w Kościerzynie weryfikacyjne badania archeologiczne"}, {segment: S08-p057-f1, cytat: "W archiwum WKZ w Sieradzu nie istnieje tzw. biała karta dworu w Kościerzynie.."}, {segment: S08-p058-s02, cytat: "podstawowe znaczenie miały przeprowadzone w 1983 r. badania terenowe i wykonane przy okazji opracowania ich wyników kwerendy archiwalne."}], pewnosc_odczytu: pewna}
- {id: S08-004, podmiot: koscierzyn-kopiec-park, relacja: opis, wartosc: "wg rękopisów A. Pstrokońskiego (1 poł. XIX w.): „na kopcu wśród sadzawki bywał dwór z kaplicą”; sprawdzenie w Tekach Smoniewskiego niemożliwe (wykradzione z Biblioteki PAN w Krakowie)",
   zrodla: [{segment: S08-p057-s04, cytat: "drugi — czyli kopiec otoczony fosą — ulokowany w parku dworskim"}, {segment: S08-p058-s01, cytat: "Zanotował on, że w Kościerzynie „na kopcu wśród sadzawki bywał dwór z kaplicą”"}, {segment: S08-p058-f6, cytat: "Na skutek wykradzenia ze zbiorów Biblioteki PAN w Krakowie tzw. Tek Smoniewskiego"}], pewnosc_odczytu: pewna}
- {id: S08-005, podmiot: koscierzyn, relacja: opis, wartosc: "brak wzmianek w słowniku Zajączkowskich — metryka pisana nie sięga przed 1400; pierwsze XV-wieczne wzmianki pochodzą z herbarzy (mniej wiarygodne); gniazdo Kościerskich (wg heraldyków z rodu Poraitów; Paprocki i Niesiecki ich nie notują); 1411: Mikołaj, syn Spytka z Kościerzyna, student UJ; 1412: Spytek z Kościerzyna godzi się z archidiakonem kaliskim Jarockim; 1428–1429: Zawisza z Kościerzyna procesuje się w Sieradzu; 1419: Ninota z Kościerzyna, student UJ, potem pleban w Małyniu, fundator altarii w katedrze gnieźnieńskiej (patronat dla brata Dersława, wzm. 1450, i synowców Jana, Andrzeja, Mikołaja, wzm. 1464); 1496: wraz z 9 wsiami w parafii Charłupia Mała; 9 łanów (1553, 1576)", data: {tekst: "1411–1576", od: 1411, do: 1576},
   zrodla: [{segment: S08-p058-s03, cytat: "Wzmianek o Kościerzynie brak w Słowniku S. i S. M. Zajączkowskich, fakt ten pośrednio informuje, że jej metryka pisana nie sięga lat przed 1400"}, {segment: S08-p058-s03, cytat: "Kościerzyn był w późnym średniowieczu i w czasach nowożytnych gniazdem rodziny Kościerskich, którą heraldycy uważają za należącą do rodu Poraitów"}, {segment: S08-p058-s03, cytat: "Pierwsza pośrednia wzmianka o wsi pochodzi z 1411 r., kiedy to wymieniany jest Mikołaj, syn Spytka z Kościerzyna, student Uniwersytetu Jagiellońskiego."}, {segment: S08-p058-s03, cytat: "Ninota z Kościerzyna, w 1419 r. student Uniwersytetu Jagiellońskiego, późniejszy pleban z Małynia, fundator altarii przy Katedrze Gnieźnieńskiej"}, {segment: S08-p058-s03, cytat: "Wraz z 9 sąsiednimi wioskami Kościerzyn należał wtedy do"}, {segment: S08-p059-s01, cytat: "parafii w Charłupii Małej."}, {segment: S08-p058-f9, cytat: "kiedy we wsi odnotowano obecność 9 łanów."}, {segment: S08-p058-f8, cytat: "Starsi heraldycy (B. Paprocki i K. Niesiecki) nie notują tej rodziny"}], pewnosc_odczytu: pewna}
- {id: S08-006, podmiot: pstrokonski-antoni, relacja: wlasnosc, obiekt: koscierzyn, wartosc: "właściciel Kościerzyna; w 1807 r. zapis połowy dożywocia Tekli z Tymienieckich Pstrokońskiej; zapewne historyk, notariusz i archiwista sieradzki, członek korespondent Warszawskiego Towarzystwa Przyjaciół Nauk", data: {tekst: "1807", od: 1807, do: 1807},
   zrodla: [{segment: S08-p058-f8, cytat: "gdzie zapis 1/2 dożywocia Tekli z Tymienieckich Pstrokońskiej przez Antoniego Pstrokońskiego, właściciela Kościerzyna, chyba Antoniego, historyka, notariusza i archiwisty sieradzkiego, członka korespondenta Warszawskiego Towarzystwa Przyjaciół Nauk."}, {segment: S08-p058-s01, cytat: "A. Pstrokońskiego."}], pewnosc_odczytu: pewna}
- {id: S08-007, podmiot: koscierzyn, relacja: opis, wartosc: "SGKP błędnie łączy z Kościerzynem dokument Kazimierza Jagiellończyka z 1471 r. — dotyczy on Kościerzyna, miasteczka koło Szubina; w okolicy kilka kluczy majątkowych (Charłupscy z Charłupii Małej — od 1436 w większości Malscy; Grądzcy z Grądów; Lisowie Biskupscy-Rudniccy z Biskupic); sąsiednie Kobierzycko w rękach Korabitów Kobierzyckich",
   zrodla: [{segment: S08-p059-s01, cytat: "Przy okazji wypada tu sprostować informację podaną przez Słownik Geograficzny dotyczącą pojawienia się Kościerzyna w dokumencie Kazimierza Jagiellończyka z 1471 r."}, {segment: S08-p059-s01, cytat: "dotyczy jednak Kościerzyna, miasteczka wielkopolskiego, le-żącego koło Szubina"}, {segment: S08-p059-s01, cytat: "kolejny wielowioskowy majątek Lisów Biskupskich-Rudnickich z Biskupic"}, {segment: S08-p059-s01, cytat: "także sąsiednie Kobierzycko znajdowało się w ręku Korabitów Kobierzyckich."}, {segment: S08-p059-f10, cytat: "dotyczy on „oppidi nostro Kościerzyn”, a więc miasta."}], pewnosc_odczytu: pewna,
   uwagi: "Por. Anna z Rudnik Biskupska, żona Marka Radoszewskiego."}
- {id: S08-008, podmiot: koscierzyn, relacja: opis, wartosc: "po Kościerskich wieś trzymali Pstrokońscy (ten sam ród); majątek często dzierżawiony: 1722 Kowalscy, 1723 Tymienieccy, 1765 Zabłoccy, 1782–1783 Żeromscy (6 inwentarzy 1722–1783)", data: {tekst: "1722–1783", od: 1722, do: 1783},
   zrodla: [{segment: S08-p059-s01, cytat: "Po Kościerskich wieś trzymali ich współrodowcy Pstrokońscy, obficie rozrodzeni w całym Sie-radzkiem, a majątek kościerski był często wypuszczany w dzierżawę. W roku 1722 byli nimi Kowalscy12, w 1723 r. Tymienieccy13, w 1765 r. Zabłoccy14, a w 1782–1783 Żeromscy15."}], pewnosc_odczytu: pewna}
- {id: S08-009, podmiot: przadzynski-wincenty-1839, relacja: wlasnosc, obiekt: koscierzyn, wartosc: "ostatni posiadacze wsi — Grzymalici Prządzyńscy: Wincenty Prządzyński (†1895) kupił Kościerzyn od Rozdrażewskich w końcu XIX w. (prawdopodobnie ok. 1890, w związku z utratą wzroku i sprzedażą Kobierzycka)", data: {tekst: "w końcu XIX w.; około 1890 r.", od: 1890, do: 1895},
   zrodla: [{segment: S08-p059-s01, cytat: "Ostatnimi posiadaczami wsi byli Grzymalici Prządzyńscy, gdyż majątek ten w końcu XIX w. kupił od Rozdrażewskich Wincenty Prządzyński (†1895)16."}, {segment: S08-p059-f16, cytat: "Wiadomość od Anny z Prządzyńskich Radoszewskiej w moim posiadaniu."}, {segment: S08-p064-s03, cytat: "Praw-dopodobnie stało się to dopiero około 1890 r., gdyż sprzedaż Kobierzycka i kupno Kościerzyna wiązało się po części z utratą przez W. Prządzyńskiego wzroku."}], pewnosc_odczytu: pewna}
- {id: S08-010, podmiot: koscierzyn, relacja: opis, wartosc: "folwark wg SGKP (t. IV 1883): 646 mórg (564 gruntów ornych, 50 łąk, 7 pastwisk, 25 nieużytków); 6 budynków murowanych i 6 drewnianych", data: {tekst: "SGKP 1883", od: 1883, do: 1883},
   zrodla: [{segment: S08-p059-s01, cytat: "folwark ko-ścierzyński obejmował łącznie 646 mórg (z czego 564 gruntów ornych, 50 łąk, 7 pastwisk i 25 nieużytków) i znajdowało się w nim 6 budynków murowanych i 6 drewnianych"}], pewnosc_odczytu: pewna}
- {id: S08-011, podmiot: koscierzyn-kopiec-laki, relacja: opis, wartosc: "pierwsza rezydencja: nasyp ok. 800 m na NW od zespołu dworskiego, nad rowem melioracyjnym między łąkami chłopskimi i dworskimi; zniszczony w ok. 1/3; średnica ok. 18 m, wys. ok. 1,5 m, ślady fosy; warstwa kulturowa z 1 poł. XIV w., ślady drewnianego budynku zniszczonego pożarem; hipoteza: obronny dwór z ok. 1300 r. spalony w czasie rejzy krzyżackiej we wrześniu 1331 r. (trasa: Uniejów–Bałdrzychów, Szadek, Sieradz, Charłupia Mała, Popów, Niemysłów, Uniejów; spalono kościół w Charłupii Małej, 2 km od Kościerzyna)", data: {tekst: "ok. 1300 – wrzesień 1331", od: 1300, do: 1331},
   zrodla: [{segment: S08-p059-s02, cytat: "Pozostałość pierwszej rezydencji dworskiej w Kościerzynie znajduje się około 800 m. na północny-"}, {segment: S08-p060-s02, cytat: "Średnica zachowanej partii kopca-nasypu wynosi około 18 m, wysokość około 1,5 m."}, {segment: S08-p060-s02, cytat: "postawiono hipotezę, że pierwszy, obronny, dwór w Kościerzynie wzniesiony został około lat 1300 i spalony w czasie rejzy krzyżackiej z września 1331 r."}, {segment: S08-p060-f18, cytat: "Tak interpretowano wyniki badań"}, {segment: S08-p061-s01, cytat: "Uniejów-Bałdrzychów, Szadek, Sieradz, Charłupię Małą, Popów, Niemysłów i znów na Uniejów"}, {segment: S08-p061-s01, cytat: "możliwe że wtedy też zniszczono pobliski (oddalony o 2 km) Kościerzyn."}, {segment: S08-p058-s01, cytat: "oba nasypy kryją pozostałości obronnych, starszych od istniejącego dworu, rezyden-cji właścicieli wsi."}], pewnosc_odczytu: pewna}
- {id: S08-012, podmiot: koscierzyn-kopiec-park, relacja: opis, wartosc: "kopiec w parku ok. 50 m od dworu: średnica ok. 32 m, 0,5 m nad terenem, ponad 3 m nad dnem suchej fosy; most od zachodu (dawniej, do po II wojnie, od NE); fosa rozszerzona w staw na początku lat 70.; utożsamiany z XIX-wieczną „lodownią”; warstwy: późnośredniowieczna ze spalenizną (dwór obronny z ok. 1400), nad nią drewniany dwór „renesansowy” (2 poł. XVI / przełom XVI/XVII w., ogrzewany piecami z „pstrych” kafli), późnonowożytne nawarstwienia i resztki lodowni z cegły 66×145×280 mm",
   zrodla: [{segment: S08-p061-s02, cytat: "Około 50 m. od dworu znajduje się w nim kopcowaty nasyp o średnicy około 32 m wyniesiony około 0,5 m ponad okalający go teren, a ponad 3 m nad dno obecnie suchej fosy."}, {segment: S08-p061-s02, cytat: "Kopiec kojarzono na ogół z „lodownią” — murowaną piwnicą służącą do przechowywania lodu, którą zbudowano w XIX w."}, {segment: S08-p061-s03, cytat: "Badania terenowe poświadczyły więc obecność na kopcu w parku dwóch, kolejno po sobie następujących siedzib dworskich"}, {segment: S08-p061-s03, cytat: "Pierwsza powstała w szerokich ramach lat około 1400"}, {segment: S08-p061-s03, cytat: "zapewne w 2 połowie XVI lub na przełomie XVI/XVII w., wzniesiono kolejny, także drewniany dwór, który na pewno funkcjonował w wieku XVII."}, {segment: S08-p061-f20, cytat: "Kościerzyn..., stan. 2..., s. 8–10."}], pewnosc_odczytu: pewna}
- {id: S08-013, podmiot: koscierzyn-kopiec-park, relacja: opis, wartosc: "dwór renesansowy na kopcu opuszczony przed 1722 r. (ok. połowy XVII w. lub później); 1722: przy dzierżawie „panom Kowalskim” — „dworek, na którym dach zły” i sadzawka „koło kopców, na których bywał dwór przedtym”; 1765: na kopcu budynek drewniany zwany „górką” (sień, schody, dwie izby na górze) — mieszkanie dzierżawców Zabłockich; 1782–1783: „dwór na kopcu czyli officyny stare”, pod koniec XVIII w. w ruinie", data: {tekst: "1722–1783", od: 1722, do: 1783},
   zrodla: [{segment: S08-p061-s04, cytat: "Koniec użytkowania drugiego dworu na kopcu, zwanego umownie renesan-sowym, przypadł przed 1722 r."}, {segment: S08-p062-s01, cytat: "nie tylko obecność „dworku, na którym dach zły”, lecz także sadzawek „przeciwko tej ozdowni sadzawka bez wody, trzecia koło kopców, na których bywał dwór przedtym”"}, {segment: S08-p062-s01, cytat: "„naprzód do mieszkania IMci Panom Zabłockim małżonkom daje się w podwórzu na kopcu górkę, do której idąc przez mostek sień"}, {segment: S08-p063-s01, cytat: "w 1765 r. obok dworu służącego jako rezydencja Pstrokońskich, stojącego obok kopca, znajdował się budynek drewniany zwany „górką” i służący jako mieszkanie dzierżawców."}, {segment: S08-p063-s02, cytat: "ale także „dwór na kopcu czyli officyny stare” jak nazwano „górkę” z 1765 r."}, {segment: S08-p062-f21, cytat: "AGAD, Castr. Sirad, rel. 79, f. 796 v."}], pewnosc_odczytu: pewna}
- {id: S08-014, podmiot: tymieniecki-zygmunt-1723, relacja: opis, wartosc: "dzierżawca części Kościerzyna w 1723 r. (inwentarz spisał Władysław Karol de Widawa Wężyk, notariusz i burgrabia zamku ostrzeszowskiego): browar (mieszkał w nim Żyd), sadzawki, ozdownia, stajnia, spichlerz, ogrody, poddani — 3 kmieci, zagrodnicy, karczmarz; część ta nie obejmowała kopca ani dworu", miejsce: koscierzyn, data: {tekst: "W rok później [1723]", od: 1723, do: 1723},
   zrodla: [{segment: S08-p062-s01, cytat: "W rok później „Władysław Karol de Widawa Wężyk” notariusz i burgrabia zamku ostrzeszowskiego spisał stan części Kościerzyna wydzierżawionej Zygmuntowi Zarembie Tymienieckiemu"}, {segment: S08-p062-s01, cytat: "„browar po lewey ręce wchodząc na podwórze, w którym browarze żyd mieszka"}, {segment: S08-p062-s01, cytat: "sadzawki, ozdownia, stajnia, spichlerz, ogrody oraz poddani (trzech kmieci, trzech zagrodników, karczmarz i trzech zagrodników)"}, {segment: S08-p062-s01, cytat: "Część Z. Tymienieckiego nie obejmowała ani kopca, ani dworu."}, {segment: S08-p062-f22, cytat: "Ibidem, Castr. Sirad, rel. 81, f. 814."}], pewnosc_odczytu: pewna}
- {id: S08-015, podmiot: wezyk-wladyslaw-karol, relacja: urzad, wartosc: "notariusz i burgrabia zamku ostrzeszowskiego; spisał inwentarz części Kościerzyna (1723)", data: {tekst: "1723", od: 1723, do: 1723},
   zrodla: [{segment: S08-p062-s01, cytat: "„Władysław Karol de Widawa Wężyk” notariusz i burgrabia zamku ostrzeszowskiego"}], pewnosc_odczytu: pewna}
- {id: S08-016, podmiot: koscierzyn, relacja: opis, wartosc: "inwentarz 1745 r.: dwór kryty w połowie gontem (dobry), w połowie snopkami (zły) — sień, izba, alkierz, okna w ołów, komora, kuchnia, dwa piece; druga połowa (izba i komora na wschód) zła; browar, 2 stodoły, nowy spichlerz, ozdownia, 2 nowe stajnie, stara obora, 5 karmników, wolarnia, suszarnia, folwarczek; poddani: 7 kmieci, 2 półrolników, 7 zagrodników „czterodniowych”, 1 chałupnik, 4 komornice", data: {tekst: "1745 r.", od: 1745, do: 1745},
   zrodla: [{segment: S08-p062-s01, cytat: "Stały tam wtedy „dwór na którym dach wpuł[!] pod gontami dobry, wpuł[!] zły snopkami poszyty."}, {segment: S08-p062-s01, cytat: "Do części tej należało także: 7 kmieci, 2 półrolników 7 zagrodników (określonych jako „czterodniowych”) 1 chałupnik i 4 komornice."}, {segment: S08-p062-f23, cytat: "Ibidem, Castr. Sirad., rel. 109, f. 329."}], pewnosc_odczytu: pewna}
- {id: S08-017, podmiot: pstrokonski-aleksander-1765, relacja: wlasnosc, obiekt: koscierzyn, wartosc: "właściciel Kościerzyna; w 1765 r. wydzierżawił część Zabłockim (mieszkanie w „górce” na kopcu, browar, sadzawka w kopcu do łowienia ryb; poddani: kmieć Józef Wawrzyniak, półrolnik Sebastian Domagała, zagrodnicy Jakub Wawrzyniak i Jakub Błaszczyk)", data: {tekst: "w 1765 r.", od: 1765, do: 1765},
   zrodla: [{segment: S08-p062-s01, cytat: "Natomiast w 1765 r. na części Zabłockich, wydzierżawionej przez właściciela Kościerzyna, Aleksandra Pstrokońskiego"}, {segment: S08-p062-s01, cytat: "„sadzawka w kopcu należy do łowienia ryb Państwa Zabłockim”"}, {segment: S08-p062-s01, cytat: "(kmieciem Józefem Wawrzyniakiem, półrolnikiem Sebastianem Domagałą i dwoma zagrodnikami: Jakubem Wawrzyniakiem i Jakubem Błaszczykiem)"}, {segment: S08-p062-f24, cytat: "Ibidem, Castr. Sirad., rel. 135, f. 333v–334v."}], pewnosc_odczytu: pewna}
- {id: S08-018, podmiot: zeromski-aleksander-jaxa, relacja: opis, wartosc: "dzierżawca części Kościerzyna 1782–1783 (dwór i „dwór na kopcu czyli officyny stare”)", miejsce: koscierzyn, data: {tekst: "1782–1783", od: 1782, do: 1783},
   zrodla: [{segment: S08-p063-s02, cytat: "kiedy to część Kościerzyna wydzierżawiono Aleksandrowi Jaxa Żeromskiemu (por. Aneks)."}], pewnosc_odczytu: pewna}
- {id: S08-019, podmiot: koscierzyn, relacja: opis, wartosc: "rezydencja Pstrokońskich: dwór drewniany obok kopca, zbudowany zapewne w 2. ćwierci XVIII w., funkcjonujący do XIX w.; osiowy, z sienią i kuchenką w środku, dwutraktowymi izbami i komorami po bokach, z kaplicą i dwiema izdebkami na pięterku; typowy średniozamożny dwór późnobarokowy",
   zrodla: [{segment: S08-p063-s02, cytat: "Rezydencja Pstrokońskich, zapewne zbudowana w drugiej ćwierci XVIII w. i funkcjonująca chyba do XIX w. była dworem drewnianym, osiowym, z sienią i kuchenką położonymi w centralnej partii budynku"}, {segment: S08-p063-s02, cytat: "a także z kaplicą i dwoma izdebkami na pięterku."}], pewnosc_odczytu: pewna}
- {id: S08-020, podmiot: koscierzyn, relacja: opis, wartosc: "hipoteza sekwencji siedzib: 3 dwory obronne (w łąkach, dwa na kopcu w parku — późnośredniowieczny i renesansowy), 4. późnobarokowy dwór Pstrokońskich (albo „dworek” z 1722), potem XIX-wieczny drewniany dwór z ganeczkiem na osi, nieco na południe od kopca, i murowana „lodownia”; murowana „rządcówka” o cechach klasycystycznych powstała dopiero po 1926 r. (po spaleniu starego dworu, gdzie mieszkał rządca), podobno wg projektu Stanisława Prządzyńskiego; obecny dwór to 5. lub 6. rezydencja — świadectwo przemian siedziby rycersko-szlacheckiej przez blisko 700 lat",
   zrodla: [{segment: S08-p063-s03, cytat: "Pierwsze trzy dwory (położony w łąkach oraz dwa na kopcu w parku — pierwszy późnośredniowieczny, drugi — renesansowy) miały oczywiste walory obronne"}, {segment: S08-p063-s03, cytat: "nastąpiło dopiero po 1926 r., po spaleniu się starego dworu, w którym — po wyprowadzeniu się właścicieli do nowego — mieszkał rządca. Budynek ten został podobno samodzielnie zaprojektowany przez Stanisława Prządzyńskiego. Tak więc istniejący obecnie dwór jest piątą lub szóstą rezydencją w Kościerzynie."}, {segment: S08-p064-s01, cytat: "stanowią ciekawe świadectwo przemian wiejskiej siedziby rycersko-szlacheckiej na prze-strzeni blisko 700 lat."}], pewnosc_odczytu: pewna}
- {id: S08-021, podmiot: przadzynski-wincenty-1839, relacja: opis, wartosc: "Wincenty Prządzyński (1839–1895) z Leźnicy Wielkiej: po ukończeniu wydziału technicznego w Paryżu zamieszkał w Kobierzycku; był w powstaniu; założył tam fabrykę mączki kostnej, fabrykę narzędzi rolniczych i młyn parowy; radca Towarzystwa Kredytowego Ziemskiego i sędzia pokoju okręgu sieradzkiego; kupił Kościerzyn; stracił wzrok", data: {tekst: "(1839–1895)", od: 1839, do: 1895},
   zrodla: [{segment: S08-p064-s03, cytat: "kupił od Roz-drażewskich Wincenty Prządzyński (1839–1895) z Leźnicy Wielkiej w Łęczyc-kiem. Po „ukończeniu wydziału technicznego w Paryżu zamieszkał w Kobierzyc-ku. Był w Powstaniu. W Kobierzycku założył fabrykę mączki kostnej, fabrykę narzędzi rolniczych i młyn parowy. Był radcą Towarzystwa Kredytowego Ziemskiego i sędzią pokoju na okręg sieradzki. Kupił Kościerzyn”"}, {segment: S08-p064-f26, cytat: "List Anny z Prządzyńskich Radoszewskiej z 18 III 1991 w moim posiadaniu."}], pewnosc_odczytu: pewna, uwagi: "Za listem Anny z Prządzyńskich Radoszewskiej (18 III 1991)."}
