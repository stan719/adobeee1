- {id: S07-398, podmiot: przadzynski-ignacy-1792, relacja: opis, wartosc: "generał dywizji (kampania 1831); nauka w Dreźnie; 1807 pułk piechoty gen. Sierawskiego[?], szkoła aplikacyjna, ppor. Korpusu Inżynierów; kampania 1809 (fortyfikacja Modlina); 1812 wyprawa na Moskwę (kpt. inż., dyw. Dąbrowskiego, Bobrujsk); 1813 pod Lipskiem szef batalionu; 1814 major; komisja demarkacyjna Prusy–Królestwo; 1819–20 wykłady strategii; dzieło o fortyfikacjach polowych; plany i budowa Kanału Augustowskiego; więziony 1826–1829 w dawnym klasztorze Karmelitów (listy od żony przenosił pies „Butor”[?]); twierdza w Dęblinie wg jego projektu; powstanie listopadowe; zesłany do Jarosławia, potem Gatczyny[?], powrót 1833; mieszkał w Przepiórkowie[?], potem w Krakowie",
   zrodla: [{segment: S07-p30-s01, cytat: "gen. dywizji w czasie Kampanji 1831 r. Uczył się w Dreźnie"},
            {segment: S07-p30-s01, cytat: "Robi plany Kanału Augustowskiego i buduje Kanał. Więziony od 1826 r. do 1829 w więzieniu w dawnym Klasztorze Karmelitów."},
            {segment: S07-p30-s01, cytat: "a listy przenosił pies „Butor”"},
            {segment: S07-p31-s01, cytat: "powstaje według jego projektów. Bierze udział w Pow. Listop. Zesłany do Jarosławia potem do Gatczyna[?] wraca do kraju 1833 r. Mieszka na wsi u siebie w Przepiórkowie[?] potem w Krako[wie]"}], pewnosc_odczytu: niepewna}
