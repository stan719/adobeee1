- {id: S08-134, podmiot: radoszewice, relacja: opis, wartosc: "po śmierci Ludwika Niemojowskiego majątek krótko trzymali Wodzińscy, potem Molińscy; po I wojnie Teodor Durzyński, aptekarz z Praszki; w międzywojniu Maks Piekarski i jego syn Henryk; ponownie T. Durzyński do 1939; po wojnie dwór przeznaczono na szkołę podstawową (wg S. Łakomego, „Opis dworku w Radoszewicach”, 1991)", data: {tekst: "po 1892 – 1939", od: 1892, do: 1945},
   zrodla: [{segment: S08-p128-s02, cytat: "Niemojowscy byli ostatnią liczącą się w dziejach Radoszewic rodziną. Po śmierci Ludwika majątek krótko trzymali: Wodzińscy, potem Molińscy, a po I wojnie światowej Teodor Durzyński, aptekarz z pobliskiej Praszki. W okresie międzywojennym Radoszewice dostały się Żydom: Maksowi Piekarskiemu i jego synowi Henrykowi, od których powtórnie odkupione zostały przez T. Durzyń-skiego. Był on właścicielem do 1939 r.20 Po II wojnie światowej dwór przeznaczono na Szkołę Podstawową."}, {segment: S08-p128-f20, cytat: "S. Łakomy, Opis dworku w Radoszewicach. Radoszewice 1991"}], pewnosc_odczytu: pewna, uwagi: "S10 podaje inną chronologię (Duryński do 1913, bracia Maks i Bernard Piekarscy 1913–1937)."}
