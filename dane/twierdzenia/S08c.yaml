- {id: S08-138, podmiot: radoszewice, relacja: opis, wartosc: "1885: folwarki Radoszewice, Kuszyna, Dolina; osady młyńskie Mierzanów, Katarzynopol, Borkowe, Sznury, Wymysłówek; kolonie; razem 3824 morgi, w samych Radoszewicach 918 mórg gruntu, 193 łąk, 101 pastwisk, 1967 lasu, 7 budynków murowanych i 33 drewnianych", data: {tekst: "W roku 1885", od: 1885, do: 1885},
   zrodla: [{segment: S08-p128-s03, cytat: "W roku 1885 dobra radoszewickie składały się z folwarków: Radoszewice, Kuszyna, Dolina, i osad młyńskich: Mierzanów, Katarzynopol, Borkowe, Sznury i Wymysłówek, a także kolonii. Łącznie dobra obejmowały 3824 morgi gruntu"}], pewnosc_odczytu: pewna, uwagi: "Za SGKP t. IX s. 437; rozstrzyga odczyty S02 (Mierzanów, Sznury)."}
- {id: S08-139, podmiot: radoszewski-jan-hieronim-1552, relacja: wlasnosc, obiekt: radoszewice, wartosc: "w latach 1552–1553 wieś należała do Jana, Hieronima i Mikołaja Radoszewskich: 11 łanów, 26 osadników, młyny", data: {tekst: "W latach 1552–1553", od: 1552, do: 1553},
   zrodla: [{segment: S08-p128-s04, cytat: "W latach 1552–1553 była to wieś należąca do Jana, Hieronima i Mikołaja Radoszewskich, z 11 łanami, 26 osadnikami i młynami"}], pewnosc_odczytu: pewna,
   uwagi: "Tu Jan i Hieronim to dwie osoby; w S02 „Jana Hieronima[?]” — jedna. Rekord radoszewski-jan-hieronim-1552 obejmuje na razie obie lektury."}
- {id: S08-140, podmiot: radoszewski-lukasz-1588, relacja: wlasnosc, obiekt: radoszewice, wartosc: "przy dziale 1588 dostał „siedlisko stare […] z ogrodem, sadzawkami, z przykopem i ze wszystkimi budowlami” — stary zespół dworski; wg L. Kajzera prawdopodobnie obronny dwór na kopcu z fosą, późnośredniowieczny, może fundacji Bogusława, syna Imbrama (ok. poł. XV w.)", data: {tekst: "w 1588 r.", od: 1588, do: 1588},
   zrodla: [{segment: S08-p128-s04, cytat: "Przy podziale w 1588 r. odnotowano, że Łukaszowi, synowi Jana dostało się „siedlisko stare [...] z ogrodem, sadzawkami, z przykopem i ze wszystkimi budowlami”"}, {segment: S08-p128-s04, cytat: "wersję o dworze na kopcu w Radoszewicach uważam za"}, {segment: S08-p129-s01, cytat: "bardzo prawdopodobną. Obronny dwór, który w 1588 r. dostał się Łukaszowi Radoszewskiemu, miałby chyba metrykę późnośredniowieczną"}, {segment: S08-p129-s01, cytat: "Przy tej interpretacji dwór opisany w 1588 r. byłby jeszcze fundacją Bogusława, syna Imbrama."}], pewnosc_odczytu: pewna}
- {id: S08-141, podmiot: radoszewski-lukasz-1588, relacja: rodzic, obiekt: radoszewski-jan-hieronim-1552, wartosc: "„Łukaszowi, synowi Jana”",
   zrodla: [{segment: S08-p128-s04, cytat: "Łukaszowi, synowi Jana"}], pewnosc_odczytu: pewna, uwagi: "Ojciec = Jan z 1552 r. — prawdopodobne."}
- {id: S08-142, podmiot: radoszewski-stanislaw-1679, relacja: opis, wartosc: "1664: wizja w sporze o grodzenie łąk i ogrodów „koło kościoła i na Lipku [chyba w Lipniku]”", data: {tekst: "1664 r.", od: 1664, do: 1664}, miejsce: radoszewice,
   zrodla: [{segment: S08-p129-s02, cytat: "Kolejny akt z 1664 r. nie zawiera opisu budynków dworskich, lecz tylko wizję związaną ze sporami Stanisława Radoszewskiego o grodzenie łąk i ogrodów „koło kościoła i na Lipku [chyba w Lipniku]”"}], pewnosc_odczytu: pewna, uwagi: "Utożsamienie Stanisława z 1664 i zm. 1679 — prawdopodobne."}
