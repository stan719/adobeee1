- {id: S08-111, podmiot: radoszewice, relacja: opis, wartosc: "Siemkowscy opuścili Siemkowice w końcu XVII w.; Radoszewscy mieszkali w Radoszewicach do końca XVIII w., nazywając się w XVII–XVIII w. „z Siemkowic Boksa Radoszewscy”; podział ojcowizny wyznacza też początek pierwszego dworu w Radoszewicach",
   zrodla: [{segment: S08-p126-s02, cytat: "Gdy w końcu XVII w. opuścili Siemkowice Siemkowscy, Radoszewscy nadal zamieszkiwali w Radoszewicach i pozostali w nich do końca XVIII w."}, {segment: S08-p126-s02, cytat: "w wiekach XVII i XVIII nazywali się oni „z Siemkowic Boksa Radoszewscy”"}, {segment: S08-p126-s02, cytat: "lecz także i pierwszy dwór w Radoszewicach."}, {segment: S08-p126-f13, cytat: "Por. rozdział Siemkowice w tymże tomie."}], pewnosc_odczytu: pewna}
- {id: S08-112, podmiot: radoszewski-michal-1775, relacja: opis, wartosc: "wg tradycji rodzinnej I rozbiór tak podkopał majątek Michała z Siemkowic Boksy Radoszewskiego (†1775), kasztelana brzezińskiego, że rodzina zbiedniała, straciła Radoszewice i przeniosła się w okolice Uniejowa",
   zrodla: [{segment: S08-p126-s02, cytat: "I rozbiór Polski tak podkopał stan majątkowy Michała z Siemkowic Boksy Radoszewskiego (†1775) kasztelana brzezińskiego, że rodzina szybko zbiedniała, straciła Rado-szewice i przeniosła się w okolice Uniejowa."}, {segment: S08-p126-f14, cytat: "List Anny z Prządzyńskich Radoszewskiej w moim posiadaniu."}], pewnosc_odczytu: pewna}
