- {id: S08-123, podmiot: niemojowski-gabriel-1854, relacja: wlasnosc, obiekt: radoszewice, wartosc: "dobra Radoszewice, Kuźnica, Kuszyna, Laski i Zmyślona nabyte w 1815 r. od Wincentego Niemojowskiego za 84 000 rs; inwentarz po śmierci (1854, 22 tytuły): meble 11 pozycji (>123 rs; komplet stołowy mahoniowy 45 rs, dwa lustra 30 rs), srebra 5 pozycji (>117 rs), złoty zegarek 30 rs, gorzelnia i browar z „aparatem pistoryusza” 1050 rs, kareta, powóz, landara; gotówka u wdowy 90 000 złp (13,5 tys. rs); aktywa >107 tys. rs, długi >44 tys., nadwyżka >63 tys. rs", data: {tekst: "w 1815 r.; 1854", od: 1815, do: 1854},
   zrodla: [{segment: S08-p127-f16, cytat: "Pierwszy obejmował nieruchomości, czyli dobra: Radoszewice, Kuźnica, Kuszina, Laski i Zmyślona, nabyte w 1815 r. od Wincentego Niemojowskiego za 84 000 rs."}, {segment: S08-p127-f16, cytat: "gdzie znajdował się „aparat pistoryusza” czyli alembik do destylacji wart 1050 rs. [!!!]."}, {segment: S08-p127-f16, cytat: "Łącznie aktywa radoszewskie wynosiły ponad 107 tysięcy rubli, długi ponad 44 tysiące, czyli bilans zamykał się nadwyżką ponad 63 tysięcy rs."}, {segment: S08-p127-s01, cytat: "zachowały się po nich ciekawe inwentarze, przechowywane obecnie w archiwum w Sieradzu"}], pewnosc_odczytu: pewna}
- {id: S08-124, podmiot: lubowidzka-katarzyna, relacja: opis, wartosc: "inwentarz po jej śmierci (1858): meble >205 rs (fortepian 15 rs, 5 szaf, ekran z malaturą lwicy, figurka Turka, porcelanowe figurki, 30 „landszaftów”, 60 dawnych książek francuskich), precjoza 37 pozycji 126 rs (broszka, lornetka, bransoletka, srebrna miednica z kubkiem), zielony powóz 90 rs; majątek >62 tys. rs, po odliczeniu długów 61 248 rs", data: {tekst: "1858", od: 1858, do: 1858},
   zrodla: [{segment: S08-p127-f16, cytat: "tom A. Kowalskiego z 1858 r. f. 151–69 gdzie inwentarz po śmierci Katarzyny z Lubowidzkich Niemojowskiej."}, {segment: S08-p127-f16, cytat: "Łącznie cały majątek po zmarłej wart był ponad 62 tysiące rs., a po odliczeniu ponad 1 tysiąca rs. długów, dawał łącznie sumę 61 248 rs."}], pewnosc_odczytu: pewna}
