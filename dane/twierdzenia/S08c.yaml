- {id: S08-145, podmiot: radoszewski-stanislaw-1679, relacja: wlasnosc, obiekt: radoszewice, wartosc: "majętność: Radoszewice, Kuszyna, Kuźnica zwana Ługowską, folwark w Mierzanowie", data: {tekst: "1679", od: 1679, do: 1679},
   zrodla: [{segment: S08-p129-s03, cytat: "W skład majętności wcho-dziły wtedy osady Radoszewice, Kuszyna, Kuźnica zwana Ługowską i folwark w Mierzanowie"}], pewnosc_odczytu: pewna}
- {id: S08-146, podmiot: radoszewice-dwor, relacja: opis, wartosc: "dwór w 1679 r.: wielka sień brukowana kamieniem z dwoma kominami, izba stołowa z zielonym polewanym piecem, pokój malowany (5 okien w ołów, piec pstry), komora z kratami, kaplica bez ołtarza, piwnica; drugi budynek z dwiema izbami, kuchnią i spiżarnią; trzeci budynek „Roza (Róża?)” bez dachu; piekarnia, browar, nowe stajnie i wozownia, owczarnia na 500 owiec, stodoły, obora (25 krów dojnych i inne zwierzęta); typowy dwór osiowy XVII w., dobrze utrzymany", data: {tekst: "1679", od: 1679, do: 1679},
   zrodla: [{segment: S08-p129-s03, cytat: "„Najprzód Radoszewice. W tych dobrach są dworskie budynki jako to dwór, do którego wchodząc do sieni drzwi na zawiasach żelaznych, sień sama przez się wielka kamieniem brukowana, w niej kominy dwa z grontu wymurowane."}, {segment: S08-p129-s03, cytat: "Naprzeciwko tejże izbie wielkiej pokój malowany w którym okien pięć w ołów oprawnych, piec malowany pstry"}, {segment: S08-p129-s03, cytat: "Przy tymże pokoju kaplica w której ołtarza nie masz ani okien tylko ostrz żelazne."}, {segment: S08-p129-s03, cytat: "Trzeci budynek nazwany Roza (Róża?) w którym budynku dwie izbie przeciwko sobie puste, nad którymi dachu nie masz...”"}, {segment: S08-p129-s03, cytat: "wielka owczarnia (mieszcząca 500 owiec)"}, {segment: S08-p129-s03, cytat: "„w której oborze krów dwadzieścia i pięć doynych"}, {segment: S08-p130-s03, cytat: "Siedemnastowieczny dwór był typowym dla tego czasu budynkiem osiowym, z dwoma dużymi izbami (stołową i pokojem malowanym wyposażony-mi w kaflowe piece), z sienią, kilkoma mniejszymi pomieszczeniami i kaplicą."}], pewnosc_odczytu: pewna}
- {id: S08-147, podmiot: radoszewski-andrzej-1679, relacja: rodzic, obiekt: radoszewski-stanislaw-1679, wartosc: "otrzymał testamentem rumaka siwego",
   zrodla: [{segment: S08-p130-s01, cytat: "rumak siwy ten otkazany testamentem Imci Panu Andrzejowi Radoszewskiemu synowi nieboszczykows-kiemu, którego ten Imci Pan zaraz wziął”"}], pewnosc_odczytu: pewna}
- {id: S08-148, podmiot: radoszewice, relacja: opis, wartosc: "poddani 1679: kmiecie (wymieniono 10: Kantor, Kuśmierz, Chernach, Rychlik, Głąbik, Domagała, Kowalczyk, Czekaj, Sołtys, Skudlarz); zagrodnicy (Klich, Tyka, Łacheta, Olek, Kulawy, Jan, Zimny, Sadel, Szymański, Kucharz); rzemieślnicy (Grzegorz i Matias płóciennicy, Wojciech kowal, Bartosz krawiec, Chaimski chałupnik); komornice Zajersowa, Pawłowa, Baranka; karczmarz Szpakowski; młynarze na Warcie i na stawach (ci ostatni należą do Raciborskich)", data: {tekst: "1679", od: 1679, do: 1679},
   zrodla: [{segment: S08-p130-s02, cytat: "W tejże wsi Radoszewi-ce jest kmieci wszystkich jedenaście to jest: pierwszy Kantor"}, {segment: S08-p130-s02, cytat: "Zagrodnicy, których jest dziewięć jako to: Klich, Tyka, Łacheta, Olek, Kulawy, Jan, Zimny, Sadel, Szymański, Kucharz. Rzemieśl-nicy ci: Grzegorz płóciennik, Matias płóciennik, Woyciech kowal, Bartosz krawiec, Chaimski chałupnik. Komornice te: Zajersowa, Pawłowa, Baranka. Szpakowski karczmarz"}, {segment: S08-p130-s02, cytat: "ci na stawach należą do Imci Panów Raciborskich spólni”"}], pewnosc_odczytu: pewna}
- {id: S08-149, podmiot: radoszewski-stanislaw-1679, relacja: pochowek, wartosc: "koszty pogrzebu 1679: msze 120 fl., kir 58, ćwieki do trumny 17; we Wrocławiu korzenie, cukry, konfety 216 zł; dwie beczki wina 420 zł i dokupione wino za 32 zł", data: {tekst: "1679", od: 1679, do: 1679},
   zrodla: [{segment: S08-p130-s03, cytat: "„oblata regestri expensarum pro funere Radoszewski”"}, {segment: S08-p130-s03, cytat: "na msze w różnych kościołach wydano 120 florenów, za dwa postawy kiru 58, a za świeki stanowiące obicie trumny 17."}, {segment: S08-p130-s03, cytat: "„we Wrocławiu za korzenie, cukry, konfety i inne należne do pogrzebu potrzeby” wydano 216 złotych, za dwie beczki wina 420 złotych"}], pewnosc_odczytu: pewna}
- {id: S08-150, podmiot: radoszewice-dwor, relacja: opis, wartosc: "1782: częściowy podział dworu w rodzinie Niemojowskich — dwa pokoiki w oficynie dla dzieci Katarzyny Niemojowskiej (1° v. Obzowskiej, wdowy po Antonim Obzowskim, stolniku piotrkowskim); reszta należała do Martyny z Wężyków, wdowy po Andrzeju Niemojowskim, stolniku wieluńskim", data: {tekst: "w 1782 r.", od: 1782, do: 1782},
   zrodla: [{segment: S08-p130-s04, cytat: "Już w 1782 r. następuje częściowy podział dworu między członków rodziny. Część dworu, „a raczej dwa pokoiki w officynie” oddano wtedy dzięki wstawiennictwu Katarzyny Niemojowskiej (z pierwszego męża Obzowskiej, wdowie po Antonim Obzowskim, stolniku piotrkowskim) jej dzieciom. Reszta posiadłości należała do „Martiny de Wężyk”, wdowie po stolniku wieluńskim Andrzeju Niemojo-"}, {segment: S08-p131-s01, cytat: "wskim31."}], pewnosc_odczytu: pewna}
- {id: S08-151, podmiot: niemojowski-andrzej-stolnik, relacja: malzonek, obiekt: wezyk-martyna, wartosc: "wdowa w 1782 r.",
   zrodla: [{segment: S08-p130-s04, cytat: "„Martiny de Wężyk”, wdowie po stolniku wieluńskim Andrzeju Niemojo-"}], pewnosc_odczytu: pewna}
- {id: S08-152, podmiot: niemojowska-katarzyna-obzowska, relacja: malzonek, obiekt: obzowski-antoni, wartosc: "pierwszy mąż; stolnik piotrkowski",
   zrodla: [{segment: S08-p130-s04, cytat: "Katarzyny Niemojowskiej (z pierwszego męża Obzowskiej, wdowie po Antonim Obzowskim, stolniku piotrkowskim)"}], pewnosc_odczytu: pewna}
- {id: S08-153, podmiot: radoszewice-dwor, relacja: opis, wartosc: "inwentarze 1791 i 1 VI 1792 (po Feliksie Niemojowskim, cześniku wieluńskim; klucze Słupia, Oleszno, „Radoszyce”): we dworze obraz NMP, 2 portrety króla Poniatowskiego, portret Leszczyńskiego, 4 portrety Niemojowskich, 30 miedziorytów; rzeźby — figurki porcelanowe (pruska, wiedeńskie, angielskie, saskie), postać gipsowa z dzikiem, 5 gipsowych biustów, 28 drewnianych figurek; J. A. Ojrzyński widział w tym wpływy klasycyzmu", data: {tekst: "1791; 1 czerwca 1792 r.", od: 1791, do: 1792-06-01},
   zrodla: [{segment: S08-p131-s01, cytat: "Dwie najciekawsze i najobszerniejsze relacje o stanie majątku Niemojo-wskich i wyposażeniu domostw spisano w latach 1791 i 1792"}, {segment: S08-p131-s01, cytat: "obejmującej klucze z rezydencjami w Słupi, Olesznie i Radoszycach"}, {segment: S08-p131-s01, cytat: "„duży, Najświętszey Panny Maryi jeden, portretów Króla Imci Poniatowskiego dwa, portret Leszczyńskiego jeden, portretów familiji WW Niemojowskich cztery"}, {segment: S08-p131-s01, cytat: "bustów [!] w kolorze białym dużych sztuk gipsowych pięć"}, {segment: S08-p131-s01, cytat: "Inwentarz ten był już wykorzystywany w niepub-likowanym studium J. A. Ojrzyńskiego"}], pewnosc_odczytu: pewna}
- {id: S08-154, podmiot: radoszewice-dwor, relacja: opis, wartosc: "obecny dwór to budynek opisany w 1791–1792 — powstał w latach 70. (lub na przełomie lat 70./80.) XVIII w.; późniejsze przebudowy (portyk kolumnowy, ściany murowane zamiast drewnianych, likwidacja balkoniku, papa zamiast gontu) nie zmieniły sylwetki; w końcu XVIII w. założenie pałacowe „entre cour et jardin”: dwór, 2 oficyny, 2 „narożniki”, „ogród włoski” (grabina, bukszpan, lawenda), parkan, brama na murowanych słupach, oranżeria poza założeniem — jedno z największych w Wieluńskiem", data: {tekst: "lata 70. XVIII w.", od: 1770, do: 1785},
   zrodla: [{segment: S08-p131-s02, cytat: "Porównanie opisu dworu z końca XVIII w. i stanu obserwowanego obecnie niedwuznacznie wskazuje, że zachowany budynek jest dworem opisanym w latach 1791–1792. Sądzić więc można, że dwór powstał w latach siedem-dziesiątych (lub na przełomie lat siedemdziesiątych i osiemdziesiątych) XVIII w."}, {segment: S08-p132-s01, cytat: "nie zmieniły zasadniczo jego schyłkowo osiemnastowiecznej sylwetki."}, {segment: S08-p132-s01, cytat: "ukształtowana była w formie ba-rokowego założenia pałacowego entre cour et jardin."}, {segment: S08-p132-s01, cytat: "jednym z największych (jeśli nie największym) na terenie Wieluńskiego, odpowiadającym pozycji społecznej i finansowej Niemojowskich."}], pewnosc_odczytu: pewna, uwagi: "S10: pałacyk zbudowany przez Niemojowskich; budynek z XVIII w."}
- {id: S08-155, podmiot: radoszewice-dwor, relacja: opis, wartosc: "upadek zespołu od przełomu XIX/XX w. (częste zmiany właścicieli), dokończony w czasie II wojny i po niej — wnętrza zamienione na klasy; obecnie budynek parterowy z poddaszem i piwnicami, 38×12 m, dwutraktowy; od wschodu siedmioosiowy fronton z piętrowym portykiem na 4 murowanych kolumnach (zapewne XIX w.) i facjatkami; od zachodu dziewięcioosiowa elewacja z ryzalitem z balkonikiem i trójkątnym szczytem; dach łamany polski, do początku lat 70. gontowy, obecnie papa",
   zrodla: [{segment: S08-p132-s02, cytat: "Sądzić jednak należy, że proces ten rozpoczął się już od przełomu XIX/XX w., w związku z częstymi zmianami właścicieli, a następnie dokończony został w latach II wojny i bezpośrednio po niej."}, {segment: S08-p132-s02, cytat: "Zbudowany na planie prostokąta (38 × 12 m) ma dwutraktowy układ wnętrz"}, {segment: S08-p132-s02, cytat: "piętrowym portykiem z czterema murowanymi kolumnami (chyba późniejszym, pochodzącym z XIX w., gdyż nie opisanym w latach 1791–1792)."}, {segment: S08-p132-s02, cytat: "Do początku lat siedemdziesiątych czterospadowy, łamany, polski dach (z parą facjatek w obu elewacjach) był jeszcze pokryty gontem"}], pewnosc_odczytu: pewna}
