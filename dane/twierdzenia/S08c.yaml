# S08 cz. 3: L. Kajzer, „Radoszewice — dwory”, s. 123–132

- {id: S08-102, podmiot: radoszewice, relacja: opis, wartosc: "położenie: przy drodze z Działoszyna przez Siemkowice, Osjaków i Konopnicę do Rychłocic i szosy Wieluń–Łask, ok. 6 km na zachód od Siemkowic; na skraju ziemi wieluńskiej (granica sieradzko-wieluńska między Siemkowicami a Radoszewicami); od 1918 pow. wieluński woj. łódzkiego, od 1975 gm. Siemkowice woj. sieradzkiego; dwór w centrum wsi frontem do drogi",
   zrodla: [{segment: S08-p123-s01, cytat: "RADOSZEWICE — DWORY"}, {segment: S08-p123-s02, cytat: "1. Informacje wstępne i dzieje wsi. 2. Dwory i ich przekształcenia. 3. Aneksy źródłowe."}, {segment: S08-p123-s03, cytat: "Przy drodze z Działoszyna prowadzącej przez Siemkowice, Osjaków i Konopnicę do Rychłocic i głównej szosy Wieluń-Łask znajdują się Ra-doszewice, oddalone o około 6 km na zachód od Siemkowic."}, {segment: S08-p123-s03, cytat: "historyczna granica między Sieradzkiem i Wieluńskim przechodziła właśnie między Siemkowicami a Ra-doszewicami."}, {segment: S08-p123-s03, cytat: "Dwór znajduje się w cen-trum wsi, stojąc frontem do opisanej drogi."}], pewnosc_odczytu: pewna}
- {id: S08-103, podmiot: radoszewice, relacja: opis, wartosc: "pierwsza wzmianka źródłowa 1456 (AGAD Castr. Sirad. inscr. 11 f. 483); metryka opracowana przez R. Rosina; w początku XVI w. dziesięcina dla plebana w Siemkowicach", data: {tekst: "1456 r.", od: 1456, do: 1456},
   zrodla: [{segment: S08-p123-s04, cytat: "Wieś pojawia się w źródłach pisanych dopiero w 1456 r.1 i posiada metrykę historyczną opracowaną przez R. Rosina"}, {segment: S08-p123-f1, cytat: "Castr. Sirad. inscr. 11, f. 483."}, {segment: S08-p123-s04, cytat: "W początku XVI w. dziesięcina z Radoszewic oddawana była plebanowi w Siemkowicach"}], pewnosc_odczytu: pewna, uwagi: "S02 (za herbarzami) — wzmianki już z XII w."}
- {id: S08-104, podmiot: radoszewski-marcin-1625, relacja: fundacja, obiekt: radoszewice-kosciol, wartosc: "na początku XVII w. Marcin Boksa Radoszewski h. Oksza wzniósł drewniany kościół, konsekrowany 1625 jako filialny parafii Osjaków; restaurowany ok. 1760, upadł ok. 1800; nowy kościół i parafia z XIX w.", data: {tekst: "na początku XVII w.; 1625 r.", od: 1601, do: 1625},
   zrodla: [{segment: S08-p123-s04, cytat: "dopiero na początku XVII w. Marcin Boksa Radoszewski, herbu Oksza, wzniósł drewniany kościół, konsekrowany w 1625 r. jako filialny parafii w Osjakowie. Restaurowany około 1760 r. upadł ostatecznie około 1800 r., a nowy pochodzi dopiero (podobnie jak parafia) z XIX w."}], pewnosc_odczytu: pewna, uwagi: "S02: nowy kościół murowany „na początku obecnego stulecia” (XX w.)."}
- {id: S08-105, podmiot: radoszewice-dwor, relacja: opis, wartosc: "stan badań: literatura skąpa (brak w KZS i u M. Pracuty; omawia M. Kubiak 1986, maszynopis); pomiar inwentaryzacyjny 1978 (pod kier. L. Deja); w 1984 L. Kajzer sugerował dwór na kopcu w 2 poł. XVI w.; plan sytuacyjny (park, gazon, sad, kaplica, drogi do Osjakowa i Siemkowic), rzut parteru i elewacje — kreśliły Maria Cyrek i Anna Marciniak-Kajzer", data: {tekst: "1978; 1984", od: 1978, do: 1984},
   zrodla: [{segment: S08-p123-s04, cytat: "Zabytki Radoszewic nie budziły dotychczas specjalnego zainteresowania i li-teratura na temat dworu nie jest bogata4. W roku 1978 wykonano pomiar"}, {segment: S08-p123-f4, cytat: "Dwór omawia natomiast M. Kubiak, XVII–XVIII-wieczne dwory województwa sieradzkiego. Łódź 1986, s. 28 nn"}, {segment: S08-p125-s02, cytat: "budynku5, a w 1984 r. L. Kajzer w monografii dworów obronnych Wieluńskiego sugerował obecność tu w 2 połowie XVI w. dworu na kopcu"}, {segment: S08-p124-s01, cytat: "Radoszewice. Plan sytuacyjny. Kreśliły Maria Cyrek i Anna Marciniak-Kajzer"}, {segment: S08-p125-s01, cytat: "Radoszewice. Dwór — rzut parteru. Kreśliły Maria Cyrek i Anna Marciniak-Kajzer"}, {segment: S08-p128a-s01, cytat: "Radoszewice. Dwór — elewacja ogrodowa. Kreśliły Maria Cyrek i Anna Marciniak-Kajzer"}, {segment: S08-p128a-s02, cytat: "Radoszewice. Dwór — elewacja frontowa. Kreśliły Maria Cyrek i Anna Marciniak-Kajzer"}], pewnosc_odczytu: pewna,
   uwagi: "Podpisy elewacji mogą być zamienione względem opisu w tekście (zob. S08-p132-s02)."}
- {id: S08-106, podmiot: wrszowiec-jan, relacja: opis, wartosc: "wg kroniki Kosmasa na początku XII w. rycerz nasłany przez Jana, syna Czesty (Czsty), z rodu Wrszowców zamordował na polowaniu księcia praskiego Świętopełka; prześladowani Wrszowcy uciekli do Polski i otrzymali nadania od Krzywoustego — część osadzono w Radoszewicach i Siemkowicach; od nich wg starszych heraldyków (Paprocki) Siemkowscy i Radoszewscy; wersja niepewna, ale dość wiarygodna (por. Sławnikowice, Dypoldowice)",
   zrodla: [{segment: S08-p125-s03, cytat: "rycerz nasłany przez Jana syna Czesty (Czsty) z rodu Wrszowców zamordował na polowaniu księcia praskiego Świętopełka"}, {segment: S08-p125-s03, cytat: "Część Wrszowców osadzona została właśnie w Radoszewicach i Siemkowicach, a potomkami ich są, według starszych heraldyków, rodziny Siemkowskich i Radoszewskich."}, {segment: S08-p126-s01, cytat: "XVI-wieczny heraldyk B. Paprocki8. Choć wersja o pochodzeniu protoplastów Radoszewskich i Siemkowskich od czeskich Wrszowców nie jest do końca pewna, jest to przekaz dość wiarygodny"}, {segment: S08-p125-f7, cytat: "Kosmasa Kronika Czechów. Warszawa 1968, ks. III"}], pewnosc_odczytu: pewna,
   uwagi: "W S02/S10 (SGKP) zabójcą jest sam Jan Wrszowiec; tu — rycerz nasłany przez Jana syna Czesty."}
- {id: S08-107, podmiot: radoszewski-imbram-1412, relacja: opis, wartosc: "Imram-Imbram, wspólny przodek Radoszewskich i Siemkowskich h. Oksza, notowany w 1412 i 1413; jego majątek z centrum w Siemkowicach podzielono ok. 1430–1440 między synów: Stegniew-Stoigniew dostał Siemkowice, Bogusław-Boksza — Radoszewice, Lipnik i Broszęcin", data: {tekst: "1412 i 1413", od: 1412, do: 1413},
   zrodla: [{segment: S08-p126-s02, cytat: "Radoszewscy z Radoszewic i Siemkowscy (Siemikowscy) z Siemkowic, rodziny pieczętujące się herbem Oksza, wywodziły się od wspólnego przodka Imrama-Imbrama, notowanego źródłowo w latach 1412 i 1413"}, {segment: S08-p126-s02, cytat: "Jego wielo-wioskowy majątek z centrum w Siemkowicach został około 1430–1440 r. podzielony między dwóch braci, synów Imbrama: Stegniew-Stoigniew otrzymał podstawową część ojcowizny z Siemkowicami, Bogusław-Boksza Radoszewice wraz z okolicznymi wsiami"}], pewnosc_odczytu: pewna}
- {id: S08-108, podmiot: radoszewski-boguslaw-1441, relacja: wlasnosc, obiekt: radoszewice, wartosc: "po podziale ok. 1430–1440 dostał Radoszewice, Lipnik i Broszęcin; założyciel linii Radoszewskich; Radoszewice stały się ośrodkiem majątku nieco przed połową XV w.", data: {tekst: "około 1430–1440 r.", od: 1430, do: 1440},
   zrodla: [{segment: S08-p126-s02, cytat: "a Bogusław-Boksza otrzymał po podziale Radoszewice, Lipnik i Broszęcin"}, {segment: S08-p126-s02, cytat: "Tak więc Radoszewice stały się ośrodkiem wielowioskowego majątku dopiero nieco przed połową XV w."}], pewnosc_odczytu: pewna}
- {id: S08-109, podmiot: radoszewski-boguslaw-1441, relacja: rodzic, obiekt: radoszewski-imbram-1412,
   zrodla: [{segment: S08-p126-s02, cytat: "synów Imbrama: Stegniew-Stoigniew otrzymał podstawową część ojcowizny z Siemkowicami, Bogusław-Boksza Radoszewice"}], pewnosc_odczytu: pewna}
- {id: S08-110, podmiot: radoszewski-stogniew-1467, relacja: rodzic, obiekt: radoszewski-imbram-1412, wartosc: "Stegniew-Stoigniew dostał Siemkowice; przodek Siemkowskich; zbudował w Siemkowicach nową murowaną rezydencję obronną",
