   zrodla: [{segment: S08-p128-s01, cytat: "synami wspomnianego wyżej Feliksa Niemo-jowskiego (i Anieli z Walkowskich) byli znani działacze polityczni, posłowie i zarazem propagatorzy nowoczesnego rolnictwa: Wincenty Wierusz Niemojo-wski (1784–1834) i jego brat Bonawentura (1787–1835) posiadacz wzorowego majątku w Marchwaczu koło Kalisza"}, {segment: S08-p128-f19, cytat: "Por. biogramy Bonawentury i Wincentego Niemojowskich"}], pewnosc_odczytu: pewna}
