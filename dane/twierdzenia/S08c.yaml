- {id: S08-126, podmiot: niemojowski-ludwik-1823, relacja: zawod, wartosc: "nowelista, dramaturg, etnograf; publikował jako „Ludwik z Radoszewic”, „L. Nś”, „Ludwik spod Wielunia” w „Gazecie Warszawskiej”, „Kurierze Codziennym”, „Biesiadzie Literackiej” i in.; trzy tomy „Powieści i szkiców obyczajowych” (Warszawa 1881) — zbeletryzowana kronika towarzyska Wielunia; pod koniec życia utwory dla dzieci",
   zrodla: [{segment: S08-p127-s02, cytat: "Był to nowelis-ta, dramaturg i etnograf"}, {segment: S08-p127-s02, cytat: "Jako „Ludwik z Radoszewic”, „L. Nś” lub „Ludwik spod Wielunia” publikował w „Gazecie Warszawskiej”, „Kurierze Codziennym”, „Biesiadzie Literackiej” i wielu innych czasopismach."}, {segment: S08-p128-s01, cytat: "trzy tomy Powieści i szkiców obyczajowych, które, oprócz innych wartości, są zakamuflowaną a zarazem zbeletryzowaną kroniką towarzyską Wielunia i oko-lic"}, {segment: S08-p128-s01, cytat: "a przy końcu życia pisał utwory dla dzieci"}, {segment: S08-p128-f18, cytat: "Trzy tomy Powieści i szkice obyczajowe ukazały się w Warszawie w 1881 r."}], pewnosc_odczytu: pewna}
