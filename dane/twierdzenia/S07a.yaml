   zrodla: [{segment: S07-p14-s01, cytat: "W 1939 r ewakuacja z Krempy (I linja frontu) Oblężenie i bombardowanie W-wy. Dom i mieszkanie Koszykowa 11 m 3 spalone i zbombardowane. Powrót do Krempy zajętej przez Niemców. 8 grudnia 39 r. wysiedleni razem z 1½ roczny[mi] Dziećmi i ich wychowawczynią p. Rózią do obozu dla przesiedleńców w Bochni przez Turek, Koło. Okupacja w W-wie i Czarnej k/Radzymina u SS. Urszulanek, gdzie przełożoną była Babcia Netka Prządzyńska"}], pewnosc_odczytu: pewna}
