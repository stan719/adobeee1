# s. 10–15: Jerzy i Anna
- {id: S07-154, podmiot: radoszewski-jerzy-1902, relacja: chrzest, miejsce: niemyslow, wartosc: "chrzcił przyjaciel i wieloletni proboszcz ks. Zawiński[?]",
   zrodla: [{segment: S07-p10-s01, cytat: "Chrzest w Niemysłowie w parafji Krempa (Ławka Kolatorska z herbem) Chrzcił przyjaciel i wieloletni proboszcz Ks. Zawiński[?]."}], pewnosc_odczytu: niepewna}
- {id: S07-155, podmiot: radoszewski-jerzy-1902, relacja: wyksztalcenie, wartosc: "nauka w domu (nauczyciel, Niemka, Francuzka); od 1916 szkoła im. Konopczyńskiego (potem Mickiewicza) w Warszawie, kl. IV; POW", data: {tekst: "1916", od: 1916, do: null}, miejsce: warszawa,
   zrodla: [{segment: S07-p10-s01, cytat: "Jerzy uczył się w domu z nauczycielem, niemką i francuską. W 1916 r. poszedł do szkoły w W-wie im. Konopczyńskiego (potem Mickiewicza) do IV kl."}], pewnosc_odczytu: pewna}
- {id: S07-156, podmiot: radoszewski-jerzy-1902, relacja: udzial_w_wydarzeniu, wartosc: "1916 świadek wejścia Legionów do Warszawy; w szkole w POW; 9 XI 1918 rozdawanie karabinów, 10 XI rozbrajanie Niemców; powrót Piłsudskiego", data: {tekst: "1916–1918", od: 1916, do: 1918}, miejsce: warszawa,
   zrodla: [{segment: S07-p10-s01, cytat: "W 1916 r był świadkiem wejścia Legjonów do W-wy (był jeszcze gub. niemiecki) W szkole zapisał się do POW (Polska Orga-nizacja Wojskowa)"},
            {segment: S07-p10-s01, cytat: "9 list. rozdawano stare karabiny i 10 list. rozbrajano na ulicach Niemców."}], pewnosc_odczytu: pewna}
- {id: S07-157, podmiot: radoszewski-jerzy-1902, relacja: udzial_w_wydarzeniu, wartosc: "1920: ochotnik w artylerii zenitowej (instruktorzy i sprzęt francuski), obrona mostów warszawskich, 15 VIII na warcie; front pod Sokółką, Grodno, Lida; pochwała Piłsudskiego; bateria przydzielona do kawalerii", data: {tekst: "1920", od: 1920, do: 1920},
   zrodla: [{segment: S07-p10-s01, cytat: "W 1920 r. gdy Bolszewicy podchodzili pod W-wę Jerzy wstąpił jako ochotnik do artylerji i został przydzielony do artylerji"},
            {segment: S07-p11-s01, cytat: "zenitowej – przeciwlotniczej, gdyż znał język francuski a instruktorami byli Francuzi i sprzęt był francuski. Jerzy został przydzielony do obrony mostów warszawskich. 15 sierpnia (cud nad Wisłą) stał na warcie."},
            {segment: S07-p11-s01, cytat: "Podczas inspekcji Naczelnika Piłsudskiego Jerzy stał na warcie i został przez niego pochwalony, że jest najmłodszy w baterji, a dobrze zna regulamin."},
            {segment: S07-p11-s01, cytat: "Po zdobyciu Grodna posuwali się do Lidy ostrzeliwani bezpośrednio z karabinów ręcznych i maszynowych, a wielokrotnie też z artylerji."}], pewnosc_odczytu: pewna}
- {id: S07-158, podmiot: radoszewski-jerzy-1902, relacja: odznaczenie, wartosc: "medal „Polska swemu Obrońcy” za udział w wojnie 1920 r. (rozkaz Dowództwa Okręgu Korpusu nr 1; odznaczono 6 osób)",
   zrodla: [{segment: S07-p12-s01, cytat: "Jerzy otrzymał order-medal „Polska swemu Obrońcy” za udział w wojnie 1920 r jako, że był w bitwie pod Grodnem i na szlaku Białystok–Lida w baterii zenitowej (przeciwlotniczej) użytej wówczas jako artylerja zwykła polowa. (Zostało odznaczo-nych 6 osób) Rozkaz Dowództwa Okręgu Korpusu № 1."}], pewnosc_odczytu: pewna}
- {id: S07-159, podmiot: radoszewski-jerzy-1902, relacja: wyksztalcenie, wartosc: "matura 1922 w szkole dla byłych wojskowych, egzamin konkursowy na SGGW", data: {tekst: "1922 r.", od: 1922, do: 1922},
   zrodla: [{segment: S07-p12-s01, cytat: "Po wyjściu z wojska poszedł do szkoły dla byłych wojskowych, gdzie w 1922 r. zdał maturę, a potem egzamin konkursowy na SGGW."}], pewnosc_odczytu: pewna}
- {id: S07-160, podmiot: radoszewski-jerzy-1902, relacja: opis, wartosc: "jeszcze w VI kl. administrował domem Marszałkowska 59, aby zarobić na utrzymanie (Krempa po dzierżawie bez dochodu)",
   zrodla: [{segment: S07-p12-s01, cytat: "Będąc jeszcze w szkole w VI kl. musiał objąć administrację domu na ul. Marszałkowskiej 59, aby wygospodarować pieniądze na swoje utrzymanie. Krempa po minionej dzierżawie nie przynosiła dochodu."}], pewnosc_odczytu: pewna}
- {id: S07-161, podmiot: radoszewski-jerzy-1902, relacja: udzial_w_wydarzeniu, wartosc: "służba wojskowa VII 1925 – X 1926 w 30 pułku art. polowej we Włodzimierzu „k/Brześcia Litewskiego”", data: {tekst: "lipiec 1925 – październik 1926", od: 1925-07, do: 1926-10}, miejsce: wlodzimierz,
   zrodla: [{segment: S07-p12-s01, cytat: "Od lipca 1925 r. do października 1926 r. służył w Wojsku Pol. w 30 pułku art. polowej we Włodzimierzu k/Brześcia Litewskiego."}], pewnosc_odczytu: pewna}
- {id: S07-162, podmiot: radoszewski-jerzy-1902, relacja: wlasnosc, obiekt: krempa, wartosc: "po wojsku przejął Krempę w złym stanie; po 4 latach uruchomił gorzelnię (części zabrali Niemcy w 1914–18); 1937 młyn motorowy z prądem dla majątku; ziemia i las dobrze zagospodarowane",
   zrodla: [{segment: S07-p12-s01, cytat: "Po powrocie z wojska przejął Krempę w b. stanie"},
            {segment: S07-p13-s01, cytat: "Jerzy uruchomił gorzelnię z której w latach 1914–18 Niemcy zabrali wszystkie części z metali. W 1937 wybudował młyn motorowy, który dostarczał energję elektryczną do majątku."}], pewnosc_odczytu: pewna}
- {id: S07-163, podmiot: krempa, relacja: opis, wartosc: "zwierzyna (dziki, lisy, borsuki, sarny, zające, kuropatwy, bażanty); park i ogród długości 1 km, aleje, podjazd wysadzany cisami[?] i jaśminami[?], trzy stawy; figura MB w dziupli dębu (fundacja Józefy Wierzchleyskiej) przeniesiona do Niemysłowa po wkroczeniu Niemców",
   zrodla: [{segment: S07-p13-s01, cytat: "W lesie i polu było dużo zwierzyny: dziki, lisy, borsuki, sarny, zające, kuropatwy, bażanty. Park i ogród w Krempie miał 1 km. długości."},
            {segment: S07-p13-s01, cytat: "Trzy stawy."},
            {segment: S07-p13-s01, cytat: "ciotka Józefa z Radoszewskich Wierzchleyska (siostra Michała) ufundowała figurę Matki Boskiej, którą po wkroczeniu Niemców przenie-siono do Kościoła w Niemysłowie."}], pewnosc_odczytu: niepewna}
- {id: S07-164, podmiot: radoszewska-jozefa-1864, relacja: fundacja, wartosc: "figura Matki Boskiej w dziupli dębu w Krempie", miejsce: krempa,
