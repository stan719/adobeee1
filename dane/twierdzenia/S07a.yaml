- {id: S07-128, podmiot: szeliska-teofila-1842, relacja: udzial_w_wydarzeniu, wartosc: "w 1863 r. po bitwie „pod Niewierszem[?]” rannych powstańców ukryto w Krempie (we dworze i „kuchmalach[?]”); Teofila (w ciąży) przemówiła do dragonów rosyjskich tak, że odjechali bez rewizji", data: {tekst: "1863 r", od: 1863, do: 1863}, miejsce: krempa,
   zrodla: [{segment: S07-p07-s02, cytat: "Podczas Powstania 1863 r po bitwie pod Niewierszem rannych powstańców przywieziono do Krempy. Schowani byli we dworze i w kuchmalach[?]. Dragoni rosyjscy otoczyli dwór i chcieli szukać rannych. Teofila wyszła na ganek (a była wtedy w ciąży) i tak do nich przemówiła, że odjechali nie szukając powstańców."}], pewnosc_odczytu: niepewna}
- {id: S07-129, podmiot: szeliska-teofila-1842, relacja: opis, wartosc: "prowadziła w Krempie ochronkę[?] (do II wojny); hodowała jedwabniki; kuracje w Karlsbadzie i Marienbadzie (szkła i kryształy z monogramami); po ślubie syna Michała mieszkała w Dominikowicach",
   zrodla: [{segment: S07-p07-s02, cytat: "Teofila prowadziła w Krempie dzienną[?] ochronkę[?] które były do II wojny światowej. Hodowała jedwabniki. Na kuracje jeździła do Karlsbadu i Marjenbadu (przywoziła piękne szkła i kryształy z monogramami) Po ślubie syna Michała mieszkała w Dominikowicach."}], pewnosc_odczytu: niepewna}
