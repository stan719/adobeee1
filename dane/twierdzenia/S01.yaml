- {id: S01-084, podmiot: radoszewski-marcin-podole, relacja: wlasnosc, obiekt: laski, wartosc: "dostał Laski z folwarkiem nad Wartą od Radoszewic, wszystko sprzedał i poszedł na Podole, gdzie przepadł (podobno ożenił się i miał dzieci); „wartogłów”, ale wierny katolik — odrzucił bogatą i ładną żonę z domu Pstrokońskich z Bużenina, bo była heretyczką",
   zrodla: [{segment: S01-p143-s05, cytat: "dostał Laski z fol-warkiem u Warty od Radoszewic, wszystko sprzedał a na Podole poszedł, tam przepadł a drudzy mówili że żonę wziął i dzieci miał, wartogłów był, ale przy wierze świętéj katolickiéj murem stał, że gdy mu panowie Pstrokońscy z Bużenina raili żonę z swego"}, {segment: S01-p144-s01, cytat: "domu, chocia była gładka i dostatnia, niechciał że heretyczka."}], pewnosc_odczytu: pewna}
- {id: S01-085, podmiot: radoszewski-mikolaj-1574, relacja: rodzic, obiekt: radoszewski-boguslaw-1441,
   zrodla: [{segment: S01-p144-s02, cytat: "4) Nicolaus V, vul. Miklasz, dictus Boxa"}], pewnosc_odczytu: pewna}
- {id: S01-086, podmiot: radoszewski-mikolaj-1574, relacja: udzial_w_wydarzeniu, wartosc: "20 lat służył na Węgrzech: zasiadał w radzie, hetmanił przeciw rokoszanom i Turkom, w wielkim zachowaniu u króla Ludwika; dostał Terebesz z Kamieńcem i ziemią na 12 mil, po Mohaczu w większości odebrane; resztę sprzedał i wrócił do kraju", miejsce: terebesz,
   zrodla: [{segment: S01-p144-s02, cytat: "dwadzie-ścia lat w Węgrzech służył, zasiadał w radzie i for-tunnie hetmanił, przeciw rokoszany i Turki, u kró-la Ludwika w wielkiem zachowaniu, dostał Tere-besz z Kamieńcem i ziemią na mil dwanaście, ale po Mochaczu odjęto że nie wiele zostało, te sprzedał a na ojczyznę wrócił"}], pewnosc_odczytu: pewna}
- {id: S01-087, podmiot: radoszewski-mikolaj-1574, relacja: wlasnosc, obiekt: radoszewice, wartosc: "spłacił Radoszewice, Broszencin, Stróże i inne; kupił Gaje i Wolę u Sieradza i kilka innych majętności — „wszystko co mamy”",
   zrodla: [{segment: S01-p144-s02, cytat: "Radoszewice, Broszencin, Stróże i in-ne spłacił, Gaje i Wole u Sieradza kupił, innych też majętności kilka, wszystko co mamy"}], pewnosc_odczytu: pewna}
- {id: S01-088, podmiot: radoszewski-mikolaj-1574, relacja: fundacja, obiekt: czestochowa-jasna-gora, wartosc: "hojny na kościoły: Jasnej Górze dał pierścień z klejnotem wart 50 grzywien i więcej, zdobyty na Turkach",
   zrodla: [{segment: S01-p144-s02, cytat: "na kościoły hoj-ny, do Jasnogórskiego dał pierścień z klejnotem na pięćdziesiąt grzywien i więcy, co na Turkach zdobył"}], pewnosc_odczytu: pewna}
- {id: S01-089, podmiot: radoszewski-mikolaj-1574, relacja: opis, wartosc: "„wielma prawy, co w sercu to na języku”; król Zygmunt August proponował mu kasztelanię rozpierską, ale podziękował; zmarł „pełen dni i zasług”",
   zrodla: [{segment: S01-p144-s02, cytat: "wielma praw, co w sercu to na języku, król J. M. Au-gust słał mu kasztelanije Rozpierską ale podzięko-wał—plenus dierum et meritorum abdormivit in Do-mino"}], pewnosc_odczytu: pewna}
- {id: S01-090, podmiot: radoszewski-mikolaj-1574, relacja: pochowek, miejsce: radoszewice, wartosc: "pochowany w Radoszewicach z epitafium",
   zrodla: [{segment: S01-p144-s02, cytat: "pogrzebion w Radoszewicach z epitaphium"}], pewnosc_odczytu: pewna}
- {id: S01-091, podmiot: radoszewski-mikolaj-1574, relacja: malzonek, obiekt: konopnicka-zofia, wartosc: "trzech synów; „nieboszczka J. M. p. Zofia Konopnicka, sędzianka z Kroczowa”",
   zrodla: [{segment: S01-p144-s02, cytat: "sy-nów ostawił trzech z nieboszkiéj J. M. p. Zofiej Kono-pnickiéj Sędzianki z Kroczowa."}], pewnosc_odczytu: pewna, uwagi: "S07 podaje jako żonę Mikołaja (+1574) Kurzepnicką[?] — zob. osoba kurzepnicka."}

