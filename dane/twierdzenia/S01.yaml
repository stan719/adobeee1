- {id: S01-015, podmiot: okszyc-stogniew-ii, relacja: urzad, wartosc: "kasztelan rozpierski, hetman przeciw Rusi, Ślązakom i Mazurom; trzymał Siemkowce z Dylowem, Ożegowem i innymi (6 wsi); Kazimierz Sprawiedliwy dał mu Konopnicę u Widawy z 5 wsiami (dawne „comitas” odjęte Porajom za bunty); bezżenny, majątki przeszły na synowców",
   zrodla: [{segment: S01-p134-s05, cytat: "1) Comes Stogneus II, mąż wielki i rycerski, Ka-sztelan Rozpierski a Hetman przeciwko Rusi, Śląza-kom i Mazurom, trzymał Siemkowce z Dylowem, Oże-gowem i innemi, razem wsi sześć, król zasie Kazi-mierz Justus dał mu Konopnicę u Widawy z wsi pię-"}, {segment: S01-p135-s01, cytat: "ciu na własność, a to była Comitas, odjęta Porajom za bunty—celebes—majętności poszły na synowce."}], pewnosc_odczytu: pewna}
