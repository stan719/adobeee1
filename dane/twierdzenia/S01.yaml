- {id: S01-013, podmiot: okszyc-raciborz, relacja: opis, wartosc: "trzymał Siemkowce z 11 wsiami, ale je oddał i wrócił do Czech, gdzie hetmanił i był wielkim mężem; od królów czeskich dostał duże nadania; od niego „Panowie Werszowce i inne domy w Państwach Czeskich”",
   zrodla: [{segment: S01-p134-s03, cytat: "trzymał Siemkowce z jedena-stu wsiami, ale puścił a powrócił na Czechy, gdzie hetmanił i mężem był wielkim w wielgoradzie"}, {segment: S01-p134-s03, cytat: "„Panowie Werszowce i inne domy w Państwach Czeskich rozrodzone i znaczne”"}, {segment: S01-p134-f3, cytat: "Wyrazy cudzosłowem oznaczone znajdują się w osob-nem kółku w pokoleniu III."}], pewnosc_odczytu: pewna}

