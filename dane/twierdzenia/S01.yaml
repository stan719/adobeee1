- {id: S01-010, podmiot: okszyc-stogniew-i, relacja: wlasnosc, obiekt: radoszewice, wartosc: "dostał Radoszewice, Lipnik, Dylów, Ożegów, Raduczyce i inne (razem 9 wsi), po bracie Raciborze Siemkowce; książę Mieszko Stary nadał mu Gromadzice (przywilej zaginiony); włodarz krzepicki i wójt brzeźnicki; zostawił dwóch synów i trzy córki — jedna za Duninem Grabią ze Skrzynna",
   zrodla: [{segment: S01-p134-s02, cytat: "dostał Radoszewice, Lipnik, Dylow, Ożegow, Raduczyce i inne, razem wsi dzie-więć, a po bracie Raciborzu trzymał Siemkowce"}, {segment: S01-p134-s02, cytat: "Xiąże Mieszko stary puścił mu Gromadzice z innemi"}, {segment: S01-p134-s02, cytat: "Włodarzem był Krzepickim a Wójtem Brzezni-ckim"}, {segment: S01-p134-s02, cytat: "zostawił synów dwóch i trzy dziewki, jedna za Panem Duninem Gra-bią z Skrzynna, drugie niewiadomo"}], pewnosc_odczytu: pewna}
- {id: S01-011, podmiot: okszyc-raciborz, relacja: rodzic, obiekt: wrszowiec-jan,
