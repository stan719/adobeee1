   uwagi: "Data niezgodna z panowaniem Bolesława Wstydliwego i Leszka Czarnego (1243–1288) — zob. dane/watpliwosci.md."}
- {id: S01-031, podmiot: okszyc-stogniew-iv-boxa, relacja: opis, wartosc: "imię Bogusław zmieniano na Bogusz, stąd Boksza (Boxa); chrzestne imię wojewody Bogusław, słowiańskie Stogniew; jego zmienione imię Boksza potomkowie przyjęli jako przydomek ze względu na jego znaczenie",
   zrodla: [{segment: S01-p136-f5, cytat: "Imie Bogusław zmieniano na Bogusz, z czego utworzyła się Boksza"}, {segment: S01-p136-f5, cytat: "Imie Bogusław było chrzestnem wojewody, słowiańskie miał Stogniew—jego zmienione imie Boksza - dla wielkiego znaczenia jakie posiadał, wzięli jego potomkowie za przydomek."}], pewnosc_odczytu: pewna, uwagi: "Przypis Kosińskiego."}

# --- pokolenie VI (synowie Wojewody Boxy)
- {id: S01-032, podmiot: okszyc-dzierzslaw-i, relacja: rodzic, obiekt: okszyc-stogniew-iv-boxa,
   zrodla: [{segment: S01-p137-s02, cytat: "POKOLENIE VI. (Synowie Wojewody Boxy)."}, {segment: S01-p137-f6, cytat: "To potomstwo zb. pokolenie VI."}, {segment: S01-p137-s03, cytat: "1) Comes Derslaus vul. Derzko"}], pewnosc_odczytu: pewna}
- {id: S01-033, podmiot: okszyc-dzierzslaw-i, relacja: opis, wartosc: "trzymał majątki śląskie, Kłomnice i Zdrowe; spór z książętami opolskimi o Mielnice — stracił połowę na skarb; od niego biskup Nankier oraz Kłomniccy, Zdroscy, Jałoscy i inni na Śląsku i u Radomska",
   zrodla: [{segment: S01-p137-s03, cytat: "ten trzymał wszy-stkie majętności Slązkie a też Kłomnice i Zdrowe z folwarki, sporzył się z Xiążęty Opolskiemi o Miel-nice i stradał połowicę na skarb—od niego poszedł ów świątobliwy Biskup Nankierus"}, {segment: S01-p137-s03, cytat: "od którego panowie Kłomniccy, Zdroscy, Ja-łoscy i drudzy na Slązku i u Radomska."}], pewnosc_odczytu: pewna}
- {id: S01-034, podmiot: nankier-biskup, relacja: opis, wartosc: "„świątobliwy biskup Nankierus”, który wiele znosił dla Kościoła; wg drzewa potomek Dzierżka",
   zrodla: [{segment: S01-p137-s03, cytat: "ów świątobliwy Biskup Nankierus, o którym w kronikach znajdziesz jak wiele dla kościoła znosił"}], pewnosc_odczytu: pewna}
- {id: S01-035, podmiot: okszyc-pawel-pasko, relacja: rodzic, obiekt: okszyc-stogniew-iv-boxa,
   zrodla: [{segment: S01-p137-s04, cytat: "2) Paulus vul. Pasko, ten dostał Dziewiantle i in-ne, ale braciom zdał i skoro potem umarł, celeb."}], pewnosc_odczytu: pewna,
   uwagi: "Dostał Dziewiantle, oddał braciom, wkrótce zmarł bezżenny."}
- {id: S01-036, podmiot: okszyc-stogniew-v, relacja: rodzic, obiekt: okszyc-stogniew-iv-boxa,
   zrodla: [{segment: S01-p137-s05, cytat: "3) Comes Stogneus V, Boxic dictus"}], pewnosc_odczytu: pewna}
- {id: S01-037, podmiot: okszyc-stogniew-v, relacja: wlasnosc, obiekt: radoszewice, wartosc: "dostał Radoszewice, Siemkowce, Grabowę z Błesznem, Ożegów, Konopnicę i inne (19 wsi); walczył z Krzyżakami, bywał na zjazdach, sędzia lelowski; Łokietek nadał mu Wąsosze, młyny, przewóz na Warcie i łowy w Łobodnie u Kłobucka; „srogi wielce”, ale sprawiedliwy; trzech synów, cztery córki",
   zrodla: [{segment: S01-p137-s05, cytat: "dostał Rado-szewice, Siemkowce, Grabowę z Błesznem, Ożegow, Konopnice a też i inne, razem wsi dziewietnaście, mąż znaczny, rycersko przeciw Krzyżaki stawał i na zjaz-dach siadywał, Sędzią Lelowskim był, król Łokietek puścił mu Wąsosze i młyny a też przewóz na War-cie i łowy w Łobodnie u Kłobucka, srogi wielce, ni-komu niefolgował, ale niesprawiedliwości nie czynił, zostawił synów trzech, córki cztery."}], pewnosc_odczytu: pewna}
- {id: S01-038, podmiot: okszyc-mikolaj-ii-wontrubka, relacja: rodzic, obiekt: okszyc-stogniew-iv-boxa,
   zrodla: [{segment: S01-p138-s01, cytat: "4) Comes Nicolaus II, dictus Wontrubka dla licy czerwonych"}], pewnosc_odczytu: pewna}
- {id: S01-039, podmiot: okszyc-mikolaj-ii-wontrubka, relacja: urzad, wartosc: "przydomek Wontrubka „dla lic czerwonych”; trzymał Strzelce, Lipnik, Broszencin, Grabowe u Widawy i Gromadzice (ponad 20 wsi); pisał się ze Strzelec; cześnik, potem sędzia sieradzki; w łaskach u Kazimierza Wielkiego; ufundował kościoły w Strzelcach i Szumsku",
   zrodla: [{segment: S01-p138-s01, cytat: "trzymał Strzelce, Lipnik, Broszencin, Gra-bowe co u Widawy i inne w Sieradzkiéj, a Groma-dzice z drugiemi w Krakoskiéj ziemi, razem wsi więcéj dwudziestu—z Strzelec pisał się gdzie zamieszkiwał— Cześnik Sieradzki a potem Sędzia, na zjazdy jeździł, i był w wielkim zachowaniu u króla Kazimierza, fundował kościół w Strzelcach i drugi w Szumsku, oba nadał gruntami, a quo."}], pewnosc_odczytu: pewna}
- {id: S01-040, podmiot: okszyc-mikolaj-ii-wontrubka, relacja: opis, wartosc: "od niego Strzeleccy (biskupi, senatorowie, starostowie; m.in. Jan, arcybiskup lwowski), teraz zubożali w Strzelcach i Zalitem; także Gosławscy zwani Bączkami (w odróżnieniu od Gosławskich Nałęczów „Kiełbasów”) i inni w Małopolsce i na Rusi",
   zrodla: [{segment: S01-p138-s02, cytat: "„Panowie Strzeleccy dom znaczny mieli Biskupy, Senatory i Starosty, z nich był też ów świątobliwéj pamięci Jan Arcybiskup Lwowski"}, {segment: S01-p138-s02, cytat: "zmaleli teraz dziedziczą w Strzelcach i Zalitem, reszta poszła — a też panowie Gosłascy co ich zowią Bączkami, bo Gosłascy Nałęczanie są Kiełbasy—drudzy też w Małéj Polsce i na Rusi, o których niewiem“"}, {segment: S01-p138-f6, cytat: "Wyrazy cudzosłowem zamknięte znajdują się w osobnem kółku pod 6-tem pokoleniem."}], pewnosc_odczytu: pewna}
- {id: S01-041, podmiot: strzelecki-jan-arcybiskup, relacja: urzad, wartosc: "arcybiskup lwowski za króla Kazimierza; „świątobliwej pamięci”",
   zrodla: [{segment: S01-p138-s02, cytat: "Jan Arcybiskup Lwowski, o którym w kro-nikach za króla J. M. Kazimierza"}], pewnosc_odczytu: pewna}
- {id: S01-042, podmiot: okszyc-jan-iv-ryj, relacja: rodzic, obiekt: okszyc-stogniew-iv-boxa,
   zrodla: [{segment: S01-p138-s03, cytat: "5) Comes Joannes IV, dictus Ryj, dla odętéj war-gi"}], pewnosc_odczytu: pewna}
- {id: S01-043, podmiot: okszyc-jan-iv-ryj, relacja: urzad, wartosc: "przydomek Ryj „dla odętej wargi”; dostał Szumsko i dobra u Krakowa i na Rusi u Przemyśla (16 wsi); bardzo zaradny, biegły w medycynie „że nad doktory stał”; służył Łokietkowi, u Kazimierza stolnik; dostał królewszczyzny nad Sanem",
   zrodla: [{segment: S01-p138-s03, cytat: "dostał Szumsko i inne imiona u Krakowa i na Rusi u Przemyśla, wsi razem szesnaście, wielkiéj in-dustrji i w lekach biegły, że nad doktory stał—kró-lowi Łokietkowi służył a u króla Kazimierza był Stolnikiem i w wielkich łaskach, duże też królew-szczyzny u Sanu dostał, syny miał i córki, a quo."}], pewnosc_odczytu: pewna}
- {id: S01-044, podmiot: okszyc-jan-iv-ryj, relacja: opis, wartosc: "od niego Rejowie w Małopolsce i na Rusi (m.in. Mikołaj, „poeta wielki”, ale heretyk), Orzechowscy u Przemyśla (m.in. Stanisław, kanonik, który się ożenił), Czechowscy — „właśni Rejowie”, piszą się z Nagłowic",
   zrodla: [{segment: S01-p138-s04, cytat: "Panowie Rejowie w Małéj Polsce i na Rusi dom możny, z niego był pan Mikołaj poeta wielki, ksiąg mnogo zostawił, ale herezją zarażon, jako i panowie"}, {segment: S01-p139-s01, cytat: "Orzechoscy u Przemyśla, dom znaczny jednego z pp. Rejami pochodzenia a tak od wsi nazwani—z nich ów pan Stanisław, co kanonik żonę pojął, o co było dużo burd za króla Augusta—Panowie Czechoscy też są właśni Rejowie i z Nagłowice piszą się."}], pewnosc_odczytu: pewna}
- {id: S01-045, podmiot: rej-mikolaj-poeta, relacja: opis, wartosc: "„poeta wielki, ksiąg mnogo zostawił, ale herezją zarażon”; wg drzewa z potomków Jana IV „Ryja”",
   zrodla: [{segment: S01-p138-s04, cytat: "z niego był pan Mikołaj poeta wielki, ksiąg mnogo zostawił, ale herezją zarażon"}], pewnosc_odczytu: pewna}
- {id: S01-046, podmiot: orzechowski-stanislaw, relacja: opis, wartosc: "kanonik, który pojął żonę, „o co było dużo burd za króla Augusta”",
   zrodla: [{segment: S01-p139-s01, cytat: "ów pan Stanisław, co kanonik żonę pojął, o co było dużo burd za króla Augusta"}], pewnosc_odczytu: pewna}

# --- pokolenie VII (synowie Stogniewa V)
- {id: S01-047, podmiot: okszyc-jan-v, relacja: rodzic, obiekt: okszyc-stogniew-v,
   zrodla: [{segment: S01-p139-s02, cytat: "POKOLENIE VII. (Synowie Stogniewa V)."}, {segment: S01-p139-s03, cytat: "1) Joannes V"}], pewnosc_odczytu: pewna}
- {id: S01-048, podmiot: okszyc-jan-v, relacja: opis, wartosc: "wziął Raduczyce z Wrocicami, pisał się z Raduczyc; służył na dworze; hulaka — połowę majątku roztrwonił, resztę zadłużył; bezdzietny",
   zrodla: [{segment: S01-p139-s03, cytat: "wziął Raduczyce z Wrocicami i inne, pisał się z Raduczyc, służył na dworze, do kości a po-dwik skory, więcéj połowy mienia strwonił a drugą zadłużył, że mało zostało."}, {segment: S01-p139-s03, cytat: "dzieci niemiał."}], pewnosc_odczytu: pewna}
- {id: S01-049, podmiot: okszyc-jan-v, relacja: malzonek, obiekt: kozieglowska-zona-jana-v, wartosc: "„białogłowa cudna, ale z nią nie żył”; potem mniszka w Imbramowicach",
   zrodla: [{segment: S01-p139-s03, cytat: "Żonę miał z domu Kozie-głowskich białogłowę cudną, ale z nią nie żył, potem mniszką była w Imbramowicach"}], pewnosc_odczytu: pewna}
- {id: S01-050, podmiot: kozieglowska-zona-jana-v, relacja: zamieszkanie, miejsce: imbramowice, wartosc: "mniszka w Imbramowicach",
