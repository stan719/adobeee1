- {id: S01-061, podmiot: okszyc-stogniew-vii, relacja: opis, wartosc: "trzymał Broszencin z Lipnikiem, pół Dylowa i Niwiska, Gajęcice z Makowiskami; „takiej był siły, że podkowy łamał a wozy w biegu hamował”",
   zrodla: [{segment: S01-p141-s02, cytat: "trzymał Broszencin z Lipnikiem a też połowę Dylowa i Niwiska, Gajęcice też z Ma-kowiskami, mąż do wojny niby stworzon, takiéj był siły że podkowy łamał a wozy w biegu hamował"}], pewnosc_odczytu: pewna}
- {id: S01-062, podmiot: okszyc-stogniew-vii, relacja: smierc, miejsce: warna, wartosc: "za króla Władysława wyprawił się z 10 ludźmi na Węgry, poległ pod Warną", data: {tekst: "pod Warną", od: 1444, do: 1444},
   zrodla: [{segment: S01-p141-s02, cytat: "a za króla Ładysława w dziesięć ludzi wyprawił się na Węgry, tam w wielu potrzebach stawał, aż z innemi dał gardło pod Warną."}], pewnosc_odczytu: pewna, uwagi: "Rok 1444 — data bitwy, nie podana w źródle."}
- {id: S01-063, podmiot: okszyc-stogniew-vii, relacja: malzonek, obiekt: wierusz-zona-stogniewa-vii, wartosc: "żona z domu Wieruszów z Kowal; trzy córki: za panem Zborowskim spod Wielunia, za panem Raczyńskim, trzecia mniszka w Krakowie; przez nie stracono Lipnik i inne dobra (długie spory); Makowiska z Gajęcicami wziął król Zygmunt Stary, spłaciwszy sumy",
   zrodla: [{segment: S01-p141-s03, cytat: "Żonę miał z domu Wieruszów co z Kowal, z niéj trzy córek jedna za panem Zboroskim od Wie-lunia, druga za panem Raczyńskim z tamtéj też zie-mi, trzecia mniszka w Krakowie, przez nie stracon Lipnik i drugie imiona, o co były długie spory, Ma-kowiska też z Gajęcicami król J. M. Stary wziął, spłaciwszy summy."}, {segment: S01-p141-f9, cytat: "To w osobnem kółku pod 9-tem pokoleniem."}], pewnosc_odczytu: pewna}
