- {id: S01-028, podmiot: okszyc-stogniew-iv-boxa, relacja: urzad, wartosc: "kasztelan spicymirski, potem sandomierski, wreszcie wojewoda sandomierski; pierwszy w radzie u Bolesława Wstydliwego i Leszka Czarnego; hetman przeciw Rusi, Jaćwingom, Tatarom, Ślązakom i rokoszanom",
   zrodla: [{segment: S01-p136-s04, cytat: "Comes Stogneus IV, seu Boguslaus—vul. Boxa5)— naprzód Spicimirski potem Sendomierski Kasztelan, aż też Sendomierski Wojewoda, mąż pierwszy w ra-dzie, u królów Pudyka i Leszka, co go zwano Czarnym, w wielkich faworach i Hetman fortunny przeciw Rusi, Jadzwingom, Tatarom, Ślązakom i rokosza-nom"}], pewnosc_odczytu: pewna}
- {id: S01-029, podmiot: okszyc-stogniew-iv-boxa, relacja: wlasnosc, obiekt: siemkowice, wartosc: "nadania w ziemi sandomierskiej i krakowskiej; dokupił Błeszno z Grabową u Częstochowy, Wysokie z Mijaczowem u Lelowa, Jałowę, Kochanowice na Śląsku; od księcia Bolka Mielnice; trzymał Zawichost i Krzepice; ponad 100 wsi; ufundował zamek w Siemkowcach, dworce w Konopnicy, Szumsku, Dziewiantłach; wzniósł 5 kościołów",
   zrodla: [{segment: S01-p136-s04, cytat: "skupił też dużo dru-gich jako: Błeszno z Grabową i innemi u Częstocho-wy, Wysokie z Mijaczowem u Lelowa, Jałowę, Kocha-nowice i inne na Ślązku, a od Xięcia Bolka dostał"}, {segment: S01-p137-s01, cytat: "Mielnice, jako przywiléj jest — Zawichost i Krzepice trzymał, nad sto wsi miał, Zamek w Siemkowcach fundował i dworce w Konopnicy, Szumsku, Dziewian-tłach i inne, pięć kościołów erigował"}], pewnosc_odczytu: pewna}
