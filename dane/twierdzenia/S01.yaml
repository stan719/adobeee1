   zrodla: [{segment: S01-p139-s04, cytat: "2) Nicolaus III dictus Boxic"}], pewnosc_odczytu: pewna}
- {id: S01-052, podmiot: okszyc-mikolaj-iii-boxic, relacja: wlasnosc, obiekt: radoszewice, wartosc: "po ojcu wziął Radoszewice z folwarkami, Siemkowce, Lipnik i inne u Wielunia i Pajęczna (gdzie był wójtem — zrezygnował); wziął wójtostwo brzeźnickie; kasztelanię rozpierską dostał, ale ją cofnięto; pomnożył majątek: odkupił od brata Jana Raduczyce, wziął w zastaw Makowiska z Niwiskami, Gajęcicami i Dubiczem",
   zrodla: [{segment: S01-p139-s04, cytat: "po ojcu wziął Rado-szewice z folwarki, Siemkowce, Lipnik i inne u Wie-lunia i Pajęczna, gdzie Wójtem był, ale spuścił a wziął Brzeznickie, Kasztelanją Rozpierską też do-stał, ale cofnięto dla inwidijej różnych, mąż stateczny, mienia przymnożył, skupił od brata Jana Raduczyce a też Makowiska z Niwiskami, Gajęcicami i Dubiczem za konsensem, jako zastawę"}], pewnosc_odczytu: pewna}
- {id: S01-053, podmiot: okszyc-mikolaj-iii-boxic, relacja: pochowek, miejsce: pajeczno, wartosc: "pochowany w Pajęcznie; żył ponad 80 lat (odręczny dopisek czytelnika: „85 lat”)",
   zrodla: [{segment: S01-p139-s04, cytat: "w Pajęcznie pogrzeban żywszy lat więcéj osiemdzie-sięciu, a quo7)."}, {segment: S01-p139-d1, cytat: "85 lat"}, {segment: S01-p139-f7, cytat: "Jego potomstwo pod pokoleniem VIII."}], pewnosc_odczytu: pewna}
- {id: S01-054, podmiot: okszyc-stogniew-vi, relacja: rodzic, obiekt: okszyc-stogniew-v,
   zrodla: [{segment: S01-p139-s05, cytat: "3) Stogneus VI"}], pewnosc_odczytu: pewna}
- {id: S01-055, podmiot: okszyc-stogniew-vi, relacja: wlasnosc, obiekt: konopnica-widawa, wartosc: "dostał Konopnicę u Widawy, Grabowę u Częstochowy i Wysokie u Lelowa, dokupił Zdrowę; bywał na zjazdach, ale urzędu nie przyjął; hojny dla klasztoru jasnogórskiego i kościoła św. Zygmunta w starej Częstochowie; dziesięcioro dzieci z dwóch żon (po pięcioro)",
   zrodla: [{segment: S01-p139-s05, cytat: "dostał Konopnicę u Widawy, Gra-bowę u Częstochowy i Wysokie u Lelowa, wszystkie z folwarki, Zdrowę też skupił—mąż znaczny, na zjaz-dy stawał, ale urzędu nie brał, na klasztor Jasnogór-"}, {segment: S01-p140-s01, cytat: "ski hojny, dużo gruntów dał a też i kościołowi Sti Sigismundi w staréj Częstochowie wiele świadczył — zostawił dziesięcioro dzieci z dwóch żon, z każdéj po pięcioro a quo."}], pewnosc_odczytu: pewna}
- {id: S01-056, podmiot: okszyc-stogniew-vi, relacja: opis, wartosc: "od niego Konopniccy (piszący się z Konopnicy; inni od Kroczowa to inny dom, herbu Jastrzębiec), Grabowscy na Grabowie, a od nich Strońscy i Bogusławscy u Wielunia (odstąpili od wiary katolickiej), oraz Grabowscy u Łęczycy i na Litwie",
   zrodla: [{segment: S01-p140-s02, cytat: "„Panowie Konopniccy, którzy piszą się z Konopni-ce, bo drudzy z Kroczowa, a to dom inny de stem. Accipitrum—Panowie też Graboscy na Grabowie mę-że znaczni, poszli od nich panowie Strońscy i Bogu-sławscy u Wielunia od wsi nazwani"}, {segment: S01-p140-s02, cytat: "ale od Ś-téj katolickiéj wiary odstrychnięci, jako i panowie Graboscy u Łęczycy i na Litwie, dom jedenże co Konopniccy, mężowie rycerscy i dostatni, piszą się jak tamci z Konopnice”8)."}, {segment: S01-p140-f8, cytat: "Wyrazy między cudzosłowami są w osobnem kółku pod pokoleniem VIII."}], pewnosc_odczytu: pewna}
- {id: S01-057, podmiot: okszyc-dzierzslaw-ii-siekierka, relacja: rodzic, obiekt: okszyc-stogniew-v,
   zrodla: [{segment: S01-p140-s03, cytat: "4) Derslaus II zwany Siekierka od Klejnotu"}], pewnosc_odczytu: pewna}
- {id: S01-058, podmiot: okszyc-dzierzslaw-ii-siekierka, relacja: wlasnosc, obiekt: bleszno, wartosc: "zwany Siekierka od klejnotu; wziął Błeszno z sześcioma wsiami u Częstochowy, dokupił Rędziny i pół Grabowy u Lelowa; król Ludwik dał mu wójtostwo w Olsztynie i folwark u Częstochowy; „gładysz duży, królowej Helzbiecie nie był krzyw”",
   zrodla: [{segment: S01-p140-s03, cytat: "wziął Błeszno z sześciu innemi u Częstochowy, a skupił Rę-dziny i połowę Grabowy téj co u Lelowa—król Lud-wik dał mu Wójtowstwo w Olsztynie i folwark u Czę-stochowy, różnie o tem mówili — dworsko i rycersko sługiwał, gładysz duży, królowéj Helzbiecie nie był krzyw, a quo."}], pewnosc_odczytu: pewna}
- {id: S01-059, podmiot: okszyc-dzierzslaw-ii-siekierka, relacja: opis, wartosc: "od niego Błeszyńscy (na Błesznie, u Częstochowy, Kalisza i na Śląsku — część zwie się Okszycami po klejnocie; jeden był rotmistrzem u pana Rosenberga w bezkrólewiu po Auguście) i Niedźwieccy u Żarek",
   zrodla: [{segment: S01-p140-s04, cytat: "Panowie Błeszyńscy co na Błesznie i innych ma-jętnościach u Częstochowy a Kalisza, panowie też Nie-dzwieccy u Żarek i indziéj i inni panowie Błeszyńscy co na Slązku, z tych drudzy zwą się Okszyce po klejnocie, jeden z nich był Rotmistrzem u pana Ro-senberga w bezkrólewiu po królu Auguście, kiedy posłował w Polsce."}], pewnosc_odczytu: pewna}

# --- pokolenie VIII (synowie Mikołaja III)
