- {id: S01-017, podmiot: okszyc-jan-ii, relacja: wlasnosc, obiekt: radoszewice, wartosc: "trzymał Radoszewice ze Stróżą, Broszencinem, Lipnikiem i innymi; kasztelan spicymirski i wójt brzeźnicki; od księcia Leszka dostał Mierzyce dożywotnio (przywilej 1212); w potrzebach wojennych zawsze fortunny", data: {tekst: "a. d. MCCXII", od: 1212, do: 1212},
   zrodla: [{segment: S01-p135-s02, cytat: "trzymał Radoszewice z Stró-żą, Broszencinem, Lipnikiem i innemi, Spicimirski Ka-sztelan a Wójt Brzeznicki, od Xięcia Leszka dostał Mierzyce na dożywocie jako przywilej a. d. MCCXII, w różnych potrzebach był zawsze fortunnie, a quo 4)."}, {segment: S01-p135-f4, cytat: "Zb. pokolenie czwarte."}], pewnosc_odczytu: pewna,
