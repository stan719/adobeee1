- {id: S01-065, podmiot: radoszewski-imbram-1412, relacja: wlasnosc, obiekt: radoszewice, wartosc: "dostał Siemkowce z folwarkami i Radoszewice z połową Czernic; po żonie część Osjakowa; skupił części Ożegowa; „pan rządny i wielki myśliwy” — król dał mu folwark od Krzepic, by doglądał bobrów; trzech synów i córki (jedna za panem Tarnowskim z Rolicz u Sieradza)",
   zrodla: [{segment: S01-p141-s04, cytat: "dostał Siemkowce z fol-warki i Radoszewice z połową Czernic a po żonie Jejmość Pani Jachnie z Ossiakowa z domu Larysów, dostał część na Ossiakowie, skupił też sortes na Ożego-wie — pan rządny i wielki myśliwy, całe dnie gonił w lasach i na zwierzach znał się, że król J. M. dał mu folwark od Krzepic aby bobry opatrywał, synów trzech i córki miał, jedna za panem Tarnoskim z tych co Rolicze u Sieradza."}], pewnosc_odczytu: pewna}
