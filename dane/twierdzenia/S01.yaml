- {id: S01-021, podmiot: okszyc-jan-iii, relacja: opis, wartosc: "oddał bratu Stogniewowi Siemkowce z Dylowem, a bratu Mikołajowi Ożegów z folwarkami; poszedł na wojnę i zginął na Rusi od Tatarów, bezżenny",
   zrodla: [{segment: S01-p135-s05, cytat: "ten zdał bratu Stogniewowi Siemkowce z Dylowem a bratu Mikołajowi Ożegow z folwarki, jako dokumenta, na wojnę poszedł i prze-padł na Rusi od Tatar—celeb."}], pewnosc_odczytu: pewna}
- {id: S01-022, podmiot: okszyc-mikolaj-i, relacja: rodzic, obiekt: okszyc-jan-ii,
   zrodla: [{segment: S01-p135-s06, cytat: "3) Comes Nicolaus I"}], pewnosc_odczytu: pewna}
- {id: S01-023, podmiot: okszyc-mikolaj-i, relacja: wlasnosc, obiekt: radoszewice, wartosc: "trzymał Radoszewice z Raduczycami i inne, po bracie Janie Ożegów; człowiek bardzo ludzki, wiele majątku stracił; sędzia rudzki i wójt pajęczański, ale zrezygnował; dobudował wieżę do kościoła w Radoszewicach (upadła za króla Aleksandra); w Raduczycach postawił dworzec (później lamus) i otoczył fosą",
   zrodla: [{segment: S01-p135-s06, cytat: "trzymał Radoszewice z Ra-duczycami i inne, a Ożegow po bracie Janie, wszy-stkie z folwarki, człek wielma ludzki, dużo dostatku uronił, Sędzią Rudzkim był a też i Wójtem Pajęczyń-skim, ale zdał dla inwidiéj różnych — do kościoła w Radoszewicach przystawił wieże, ta upadła za kró-"}, {segment: S01-p136-s01, cytat: "la Aleksandra; w Raduczycach dworzec postawił, gdzie ninie lamus i fossą obwiódł, a quo 4)."}, {segment: S01-p136-f4, cytat: "Jego potomstwo wymienione w pokoleniu V."}], pewnosc_odczytu: pewna}
- {id: S01-024, podmiot: radoszewice-kosciol, relacja: opis, wartosc: "Mikołaj I (pok. IV drzewa) dobudował wieżę do kościoła w Radoszewicach; upadła za króla Aleksandra",
