# Twierdzenia ze źródła S01 (A. A. Kosiński, Przewodnik heraldyczny t. V, Warszawa 1885, s. 132–145:
# drzewo genealogiczne Boxów-Radoszewskich z pocz. XVII w., przytoczone „prawie dosłownie”).
# Kosiński zastrzega, że pokolenia aż do Wojewody Boxy „mogą ulegać wątpliwości” (S01-001) — dotyczy to S01-005…S01-030.
# Relacja „rodzic” wynika z układu drzewa (pokolenie + nagłówek „Synowie …”).

# --- wstęp Kosińskiego
- {id: S01-001, podmiot: radoszewice, relacja: opis, wartosc: "Kosiński otrzymał dawne drzewo genealogiczne Radoszewskich herbu Oksza, z pierwszych lat XVII w.; przytacza je prawie dosłownie. Pierwsze pokolenia (do Wojewody Boxy) mogą budzić wątpliwości, dalsze uznaje za wiarygodne (oparte na zaginionych dokumentach), a od początku XV w. za pewne — sprawdził je z aktami grodzkimi i ziemskimi sieradzkimi i wieluńskimi",
   zrodla: [{segment: S01-p132-s03, cytat: "otrzymałem dawne, bo niezaprzeczenie z pier-wszych lat XVII-go wieku pochodzące drzewo gene-alogiczne rodziny Radoszewskich herbu Oksza"}, {segment: S01-p132-s03, cytat: "jeżeli pierwsze poko lenia t. j. aż do Wojewody Boxy, mogą alegać wątpli-wości"}, {segment: S01-p132-s03, cytat: "że zaś począwszy od pierwszych lat XV stó-lecia są one niezaprzeczenie pewnemi, przeświadczy-łem się porównywając je z aktami Grodzkiemi i Ziem-skiemi, Sieradzkiemi i Wieluńskiemi."}], pewnosc_odczytu: pewna}
- {id: S01-002, podmiot: radoszewice, relacja: opis, wartosc: "drzewo ułożone „w kółkach”; Kosiński podzielił je na pokolenia. Tytuł drzewa: „Tabulla Genealogica wielce zacnego i wiele możnego domu Panów Boxów z Siemkowic na Radoszewicach, Brzoszencinie, Stróży etc. Radoszeskich, z kronik, przywilejów, tranzakcyj, zapisów kościelnych i klasztornych i innych też mnogich dokumentów zebrana…”",
   zrodla: [{segment: S01-p132-s04, cytat: "Ponieważ wspomnione drzewo ułożone jest na zwykły sposób, to jest w kółkach"}, {segment: S01-p133-s01, cytat: "podzieliłem je na pokolenia — tytuł drzewa znajduje się u jego spodu w wyrazach:"}, {segment: S01-p133-s02, cytat: "Tabulla Genealogica wielce zacnego i wiele moż-nego domu Panów Boxów z Siemkowic na Rado-szewicach, Brzoszencinie, Stróży etc. etc. Radoszeskich, z kronik, przywilejów, tranzakcyj, zapisów kościelnych i klasztornych i innych też mnogich dokumentów ze-brana"}], pewnosc_odczytu: pewna}
- {id: S01-003, podmiot: grabowski-zm-1831, relacja: opis, wartosc: "koniec hasła GRABOWSKI (początek na niesfotografowanej s. 131): po rozbiorze usunął się od spraw publicznych, w 1812 r. znaczną ofiarą wsparł formację armii krajowej; zm. 1831; żona Weronika Scipio del Campo, córka Józefa, starosty lidzkiego, i Weroniki, ostatniej z rodu Firlejów; dzieci: Karolina (1° v. Andrzej hr. Wielopolski, 2° v. baron Larisch), Ludwika († 1873, ż. Adama hr. Broel-Platera), Józef, kapitan wojsk polskich, nieżonaty", data: {tekst: "umarł w 1831 r.", od: 1831, do: 1831},
   zrodla: [{segment: S01-p132-s01, cytat: "co go jednak nie powstrzymało, aby w 1812 r. zna-czną ofiarą niepoparł formacyi armii krajowéj; umarł w 1831 r.—z żony Weroniki Scipio del Campo, córki Józefa Starosty Lidzkiego i Weroniki ostatniéj z zna-komitego domu Firlejów"}, {segment: S01-p132-s01, cytat: "Karolina 1-voto za Andrzejem hr. Wielopolskim, 2-voto za baronem La-risch'em i Ludwika † 1873 r. zaśl. Adamowi hr. Broel-Platerowi—i syn"}, {segment: S01-p132-s02, cytat: "Józef Kapitan wojsk polskich, nieżonaty."}], pewnosc_odczytu: pewna,
   uwagi: "Hasło o Grabowskich (Okszyce — Kosiński łączy je z drzewem Radoszewskich), nie o Radoszewskich. „niepoparł” — tak w druku (sens: „wsparł”)."}
- {id: S01-004, podmiot: grabowski-zm-1831, relacja: malzonek, obiekt: scipio-del-campo-weronika,
   zrodla: [{segment: S01-p132-s01, cytat: "z żony Weroniki Scipio del Campo"}], pewnosc_odczytu: pewna}

# --- pokolenie I
- {id: S01-005, podmiot: wrszowiec-jan, relacja: opis, wartosc: "Comes Joannes I seu Stogneus: „satrapa czeski” z wielkiego domu Grabiów Werszowców, prześladowany przez swych panów, przesiedlił się do Polski; od Krzywoustego dostał 30 wsi w ziemiach sieradzkiej i wieluńskiej (Siemkowce, Radoszewice, Wrocice, Popów, Broszencin, Stróże, Lipnik, Dylów i inne); słowiańskie imię Stogniew nosili potem jego potomkowie aż po XVII w.",
   zrodla: [{segment: S01-p133-s03, cytat: "POKOLENIE I. Comes Joannes I seu Stogneus."}, {segment: S01-p133-s04, cytat: "Satrapa Czeski, z wielkiego domu Grabiow Wer-szowcow, prześladowany od swych Panów przesiedlił się w kraj polski i od króla Krzywoustego dostał na opatrzenie wsi trzydzieści w Ziemiach Sieradzkiéj i Wieluńskiéj, jako: Siemkowce, Radoszewice, Wroci-ce, Popow, Broszencin, Stróże, Lipnik, Dylow i inne"}, {segment: S01-p133-f1, cytat: "Ten Jan Werszowec, o którym zobacz Paprocki Her-barz Rycerstwa i kroniki Długosza, Bielskiego i inne, miał jak się z téj Genealogii wykazuje imie słowiańskie Stogniew, to imie też brali jego potomkowie aż prawie po wiek XVII"}], pewnosc_odczytu: pewna,
   uwagi: "Utożsamiony z Janem (Geskiem) Wrszowcem z S02/S10 (ta sama tradycja: Czech, nadanie od Krzywoustego, Radoszewice)."}
- {id: S01-006, podmiot: wrszowiec-jan, relacja: wlasnosc, obiekt: radoszewice, wartosc: "wśród 30 wsi nadanych przez Krzywoustego",
   zrodla: [{segment: S01-p133-s04, cytat: "Siemkowce, Radoszewice"}], pewnosc_odczytu: pewna}

