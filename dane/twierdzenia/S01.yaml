- {id: S01-078, podmiot: radoszewski-boguslaw-ii, relacja: opis, wartosc: "dostał pół Radoszewic z dworem i część Wierzchlasu; drugą część trzymał, gdy brat Mikołaj wojował na Węgrzech, po jego powrocie oddał mu całość; osiadł w Wieluniu przy klasztorze augustianów i tam zmarł bezżenny",
   zrodla: [{segment: S01-p143-s03, cytat: "dostał połowę Radoszewic z dwo-rem i część na Wierzchlejsie, a drugą część trzymał gdy brat Mikołaj wojował w Węgrzech, kiedy zasie wrócił, zdał mu całe, osiadł w Wieluniu przy klasz-torze księży Augustianów, gdzie chwalił Pana Boga i abdormivit in Domino, celebs."}], pewnosc_odczytu: pewna}
- {id: S01-079, podmiot: radoszewski-boguslaw-ii, relacja: smierc, miejsce: wielun-augustianie,
