- {id: S01-080, podmiot: radoszewski-jan-peregrynant, relacja: rodzic, obiekt: radoszewski-boguslaw-1441, wartosc: "jedyny syn z drugiej żony",
   zrodla: [{segment: S01-p143-s04, cytat: "2) Joannes, ten z drugiej żony jeden"}], pewnosc_odczytu: pewna}
- {id: S01-081, podmiot: radoszewski-jan-peregrynant, relacja: opis, wartosc: "po matce pół Prusiecka nad Wartą z dworem i młynami; ziemi po ojcu nie dostał, ale dużo pieniędzy; wielki podróżnik — był w Afryce, w Ziemi Świętej, żeglował po oceanie; przywoził i kupował księgi „na fury”, zaniedbując gospodarstwo; mówiono, że pisze kronikę; przebywał w Krakowie i gdzie indziej, zbierał stare dokumenty rodzinne; po śmierci księgi się rozproszyły — autor drzewa widział wiele z nich na Jasnej Górze i u Górków",
   zrodla: [{segment: S01-p143-s04, cytat: "po matce trzymał połowę Prusiecka co u Warty, z dworem i młyny, po rodzicu ziemi niedostał, ale pieniędzy grosz spory"}, {segment: S01-p143-s04, cytat: "pół świata zszedł, był w Afryce i w ziemi świętéj i po oceanie nawigował, ksiąg też przywiózł na fury a dużo skupował i w nich siedział o gospodarkę niestojąc"}, {segment: S01-p143-s04, cytat: "powiedano że kronikę pisze, siadywał też w Krako-wie i indziéj i stare dokumenta naszéj familijej zbie-rał, te zostały, bo księgi, gdy zmarł a nikt nie strzegł, poszły na wiatr, widziałem z nich dużo w Częstocho-wie na Jasnéj Górze a też u panów Górków."}], pewnosc_odczytu: pewna}
- {id: S01-082, podmiot: radoszewski-jan-peregrynant, relacja: wlasnosc, obiekt: prusiecko, wartosc: "połowa Prusiecka z dworem i młynami, po matce",
   zrodla: [{segment: S01-p143-s04, cytat: "po matce trzymał połowę Prusiecka co u Warty"}], pewnosc_odczytu: pewna}
- {id: S01-083, podmiot: radoszewski-marcin-podole, relacja: rodzic, obiekt: radoszewski-boguslaw-1441, wartosc: "najmłodszy",
