- {id: S01-071, podmiot: radoszewski-boguslaw-1441, relacja: wlasnosc, obiekt: radoszewice, wartosc: "wziął Radoszewice z folwarkami i od nich nazwany (Radoszewski) „jako my wszyscy”, ale pisał się z Siemkowic, skąd ród pochodzi; przydomek Boxa po ojcu i dziadach; trzymał połowę Czernic i części Wierzchlasu i Raduczyc; skromny i oszczędny; trzy żony, z każdej dzieci, przeżyło czterech synów",
   zrodla: [{segment: S01-p142-s03, cytat: "wziął Radoszewice z fol-warki i od nich nazwan, jako my wszyscy, ale pisał się z Siemkowic, że z tamtąd idziemy, a przydomek Boxa brał po rodzicu i dziadach, trzymał też połowę Czernic i sortes na Wierzchlejsie i Raduczycach, skro-mny w życiu był i szczędził, że grosz duży zebrał. Żon miał trzy, z każdéj syny i córki, ale więcy umarło drobnych, tylko czterech zostało, a quo 10)."}, {segment: S01-p142-f10, cytat: "Potomstwo pod pokoleniem X."}], pewnosc_odczytu: pewna}
- {id: S01-072, podmiot: radoszewski-stogniew-1467, relacja: rodzic, obiekt: radoszewski-imbram-1412,
   zrodla: [{segment: S01-p142-s04, cytat: "3) Stogneus junior, dictus Imbramicz, jako syn Imbrama"}], pewnosc_odczytu: pewna,
   uwagi: "Utożsamienie „Stogneus junior” (S01) ze Stogniewem z Siemkowic (S07, 1467) — prawdopodobne (obaj z Siemkowic, protoplaści Siemkowskich)."}
- {id: S01-073, podmiot: radoszewski-stogniew-1467, relacja: wlasnosc, obiekt: siemkowice, wartosc: "wziął Siemkowce z Ożegowem, Niwiskami i połową Dylowa; biegły w prawie, statuty znał na pamięć; podsędek sieradzki, potem cześnik; przeciw Krzyżakom wystawił 5 ludzi i posłał ich z synem Janem do Prus; zmarł na apopleksję; pochowany w Pajęcznie, gdzie był wójtem; dokupił wiele gruntów od Dylowa",
   zrodla: [{segment: S01-p142-s04, cytat: "ten wziął Siemkowce z Ożegowem, Niwiska-mi i połowę Dylowa — w prawie biegły, że statuta znał z pamięci, podsędkował w Sieradzu a potem Cześnikiem był, przeciw Krzyżaki pięć ludzi stawił i posłał je z synem Janem do Prus, z apoplexiéj zmarł, w Pajęcznie pogrzebion kiedy Wójtem był i dużo gruntów od Dylowa skupił—a quo."}], pewnosc_odczytu: pewna}
- {id: S01-074, podmiot: radoszewski-stogniew-1467, relacja: pochowek, miejsce: pajeczno,
   zrodla: [{segment: S01-p142-s04, cytat: "w Pajęcznie pogrzebion"}], pewnosc_odczytu: pewna}
- {id: S01-075, podmiot: siemkowski-jan-syn-stogniewa, relacja: rodzic, obiekt: radoszewski-stogniew-1467, wartosc: "wysłany z 5 ludźmi do Prus przeciw Krzyżakom",
   zrodla: [{segment: S01-p142-s04, cytat: "posłał je z synem Janem do Prus"}], pewnosc_odczytu: pewna}
- {id: S01-076, podmiot: radoszewski-stogniew-1467, relacja: opis, wartosc: "od niego Siemkowscy u Pajęczna i na Rusi — dawniej znaczni, potem zubożali (stracili Ożegów i pół Siemkowic, zostali przy drugiej połowie i Niwiskach; pięciu na małym majątku); inni wyszli na Ruś i służą u Tarnowskich; o Boguszu i Stogniewie pisze Paprocki, a za nim Niesiecki",
   zrodla: [{segment: S01-p142-s05, cytat: "„Panowie Siemkowscy u Pajęczna i na Rusi od Siemkowic jako zwyczaj nazwani — byli ludzie znaczni, teraz zmarnieli, że Ożegow stracili i połowę Siemkowic, zostali się przy drugiéj i przy Niwiskach,"}, {segment: S01-p143-s01, cytat: "bieda też, bo ich pięciu na chudobę — drudzy wyszli na Ruś służą u panów Tarnoskich — gdzie niestatek tam i niedostatek."}, {segment: S01-p142-f11, cytat: "To w osobnem kółku pod pokoleniem X. Tak o Bogu-szu jak i Stogniewie mówi Paprocki w Herbaych Rycerstwa a z niego Niesiecki."}], pewnosc_odczytu: pewna}

# --- pokolenie X (synowie Bogusława)
