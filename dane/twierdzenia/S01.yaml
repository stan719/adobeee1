- {id: S01-019, podmiot: okszyc-stogniew-iii, relacja: urzad, wartosc: "dworzanin książęcy, potem podczaszy; trzymał Konopnicę ze Stróżą; hojny na kościoły; trzech synów — dwóch zabitych pod Legnicą, jeden zmarł od zarazy; Konopnicę wziął Bolesław Wstydliwy, ale oddał wojewodzie Stogniewowi, Gaje zaś przeszły na Krzesława z Garnku, Porajczyka",
   zrodla: [{segment: S01-p135-s04, cytat: "trzymał Konopnicę z Stró-żą i inne, Dworzanem naprzód Xiążęcym, potem Pod-czaszym był, w wielgoradzie zasiadał, na kościoły hojny—synów trzech miał, dwóch zabitych u Lignice, jeden zginął z powietrza."}, {segment: S01-p135-s04, cytat: "Konopnice wziął Xiąże Bo-leslaus Pudicus, ale oddał Wojewodzie Stogniewowi jako słuszność, bo była dana na wieczność, ale Gaje odpadły, które dostał Krzesław z Garnku Porajczyk."}], pewnosc_odczytu: pewna}
