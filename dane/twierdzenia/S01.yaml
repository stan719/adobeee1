# --- dodatek Kosińskiego do przyp. 24 s. 93 (Konopniccy-Grabowscy i Zborowscy)
- {id: S01-100, podmiot: wilk-jan-grabowa, relacja: malzonek, obiekt: zborowska-jachna, wartosc: "przez to małżeństwo Konopniccy-Grabowscy spokrewnili się z Szydłowieckimi, Tęczyńskimi, Radziwiłłami, Chodkiewiczami itd.",
   zrodla: [{segment: S01-p144-f13, cytat: "Jachna z Świerczowa żona Jana Wilka na Grabowie i Konopnicy"}, {segment: S01-p145-f13, cytat: "Przez małżeństwo Ja-na Wilka z Jachną Zborowską, Konopniccy-Grabowscy spokre-wnili się z najwyższą magnaterją krajową owéj epoki, jak z Szy-dłowieckiemi, Tęczyńskiemi, Radziwiłłami, Chodkiewiczami i t. d."}], pewnosc_odczytu: pewna}
- {id: S01-101, podmiot: zborowska-jachna, relacja: opis, wartosc: "należała do rodziny Zborowskich h. Jastrzębiec: w 1445 r. (Akta Grodz. Sieradzkie X. 8–226 f. 357) z bratem Mikołajem ze Zborowa odstąpiła Tomaszowi z Ptaszkowic Chrosty i pół Kątów; bracia: Mikołaj (służył u Macieja Korwina, starosta odolanowski, bezpotomny), Wawrzyniec (zm. młodo?), Andrzej (kasztelan wieluński, starosta odolanowski, ż. Elżbieta Szydłowiecka; synowie Jan, Piotr i Marcin † 1565, kasztelan krakowski, ojciec siedmiu synów, m.in. Samuela, Krzysztofa, Andrzeja); Zborów leży koło Widawy, przy granicy z Konopnicą", data: {tekst: "1445 r.", od: 1445, do: 1445},
   zrodla: [{segment: S01-p144-f13, cytat: "na-leżała właściwie do słynnéj rodziny Zborowskich herbu Ja-strzębiec, gdyż w dokumencie z 1445 r. Sabbatho proximo ante festum Sancte Lucie (Akta Grodz. Sieradzkie X. 8—226 f. 357),"}, {segment: S01-p145-f13, cytat: "zawierając z Tomaszem z Ptaskowicz tranzakcję, którą ustępo-wała mu na własność swoje majętności Chrosty i pół Kątów"}, {segment: S01-p145-f13, cytat: "Wieś Zborów gniazdo Jastrzębczyków Zborowskich, leży w pobliżu miasta Widawy, a o granicę z Konopnicą"}, {segment: S01-p145-f13, cytat: "oprócz Mikołaja miała jeszcze Jachna dwóch braci Wawrzyńca i Andrzeja jak to wykazuje Akt z 1441 r."}, {segment: S01-p145-f13, cytat: "Andrzéj Kasztelan Wieluński i Starosta Odolanowski, w wielkich był łaskach u króla Kazimierza Jagiellończyka"}, {segment: S01-p145-f13, cytat: "Marcina † 1565 r. Kasztelana Krakowskiego"}, {segment: S01-p145-f13, cytat: "tę walkę przypłacił jeden z nich (Samuel) głową, a dwaj Krysztof i Andrzéj utratą dostojności i majątków."}], pewnosc_odczytu: pewna,
   uwagi: "Dodatek Kosińskiego do hasła Grabowskich; nie dotyczy bezpośrednio Radoszewskich."}
