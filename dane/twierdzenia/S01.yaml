- {id: S01-026, podmiot: okszyc-wroclaw-i, relacja: opis, wartosc: "trzymał Broszencin i Stróżę (po bracie Stogniewie); zabity przez Tatarów z dwoma synami; trzeci syn, trzymający Broszencin, „warchoł duży na niesławę domu” — rodzina się go zaparła, zginął z dziećmi, linia wygasła; Bukowscy i Kłobukowscy wywodzą się od niego, „quis scit”",
   zrodla: [{segment: S01-p136-s02, cytat: "trzymał Bro-szencin i Stróżę, te po bracie Stogniewie, zabit od Ta-tar z dwoma synami, trzeci trzymał Broszencin, war-choł duży na niesławę domu, że się go zaparli—prze-padł też marnie i z dziećmi, że już niema pokolenia. chocia panowie Bukoscy i też Kłobukoscy wywodzą się od niego, quis scit."}], pewnosc_odczytu: pewna}

# --- pokolenie V: Wojewoda Boxa
- {id: S01-027, podmiot: okszyc-stogniew-iv-boxa, relacja: rodzic, obiekt: okszyc-mikolaj-i,
