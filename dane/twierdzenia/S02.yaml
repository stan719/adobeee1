# --- s. 12–19: rokosz Zebrzydowskiego (za W. Szczygielskim, s. 111–115)
- {id: S02-051, podmiot: zebrzydowski-mikolaj, relacja: udzial_w_wydarzeniu, wartosc: "tło rokoszu: niepopularne posunięcia dworu (zbliżenie z Habsburgami, planowana wojna o tron szwedzki); po śmierci Zamoyskiego (1605) Mikołaj Zebrzydowski, wojewoda krakowski, został przywódcą opozycji; w 1606 r. równolegle z sejmem w Warszawie zwołał zjazd w Stężycy, a ten — zjazd w Lublinie, który ogłosił rokosz i zbiórkę szlachty pod Sandomierzem 6 czerwca 1606 r.", data: {tekst: "1605–1606", od: 1605, do: 1606-06-06}, miejsce: stezyca,
   zrodla: [{segment: S02-p12-s02, cytat: "Radoszewscy nie byli bierni w okresie takiego wydarzenia historycznego w Polsce jakim był rokosz Zebrzydowskiego."}, {segment: S02-p12-s03, cytat: "(zbliżenie z Habsburgami, planowana wojna o tron szwedzki itp.)"}, {segment: S02-p13-s01, cytat: "Po śmierci Zamoyskiego w 1605 r. przywódcą opozycji został wojewoda krakowski Mikołaj Zebrzydowski"}, {segment: S02-p13-s01, cytat: "Zebrzydowski zwołał zjazd opozycjonistów w Stężycy skierowany już ostrzem[?] wyraźnie przeciwko królowi."}, {segment: S02-p14-s01, cytat: "Zjazd lubelski ogłosił już otwarty rokosz przeciwko królowi, nakazując szlachcie zebrać się zbrojnie pod Sandomierzem w dniu 6 czerwca 1606 r."}], pewnosc_odczytu: niepewna, uwagi: "Za Szczygielskim."}
- {id: S02-052, podmiot: koniecpolski-aleksander-1609, relacja: udzial_w_wydarzeniu, wartosc: "starosta wieluński, reprezentował obóz regalistów na zjeździe w Stężycy (1606)", miejsce: stezyca, data: {tekst: "1606", od: 1606, do: 1606},
   zrodla: [{segment: S02-p13-s01, cytat: "Obóz regalistów w Stężycy reprezentował m. in. starosta wieluński Aleksander Koniecpolski."}], pewnosc_odczytu: pewna, uwagi: "Za Szczygielskim."}
- {id: S02-053, podmiot: koniecpolski-aleksander-1609, relacja: urzad, wartosc: "starosta wieluński, wojewoda; sejmik w Środzie domagał się pozbawienia go urzędu", miejsce: sroda-wlkp,
   zrodla: [{segment: S02-p14-s01, cytat: "Sejmik szlachty województw wielkopolskich"}, {segment: S02-p15-s01, cytat: "w Środzie ostro wystąpił przeciwko regalistom, domagając się m. in. pozbawienia urzędu wojewody starosty wieluńskiego Aleksandra Koniecpolskiego."}], pewnosc_odczytu: pewna, uwagi: "Za Szczygielskim."}
- {id: S02-054, podmiot: wielun, relacja: opis, wartosc: "w czasie rokoszu wśród szlachty wieluńskiej chaos i dezorientacja polityczna, wystąpienia antymagnackie; szlachta podzielona na dwa obozy; sejmik ziemi wieluńskiej i powiatu ostrzeszowskiego, pod wpływem zjazdu średzkiego, ogłosił wymarsz szlachty pod Sandomierz", data: {tekst: "1606", od: 1606, do: 1606},
   zrodla: [{segment: S02-p14-s01, cytat: "W ziemi wieluńskiej wśród szerokich rzesz szlachty zapanował chaos i dezorientacja polityczna. Umożyły się wystąpienia antymagnac-kie."}, {segment: S02-p14-s01, cytat: "Szlachta podzieliła się na dwa obozy"}, {segment: S02-p15-s01, cytat: "Zwołany wreszcie sejmik ziemi wieluńskiej i powiatu ostrzeszowskiego"}, {segment: S02-p15-s01, cytat: "ogłosił powszechny wymarsz szlachty wieluńskiej pod Sandomierz."}], pewnosc_odczytu: pewna, uwagi: "Za Szczygielskim. „Umożyły się” — tak w rękopisie."}
- {id: S02-055, podmiot: kurzynski-jan-1606, relacja: urzad, wartosc: "marszałek koła rycerskiego; podpisał uchwałę rokoszową sejmiku wieluńskiego", data: {tekst: "1606", od: 1606, do: 1606},
   zrodla: [{segment: S02-p15-s01, cytat: "Uchwałę w imieniu sejmiku podpisał Jan Kurzyński[?], marszałek koła rycer-skiego."}], pewnosc_odczytu: niepewna, uwagi: "Za Szczygielskim."}
- {id: S02-056, podmiot: radoszewski-marek-1641, relacja: udzial_w_wydarzeniu, wartosc: "obecny na sejmiku wieluńskim, który ogłosił wymarsz pod Sandomierz (ponad 100 szlachty wymienionych z nazwiska; m.in. Maciej Mowiński[?], pisarz grodzki, Jan Węgierski, pisarz ziemski); następnie wśród regalistów, którzy zaprotestowali przeciw uchwale", data: {tekst: "1606", od: 1606, do: 1606},
   zrodla: [{segment: S02-p15-s01, cytat: "Źródło wymienia obecnych na sejmiku z imienia i nazwiska ponad 100 szlachty (...) Z bardziej znanych osób wymienić można Macieja Mowińskiego[?], pisarza grodzkiego wieluńskiego, Marka Radoszewskiego, Jana Węgierskiego, pisarza ziemskiego wieluńskiego."}, {segment: S02-p16-s01, cytat: "Marek i Piotr Radoszewscy"}], pewnosc_odczytu: niepewna, uwagi: "Za Szczygielskim."}
