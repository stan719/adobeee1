- {id: S02-046, podmiot: radoszewski-jerzy-1614, relacja: opis, wartosc: "po śmierci A. Koniecpolskiego (1609) rodzina Radoszewskich wysunęła się przejściowo na czoło szlachty wieluńskiej — aktywna politycznie, ekonomicznie i kulturalnie, organizatorzy i przywódcy polityczni Wielunian, bardzo popularni w ziemi wieluńskiej",
   zrodla: [{segment: S02-p10-s03, cytat: "na czoło szlachty wieluńskiej"}, {segment: S02-p11-s01, cytat: "wysunęła się przejściowo rodzina Radoszewskich, wyróżniająca się w tym czasie aktywnością polityczną, ekonomiczną i kulturalną. Ona też występowała w roli organizatorów i przywódców politycznych Wielunian."}], pewnosc_odczytu: pewna,
   uwagi: "Twierdzenie o rodzinie; przypisane Jerzemu jako najstarszemu wymienionemu. Za Szczygielskim."}
- {id: S02-047, podmiot: radoszewski-jerzy-1614, relacja: urzad, wartosc: "podkomorzy ziemi wieluńskiej już w czasach Aleksandra Koniecpolskiego, którego był protegowanym; po jego śmierci zaangażowany czynnie, zwłaszcza w czasie rokoszu Zebrzydowskiego",
   zrodla: [{segment: S02-p11-s01, cytat: "Już w czasach Aleksandra Koniecpolskiego Jerzy Radoszewski piastował wysoką godność podkomorzego ziemi wieluńskiej angażując się czynnie po śmierci swego wielkiego protektora, zwłaszcza w tragicznych dniach rokoszu Zebrzydowskiego."}], pewnosc_odczytu: pewna, uwagi: "Za Szczygielskim."}
- {id: S02-048, podmiot: radoszewski-marek-1641, relacja: urzad, wartosc: "najpierw podkomorzy, w 1633 r. kasztelan wieluński (godność senatorska)", data: {tekst: "w 1633 r", od: 1633, do: 1633},
   zrodla: [{segment: S02-p11-s01, cytat: "Marek Radoszewski najpierw podkomorzy, został w 1633 r Kasztelanem"}, {segment: S02-p12-s01, cytat: "wieluńskim, a więc dostąpił godności senatorskiej."}], pewnosc_odczytu: pewna,
   uwagi: "Za Szczygielskim, s. 106–107. S07 podaje kasztelanię 1661–1677."}
- {id: S02-049, podmiot: radoszewski-marek-1641, relacja: opis, wartosc: "ogromnie popularny wśród Wielunian; szlachta uważała go za swego przywódcę; po śmierci (1641) wystawiono mu w kościele wieluńskim wspaniały nagrobek z portretem i marmurową tablicą",
   zrodla: [{segment: S02-p12-s01, cytat: "Szlachta wieluńska uważała go powszechnie za swego przywódcę"}, {segment: S02-p12-s01, cytat: "Po śmierci w 1641 r wystawiono Radoszewskiemu w kościele wieluńskim wspaniały nagrobek z portretem i marmurową tablicą”"}], pewnosc_odczytu: pewna, uwagi: "Za Szczygielskim."}
- {id: S02-050, podmiot: radoszewski-marek-1641, relacja: smierc, data: {tekst: "w 1641 r", od: 1641, do: 1641},
