- {id: S02-069, podmiot: wielun, relacja: opis, wartosc: "nie wszyscy uczestnicy sejmiku byli zwolennikami rokoszu; wieluńska szlachta rokoszowa opamiętała się pod Sandomierzem; król zwołał zjazd do Wiślicy, zawarto umowę w Janowcu; na początku 1607 r. opozycja wznowiła rokosz (zjazd w Jędrzejowie 21 marca), szlachta Wielkopolski miała zgromadzić się pod Sieradzem — ziemia wieluńska w centrum ruchu; regaliści z A. Koniecpolskim zwołali kontrzjazd pod Sieradzem, Wielunianie byli w obu obozach", data: {tekst: "1606–1607", od: 1606, do: 1607},
   zrodla: [{segment: S02-p16-s01, cytat: "Z zestawu tego wynika, że nie wszyscy uczestnicy wymienionego wyżej sejmiku wieluńskiego byli zwolennikami rokoszu (...) Wieluńska szlachta rokoszowa opamiętała się jednak pod Sandomierzem"}, {segment: S02-p17-s01, cytat: "Jednocześnie król zwołał zjazd do Wiślicy zapowiadając rozpatrzenie postulatów rokoszan. Zawarto umowę w Janowcu."}, {segment: S02-p17-s01, cytat: "W ten sposób ziemia wieluń-ska znalazła się niemal w centrum ruchu rokoszowego Wielkopolski."}, {segment: S02-p17-s01, cytat: "Nie zabrakło wśród nich i Wielunian."}], pewnosc_odczytu: pewna, uwagi: "Za Szczygielskim."}
- {id: S02-070, podmiot: jedrzejow, relacja: opis, wartosc: "na 21 marca 1607 r. opozycja zwołała tu szlachtę, wznawiając rokosz; rokoszanie ruszyli spod Sieradza pod Jędrzejów", data: {tekst: "21 marca 1607", od: 1607-03-21, do: 1607-03-21},
   zrodla: [{segment: S02-p17-s01, cytat: "Już jednak w początkach roku 1607 opozycja wielkopolska ogłosiła wznowienie rokoszu, zwołując szlachtę na 21 marca do Jędrzejowa."}, {segment: S02-p18-s01, cytat: "ruszyli pod Jędrzejów."}], pewnosc_odczytu: pewna, uwagi: "Za Szczygielskim."}
- {id: S02-071, podmiot: koniecpolski-aleksander-1609, relacja: udzial_w_wydarzeniu, wartosc: "na czele obozu królewskiego zwołał kontrzjazd pod Sieradzem i podjął pertraktacje z rokoszanami (1607)", miejsce: sieradz, data: {tekst: "1607", od: 1607, do: 1607},
   zrodla: [{segment: S02-p17-s01, cytat: "Obóz królewski z Aleksandrem Koniecpolskim na czele postanowił zwołać w terminie przewidzianym przez rokoszan kontr-zjazd również pod Sieradzem."}, {segment: S02-p18-s01, cytat: "regaliści z Aleksandrem Koniecpolskim na czele rozpoczęli per-traktacje."}], pewnosc_odczytu: pewna, uwagi: "Za Szczygielskim."}
- {id: S02-072, podmiot: radoszewski-jerzy-1614, relacja: udzial_w_wydarzeniu, wartosc: "jako podkomorzy wieluński stał na czele poselstwa stronnictwa królewskiego do obozu rokoszan pod Sieradzem; już 70-letni, nakłaniał przywódców rokoszu do rezygnacji z walki i oddania sprawy pod arbitraż sejmu — bez skutku", miejsce: sieradz, data: {tekst: "1607", od: 1607, do: 1607},
   zrodla: [{segment: S02-p18-s01, cytat: "Poselstwo stronnictwa kró-lewskiego na czele z podkomorzym wieluń-skim Jerzym Radoszewskim udało się do obozu rokoszan. Radoszewski, wówczas 70-letni już starzec, starał się nakłaniać przywódców rokoszu do zrezygnowania z walki zbrojnej i oddania całej sprawy pod arbitraż sejmu. Rokoszanie już nie dali się jednak przekonać"}], pewnosc_odczytu: pewna,
   uwagi: "Za Szczygielskim. „70-letni” w 1607 r. nie zgadza się dokładnie z wiekiem 80 lat przy śmierci 1614 (ur. ok. 1534)."}
- {id: S02-073, podmiot: guzow, relacja: opis, wartosc: "bitwa pod Guzowem (1607): armia królewska pod hetmanami Stanisławem Żółkiewskim i Janem Karolem Chodkiewiczem rozgromiła rokoszan; walczyli w niej Wielunianie; Aleksander Koniecpolski przywiódł 400 zbrojnych i odpowiadał za bezpieczeństwo króla", data: {tekst: "1607", od: 1607, do: 1607},
   zrodla: [{segment: S02-p18-s01, cytat: "W bitwie pod Guzowem armia królewska dowodzona przez tak znakomitych het-manów jak Stanisław Żółkiewski i Jan Karol Chodkiewicz rozgromiła wojska opozycji"}, {segment: S02-p19-s01, cytat: "W bitwie tej wzięli również udział Wielunianie. Aleksander Koniecpolski przywiódł na plac boju 400 zbrojnych i był odpowiedzialny w czasie bitwy za bezpieczeństwo osoby króla”"}], pewnosc_odczytu: pewna, uwagi: "Za Szczygielskim, s. 111–115 (przypis 7)."}
- {id: S02-074, podmiot: koniecpolski-aleksander-1609, relacja: udzial_w_wydarzeniu, wartosc: "w bitwie pod Guzowem przywiódł 400 zbrojnych i odpowiadał za bezpieczeństwo króla", miejsce: guzow, data: {tekst: "1607", od: 1607, do: 1607},
   zrodla: [{segment: S02-p19-s01, cytat: "Aleksander Koniecpolski przywiódł na plac boju 400 zbrojnych"}], pewnosc_odczytu: pewna}
- {id: S02-075, podmiot: wielun, relacja: opis, wartosc: "część szlachty wieluńskiej (wg przypuszczenia Szczygielskiego) pozostała w ziemi i wzięła udział w sejmikach rozpisanych przez króla",
   zrodla: [{segment: S02-p18-s01, cytat: "że znaczna część szlachty wieluńskiej pozostała w swej ziemi i wzięła udział w rozpisanych przez króla sejmikach."}], pewnosc_odczytu: pewna}

# --- s. 19–21: kultura, Turcy, ocena autora
- {id: S02-076, podmiot: radoszewski-jerzy-1614, relacja: opis, wartosc: "Radoszewscy wyróżniali się ogólną kulturą; w połowie XVI w. mieli jeden z nielicznych w ziemi wieluńskiej księgozbiorów; w I poł. XVII w. fundowali do ziemi wieluńskiej dzieła malarskie — Jerzy sprowadził z Włoch do Wielunia zachowany obraz „Grosz czynszowy” ze szkoły Tycjana",
   zrodla: [{segment: S02-p19-s02, cytat: "Rodzina Radoszewskich to nie tylko wielcy działacze polityczni, ale również wiele zasłużyli się na polu krzewienia kultury i sztuki."}, {segment: S02-p19-s03, cytat: "Ogólną kulturą wy-różniali się np. miejscowa rodzina Radoszewskich w której posiadaniu w połowie XVI w. znajdował się jeden z nielicznych tu księgozbiorów. W pierwszej połowie XVII w. ufundowali Radoszewscy"}, {segment: S02-p20-s01, cytat: "do ziemi wieluńskiej malarskie dzieła sztuki, Jerzy Radoszewski sprowadził np. z Włoch do Wielunia zachowany do dziś obraz „Grosz czynszowy” pochodzący ze słynnej szkoły Tycjanowskiej”"}], pewnosc_odczytu: pewna,
   uwagi: "Za Szczygielskim, s. 124–125 (przypis 8). S08 przypisuje sprowadzenie obrazu Markowi (dane/watpliwosci.md)."}
- {id: S02-077, podmiot: radoszewski-andrzej-1630, relacja: fundacja, wartosc: "w 1630 r., spełniając ślub za cudowne ocalenie z niewoli tureckiej, sprawił srebrną sukienkę do obrazu Matki Boskiej w Pajęcznie", miejsce: pajeczno, data: {tekst: "W r. 1630", od: 1630, do: 1630},
   zrodla: [{segment: S02-p20-s02, cytat: "W r. 1630 Andrzej Radoszewski, chorąży wieluński, spełniając ślub za cudowne ocalenie z niewoli tureckiej, sprawił do obrazu Matki Boskiej w Pajęcznie srebrną sukienkę”"}], pewnosc_odczytu: pewna,
   uwagi: "Za: ks. Stanisław Nejman, „Cudowny obraz Matki B. Pajęczańskiej” (przypis 9). Por. Andrzej chorąży †1621 (radoszewski-andrzej-1621)."}
- {id: S02-078, podmiot: radoszewski-andrzej-1630, relacja: udzial_w_wydarzeniu, wartosc: "niewola turecka, z której „cudownie ocalał”; Radoszewskich „nie zabrakło do walki z Turkami”",
   zrodla: [{segment: S02-p20-s02, cytat: "za cudowne ocalenie z niewoli tureckiej"}, {segment: S02-p20-s03, cytat: "Radoszewskich nie zabrakło również do walki z Turkami"}], pewnosc_odczytu: pewna}
- {id: S02-079, podmiot: radoszewice, relacja: opis, wartosc: "ocena autora: Radoszewscy byli wielkimi i sławnymi działaczami politycznymi, kulturalnymi i patriotycznymi, „zapisali się złotemi literami w dziejach ziemi wieluńskiej”",
   zrodla: [{segment: S02-p20-s03, cytat: "kiedy zaraza islamu zalewała świat"}, {segment: S02-p20-s04, cytat: "Widzimy z powyższego, że Radoszewscy byli wielkimi i sławnymi działaczami pod względem politycznym, kulturalnym i patriotycznym. Zapisali się"}, {segment: S02-p21-s01, cytat: "złotemi literami w dziejach ziemi wieluńskiej"}], pewnosc_odczytu: pewna}
- {id: S02-080, podmiot: radoszewice, relacja: opis, wartosc: "trudno dokładnie określić, jak długo Radoszewice należały do Radoszewskich (akta ziemskie w większości zniszczone w I i II wojnie); wg dokumentów kancelarii gubernatora kaliskiego i ksiąg hipotecznych w XVIII i XIX w. Radoszewice należały do rodziny Niemojowskich", data: {tekst: "w XVIII i XIX wieku", od: 1701, do: 1900},
   zrodla: [{segment: S02-p21-s02, cytat: "Jak długo Radoszewice były w posiadaniu Radoszewskich, trudno jest dokładnie określić."}, {segment: S02-p21-s02, cytat: "Według do-kumentów archiwalnych z kancelarii gubernatora kaliskiego i ksiąg hipo-tecznych wynika, że w XVIII i XIX wieku Radoszewice były w posiadaniu zacnej rodziny Niemojowskich."}], pewnosc_odczytu: pewna}
- {id: S02-081, podmiot: radoszewski-michal-1775, relacja: opis, wartosc: "dopisek na marginesie (inna ręka), kto utracił Radoszewice: „stracił chyba[?] Michał Kasztelan Brzeziński 1775 albo Roch Kasztelanic”",
