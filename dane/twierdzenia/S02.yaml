- {id: S02-088, podmiot: radoszewice-dwor, relacja: opis, wartosc: "wg odczytu F. Borzyka[?]: ojciec biadał nad upadkiem pięknego majątku z gorzelnią, pamiętając dawnych właścicieli — Radoszewskich i Niemojowskich, których czyny patriotyczne znał i przekazał synowi wg tradycji rodzinnej; gdy majątek przeszedł „w niewłaściwe ręce” i zaczęła się dewastacja, ginęły pamiątki narodowe, urządzenia, park i stawy z kaplicą św. Jana",
   zrodla: [{segment: S02-p22-s03, cytat: "Biadał nad upadkiem tak pięknego majątku z gorzelnią na czele, ze względu na ich dawnych właścicieli, jak Radoszewskich i Niemojowskich, których historię czynów patriotycznych znał doskonale i co też mnie przekazał według tradycji rodzinnej"}, {segment: S02-p22-s03, cytat: "Kiedy Radoszewice przeszły na własność w niewłaściwe ręce i zaczęła się ich dewastacja"}, {segment: S02-p23-s01, cytat: "że ginie wiele pamiątek narodowych, piękne urządzenia, cudny park a nawet stawy z symboliczną Kaplicą Św. Jana"}], pewnosc_odczytu: pewna}
- {id: S02-089, podmiot: radoszewice-stawy, relacja: opis, wartosc: "stawy z „symboliczną” kaplicą św. Jana; gospodarka rybna w Radoszewicach sięga wieków — w latach 1562–1588 rozwój gospodarki stawowej w dobrach Radoszewskich w Radoszewicach, Lipniku[?] i Kuszynie", data: {tekst: "W latach 1562–1588", od: 1562, do: 1588},
   zrodla: [{segment: S02-p23-s01, cytat: "stawy z symboliczną Kaplicą Św. Jana, która to gospodarka rybna w Radoszewicach datuje się od wieków"}, {segment: S02-p23-s01, cytat: "„W latach 1562–1588 nastąpił rozwój gospodarki stawowej w dobrach Radoszewskich w Radoszewicach, Lipniku[?] i Kuszynie”"}], pewnosc_odczytu: niepewna,
   uwagi: "Za: W. Szczygielski, „Produkcja rolnicza gospodarstwa folwarcznego w Wieluńskim od XVI do XVIII wieku”, Łódź 1963, s. 141 (przypis 32)."}
