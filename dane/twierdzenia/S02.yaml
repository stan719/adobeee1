   zrodla: [{segment: S02-p15-s01, cytat: "Macieja Mowińskiego[?], pisarza grodzkiego wieluńskiego"}, {segment: S02-p16-s01, cytat: "Maciej Mowiński[?]"}], pewnosc_odczytu: niepewna}
- {id: S02-058, podmiot: wegierski-jan-1606, relacja: urzad, wartosc: "pisarz ziemski wieluński (s. 15) / sędzia ziemski wieluński (s. 16); regalista", data: {tekst: "1606", od: 1606, do: 1606},
   zrodla: [{segment: S02-p15-s01, cytat: "Jana Węgierskiego, pisarza ziemskiego wieluńskiego."}, {segment: S02-p16-s01, cytat: "Jan Węgierski, sędzia ziemski wieluński"}], pewnosc_odczytu: pewna, uwagi: "Dwa różne urzędy w tym samym cytacie — tak w źródle."}
- {id: S02-059, podmiot: koniecpolski-aleksander-1609, relacja: udzial_w_wydarzeniu, wartosc: "na czele 12 regalistów złożył w księgach grodzkich wieluńskich protestację przeciw rokoszowej uchwale sejmiku; regaliści: Aleksander i Zygmunt Koniecpolscy, Jan Węgierski, Maciej Mowiński[?], Jan Brodnicki (burgrabia), Marek i Piotr Radoszewscy, Jerzy Skórkowski, Mikołaj Kowalski, Bartosz i Piotr Skrzyńscy, Eliasz Gołkowski[?], Wacław Czechowski", miejsce: wielun, data: {tekst: "1606", od: 1606, do: 1606},
   zrodla: [{segment: S02-p16-s01, cytat: "Znacznie mniejsza grupa miejscowej szlachty, bo złożona zaledwie z 12 osób na czele z Aleksandrem Koniecpolskim, złożyła przeciwko rokoszowej uchwale sejmiku wieluńskiego oficjalną protest-ację w księgach grodzkich wieluńskich."}, {segment: S02-p16-s01, cytat: "Jan Węgierski, sędzia ziemski wieluński, Zygmunt Koniecpolski, Maciej Mowiński[?], Jan Brodnicki, burgrabia wieluński, Marek i Piotr Radoszewscy, Jerzy Skórkowski, Mikołaj Kowalski, Bartosz i Piotr Skrzyńscy, Eliasz Gołkowski[?] oraz Wacław Czechowski."}], pewnosc_odczytu: niepewna, uwagi: "Za Szczygielskim."}
