# S08 cz. 4: Radoszewice — koniec opisu i aneks źródłowy (inwentarz 1791), s. 133–137

- {id: S08-156, podmiot: radoszewice-dwor, relacja: opis, wartosc: "układ wnętrz z „salą” na osi sieni (dwoje drzwi i okien do ogrodu) niewiele zmieniony od końca XVIII w.; poddasze na mieszkania; 14 pomieszczeń (7 mieszkalnych); brak starego wyposażenia i pieców; stan techniczny niepokojąco zły, szkoła nie ma środków na remont; dwór z przełomu 3. i 4. ćwierci XVIII w. czeka na opiekę konserwatorską",
   zrodla: [{segment: S08-p133-s01, cytat: "zwanym w inwentarzu z 1791 r. „salą” (posiadającą i dziś dwoje drzwi i okien prowadzących do ogrodu), niewiele zmienił się od końca XVIII w."}, {segment: S08-p133-s01, cytat: "łącznie w budynku jest 14 pomieszczeń, z czego 7 mieszkalnych. Całkowicie natomiast brak elementów starego wy-posażenia budynku, pieców itp."}, {segment: S08-p133-s02, cytat: "Obecny stan techniczny budynku, choć jeszcze użytkowanego, jest już niepokojąco zły, a Szkoła Podstawowa nie może z racji kłopotów finansowych, pokusić się o generalny remont. Zbudowany na przełomie 3 i 4 ćwierci XVIII w. dwór w Radoszewicach, czeka więc na staranniejszą niż dotąd opiekę konser-watorską."}], pewnosc_odczytu: pewna}
- {id: S08-157, podmiot: radoszewice-park, relacja: opis, wartosc: "resztki parku (część zajęta pod drogę, agronomówkę i dom mieszkalny) sięgają chyba czasów Radoszewskich — szczególnie aleja pomnikowych lip i grabów w części północnej; przekształcony prawdopodobnie ok. 1905–1910 z inicjatywy T. Durzyńskiego; na zachodnim skraju (ok. 200 m od dworu) relikty kopca z lodownią — może kryje stary dwór obronny z 1588 r.; mur otaczający park i zespół istniał jeszcze na początku XX w., dziś granice wyznaczają rowy", data: {tekst: "około 1905–1910", od: 1905, do: 1910},
   zrodla: [{segment: S08-p133-s01, cytat: "sięga chyba jeszcze czasów Radoszewskich, szczególnie aleja pomnikowych lip i grabów w partii północnej. Prawdo-podobnie przemiana starego parku nastąpiła także w latach około 1905–1910 z inicjatywy T. Durzyńskiego."}, {segment: S08-p133-s01, cytat: "Na zachodnim skraju parku, około 200 m od elewacji ogrodowej, znajdują się relikty kopca mieszczącego lodownię."}, {segment: S08-p133-s01, cytat: "możliwe, że kryje relikty starego dworu obronnego, wspomnianego w 1588 r."}], pewnosc_odczytu: pewna,
   uwagi: "Wg s. 128 Durzyński objął Radoszewice dopiero po I wojnie — rozbieżność wewnątrz źródła; S10: Duryński właścicielem do 1913."}
- {id: S08-158, podmiot: niemojowski-andrzej-stolnik, relacja: wlasnosc, obiekt: radoszewice, wartosc: "dziedziczne dobra Radoszewice, Kuszyna, Kuźnica, Laski, Bugaj, Zmyślona i inne — w 1791 r. w posiadaniu wdowy Martyny z Wężyków, 1° v. Niemojowskiej, 2° v. żony Ludwika Walewskiego, chorążego piotrkowskiego (inwentarz: AGAD Castr. Vielun. obl. 48 f. 274–296)", data: {tekst: "1791", od: 1791, do: 1791},
   zrodla: [{segment: S08-p133-s03, cytat: "3. ANEKS ŹRÓDŁOWY Castr. Vielun. obl. 48"}, {segment: S08-p133-s04, cytat: "Opisanie inwentarza czyli stanu wsi Radoszewic, Kuszyny, Kuźnicy, Lasków, Bugaja, Zmyśloney i inszych w ziemi wieluńskiey leżących niegdy Wielmożnego Imci Andrzeja Niemojowskiego stolnika ziemi wieluńskiey dziedzicznych przez Wielmożną Panią Martynę z Wężyków pierwszego związku zwyż rzeczonego Wielmożnego Andrzeja Niemojowskiego, drugiego Wielmożnego Pana Ludwika Walew-skiego chorążego piotrkowskiego małżonkę posiadane."}], pewnosc_odczytu: pewna}
- {id: S08-159, podmiot: wezyk-martyna, relacja: opis, wartosc: "w drugim małżeństwie żona Ludwika Walewskiego, chorążego piotrkowskiego; posiadała dobra radoszewickie (1791)", data: {tekst: "1791", od: 1791, do: 1791},
   zrodla: [{segment: S08-p133-s04, cytat: "drugiego Wielmożnego Pana Ludwika Walew-skiego chorążego piotrkowskiego małżonkę"}], pewnosc_odczytu: pewna}
- {id: S08-160, podmiot: radoszewice-dwor, relacja: opis, wartosc: "inwentarz 1791 — bryła: dwór drewniany, obmurowany i miejscami murowany, kryty gontem (dach zły), dwa kominy, duże facjaty na dziedziniec i na ogród włoski i mniejsze facjatki, gzymsy; od dziedzińca schody pod okapem; sień z podwójnymi drzwiami sosnowymi i zamkiem francuskim, posadzka z cegły, sufit malowany na czerwono z białym, hak na latarnię", data: {tekst: "1791", od: 1791, do: 1791},
   zrodla: [{segment: S08-p133-s05, cytat: "Dwór drewniany na okół po bokach obmurowany a miejscami murowany, gontami pobity, na którym dach ze szczytem zły"}, {segment: S08-p133-s05, cytat: "W środku dachu facyaty wielkie z oknami, jedna na dziedziniec, druga na ogród włoski"}, {segment: S08-p133-s06, cytat: "Z dziedzińca wchodząc do dwora są gradusy nad któremi jest okap"}, {segment: S08-p134-s01, cytat: "Podsiebitka z tarcic w cienie czerwone z białym malowane, w belce hak żelazny wielki na środku sieni do laterni."}], pewnosc_odczytu: pewna}
- {id: S08-161, podmiot: radoszewice-dwor, relacja: opis, wartosc: "inwentarz 1791 — pomieszczenia: pokój lokajski (drzwi dębowe w gwiazdę, malowany komin kapturowy naprawiony za cześnika Niemojowskiego, piec z białych kafli malowanych na niebiesko, szafa), sionka, schowanie, dwie sklepione piwnice pod dworem (zalewane wodą), drzwi do ogrodu ze zrujnowanymi schodami",
   zrodla: [{segment: S08-p134-s02, cytat: "Z sieni tey po prawey ręce jest Pokój lokayski do którego drzwi podwoyne dębowe, robotą stolarską, dębem czyrnym we dwie kwatery w gwiazdę wysadzane"}, {segment: S08-p134-s02, cytat: "teraz dopiero za possesyi Wielmożnego cześnika Niemojowskiego zreperowany dobry."}, {segment: S08-p134-s03, cytat: "Z tego pokoju prosto są drzwi do sionki"}, {segment: S08-p134-s03, cytat: "dopiero za Wielmożnego cześnika [Feliksa, przyp. LK] Niemojowskiego dorobiony"}, {segment: S08-p134-s04, cytat: "Z tej sionki prosto do schowania są drzwi jak z pokoju podwoyne"}, {segment: S08-p134-s05, cytat: "obydwie piwnice są pod dworem sklepione. Te dla wody która w nich stawa mniej są zdatne do chowania trąnków [!]."}, {segment: S08-p134-s06, cytat: "Z drzwi wychodząc tych do ogrodu są gradusy stare i złe, zgniłe, porozrzucane, ze szczętem zruynowane."}], pewnosc_odczytu: pewna}
- {id: S08-162, podmiot: radoszewice-dwor, relacja: opis, wartosc: "inwentarz 1791 — sala: drzwi dębowe w gwiazdy, komin, piec biało-niebieski, dwa okna i szklane drzwi do ogrodu włoskiego, białe firanki z kutasami, dębowe lamperie snycerskie, obicie płócienne z zielono-niebieskimi wzorkami, trzy landszafty nad drzwiami, dębowa posadzka, sufit płótnem wyklejany ze snycerskimi gzymsami (zaciekający)",
   zrodla: [{segment: S08-p134-s07, cytat: "Wróciwszy się zbitej sionki pierwszej do sieni z dziedzińca będącej prosto w drzwi sienne sala"}, {segment: S08-p134-s07, cytat: "teraz dopiero za Wielmożnego cześnika"}, {segment: S08-p135-s01, cytat: "Pomiędzy tymi oknami są drzwi szklane do ogroda włoskiego"}, {segment: S08-p135-s01, cytat: "Na dole sali po bokach lamperye z drzewa dębowego z gzempsami w różne sztuki snycerskie wysadzane. Obicie płócienne na białym tle wzorki zielone i niebiesko malowane"}, {segment: S08-p135-s01, cytat: "Landszaftów trzy"}], pewnosc_odczytu: pewna}
- {id: S08-163, podmiot: radoszewice-dwor, relacja: opis, wartosc: "inwentarz 1791 — pokój woskowany: kominek z marmurowym obramieniem (wprawionym za cześnika), loża do spania ze snycerką, sztukateriami i złoceniami, obicie płócienne ze szychem, dwa landszafty, dębowa posadzka w kwatery; garderoba; pokój ichmościn (kominek z gipsowymi figurkami, zielone firanki „astrachaniowe”, obicie cieliste z zielonym, trzy landszafty); garderoba z dużą nową szafą z szufladami i zieloną mniejszą; schody na górę",
   zrodla: [{segment: S08-p135-s02, cytat: "Z tej sali po prawej ręce drzwi do pokoju woskowanego"}, {segment: S08-p135-s02, cytat: "marmur wprawiony na okoł komina dobry"}, {segment: S08-p135-s02, cytat: "W tym pokoju loża do sypiania na około tej loży futrowania z gzempsami i rożnemi snycerską robotą wyrabianemi sztukateriami i wyzłaceniami."}, {segment: S08-p135-s03, cytat: "Z tego pokoju idąc wprost drzwi do garderoby podwoyne futrowane"}, {segment: S08-p135-s04, cytat: "W tym pokoju komin murowany z kapturem, na wierzchu osobki z gipsu"}, {segment: S08-p135-s04, cytat: "U tych okien firanki zielone astrachaniowe"}, {segment: S08-p135-s05, cytat: "szafa jedna wielka nowa, z szufladami wielkimi w środku"}, {segment: S08-p136-s01, cytat: "do sionki, gdzie schody na górę."}], pewnosc_odczytu: pewna}
- {id: S08-164, podmiot: radoszewice-dwor, relacja: opis, wartosc: "inwentarz 1791 — pokój panieński (dwa okna na dziedziniec, obicie w zielone pasy i kwiaty, podłoga łatana gliną), schowanie, sionka z drzwiami i schodami do ogrodu, schody na górę — na poddaszu posadzka ceglana i schowki z oknami w facjatach",
   zrodla: [{segment: S08-p136-s02, cytat: "W tym pokoju panieńskim komin z kapturem murowany, u spodu zrujnowany mocno."}, {segment: S08-p136-s02, cytat: "Obicie płócienne w pasy zielone i kwiaty na białym tle malowane"}, {segment: S08-p136-s03, cytat: "drugie do schowania, takie jak i pierwsze podwoyne"}, {segment: S08-p136-s04, cytat: "W tym schowaniu okno na dziedziniec takie jak w pokojach"}, {segment: S08-p136-s05, cytat: "Przy tych drzwiach gradusy do ogrodu jeszcze nie najgorsze."}, {segment: S08-p136-s06, cytat: "Z tej sionki są schody na górę z drzwiami na zawiasach [z] zamkiem polskim i kluczem. Na tej całej górze posadzka z cegły."}], pewnosc_odczytu: pewna}
- {id: S08-165, podmiot: radoszewice-dwor, relacja: opis, wartosc: "inwentarz 1791 — ogród włoski za dworem: aleje obsadzone grabiną, dwie grabowe altany w rogach, kwatery bukszpanowe we „floresy” obsadzone lawendą, świerkowe piramidy na narożach; dziedziniec: oficyny z kuchnią o trzech kominach, kurnik, studnia, dwa narożniki, stajnie, wozownia, psiarnia; sztachety na podmurowaniu z murowanymi słupami zwieńczonymi daszkami i wazonikami, wielka brama (naprawiona za cześnika) z dwiema furtkami, parkan wokół ogrodu; oranżeria z izbą ogrodnika za dziedzińcem",
   zrodla: [{segment: S08-p136-s07, cytat: "Ogród włoski zaraz za dworem, u którego po bokach ulice grabiną wysadzone w lenię prostą. W rogach dwóch ulic altany dwie podobnie z grabiny robione, w środku tego ogrodu są kwatery bukszpanem, w środku w różne floresy wysadzane a po bokach lawendą."}, {segment: S08-p136-s08, cytat: "Obok dworu po jednej stronie dziedzińca officyny, w środku officyn kuchnia pod gontami o trzech kominach murowanych"}, {segment: S08-p136-s08, cytat: "wierzchołki słupów murowanych są daszkami z gruntów pokrywane, na których znajdują się wazoniki."}, {segment: S08-p136-s08, cytat: "Oranżeria z izbą dla ogrodowego za dziedzińcem"}], pewnosc_odczytu: pewna}
- {id: S08-166, podmiot: radoszewice, relacja: opis, wartosc: "inwentarz 1791 — folwark z drewna kostkowego, kurniki, murowana piwniczka na mleko, lamus z piwnicami, obory, spichrze, stajnie, wołownie, chlewy, browar i gorzelnia pod jednym dachem, ozdownia, stodoły koliste, sieczkarnia, owczarnia, karczma; osiadłość: 20 półrolników, 12 zagrodników trzydniowych, 6 chałupników, 7 komorników, dwojaki i czworaki; dalej opis Lipska[?], Kuszyny, Kuźnicy, Lasków, Bugaja, nowej Kolonii, Zmyślonej, młynów, pustkowi, stawów i lasów", data: {tekst: "1791", od: 1791, do: 1791},
   zrodla: [{segment: S08-p136-s08, cytat: "Opisanie budynków folwarcznych we wsi Radoszewicach będących. Folwark z drzewa kostkowego"}, {segment: S08-p137-s01, cytat: "browar i gorzelnia w węgieł stawiana pod jednym dachem"}, {segment: S08-p137-s01, cytat: "Osiadłość [opuszczono opis 20 półrolników]"}, {segment: S08-p137-s01, cytat: "dalej opis Lipska, Kuszyny, Kuźnicy, Lasków, Bugaja, nowej Kolonii, Zmyślona, młynów, pustkowi, stawów i lasów (do f. 296)."}], pewnosc_odczytu: pewna}
