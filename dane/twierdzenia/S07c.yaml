- {id: S07-482, podmiot: grabinska-stanislawa-1890, relacja: opis, wartosc: "w Kościerzynie opiekowała się pracownikami i gospodarzami (upinała welony pannom młodym), prowadziła ochronkę, pomagała potrzebującym, Koło Ziemianek; park, ogród, szklarnie (chryzantemy, fiołki alpejskie, tulipany, konwalie, hiacynty, róże „Maréchal Niel”), inspekty, pasieka 50 uli; kaplica dworska z nabożeństwem majowym (ks. prałat Cieplinski — jej prefekt, ks. prałat Hilken); zjazdy rodzinne, imieniny (strzelanie z batów), dożynki ze strojami sieradzkimi", miejsce: koscierzyn,
   zrodla: [{segment: S07-p38-s01, cytat: "Babcia zamieszkała w Kościerzynie. Opiekowała się pracownikami dba[jąc] o ich potrzeby i zdrowie, jak też i o gospodarzy mieszkających na wsi."},
            {segment: S07-p38-s01, cytat: "Utrzymywała ochronkę dla dzieci. Pomagała wielu potrzebującym. Należała do Koła Ziemianek."},
            {segment: S07-p38-s01, cytat: "Pasieka z 50 uli dostarczała miodu"},
            {segment: S07-p39-s01, cytat: "We dworze była kaplica wyposażona we wszystko co potrzeba do Mszy św. Przez cały maj odprawiała tam Babcia nabożeństwo majowe. Często przyjeżdżali przyjaciele ks. prałat Cieplinski (prefekt Babci) i ks. prałat Hilken i odprawiali Msze św. w kaplicy"},
            {segment: S07-p39-s01, cytat: "Na zakończenie żniw urządzane były huczne dożynki."}], pewnosc_odczytu: pewna}
- {id: S07-483, podmiot: cieplinski-ks, relacja: opis, wartosc: "ks. prałat, prefekt Stanisławy Grabińskiej, przyjaciel domu; odprawiał msze w kaplicy w Kościerzynie",
   zrodla: [{segment: S07-p39-s01, cytat: "ks. prałat Cieplinski (prefekt Babci)"}], pewnosc_odczytu: pewna}
- {id: S07-484, podmiot: hilken-ks, relacja: opis, wartosc: "ks. prałat, przyjaciel domu; odprawiał msze w kaplicy w Kościerzynie",
