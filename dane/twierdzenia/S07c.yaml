- {id: S07-468, podmiot: przadzynski-wincenty-1839, relacja: opis, wartosc: "wydział techniczny w Paryżu; majątki Kobierzycko i Kościerzyn; radca Tow. Ziemskiego; bardzo postępowy — w Kobierzycku fabryka sztucznych nawozów (mączki kostnej), młyn parowy, narzędzia rolnicze; firma „Prządzyński i Tryliński” przy ul. Miodowej (senatorowa, jego matka, odwracała się od szyldu)",
   zrodla: [{segment: S07-p34-s02, cytat: "Kończył wydział techniczny w Paryżu miał maj. Kobierzycko i Kościerzyn. Był radcą Tow. Ziemskiego. Był b. postępowy założył w Kobierzycku fabrykę sztucznych nawozów mączki kostnej, młyn parowy. Wytwarzał narzędzia rolnicze. Przy ul. Miodowej firma „Prządzyński i Tryliński”."},
            {segment: S07-p34-s02, cytat: "Dziadzio opowiadał, że gdy Senatorowa matka Wincentego, jechała karetą przez Miodową to odwracała się, aby nie patrzeć na firmę."}], pewnosc_odczytu: pewna}
