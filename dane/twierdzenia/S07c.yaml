- {id: S07-485, podmiot: przadzynski-stanislaw-1871, relacja: udzial_w_wydarzeniu, wartosc: "wysiedleni przez Niemców z Kościerzyna; w Warszawie w swoim domu Nowogrodzka 42 róg Poznańskiej; podczas powstania wywiezieni do obozu w Pruszkowie; dom spalony, po odbudowie zabrany bez odszkodowania", data: {tekst: "1939–1944", od: 1939, do: 1944}, miejsce: pruszkow-oboz,
   zrodla: [{segment: S07-p39-s02, cytat: "Po wkroczeniu Niemców Babcia i Dziadzio byli wysiedleni z Kościerzyna. Mieszkali w W-wie w swoim domu na Nowogrodzkiej 42 róg"},
            {segment: S07-p40-s01, cytat: "Poznańskiej. Podczas Powstania wywiezieni byli do obozu w Pruszkowie. Dom był spalony a po odbudowie zabrany bez odszkodowania."}], pewnosc_odczytu: pewna}
- {id: S07-486, podmiot: grabinska-stanislawa-1890, relacja: udzial_w_wydarzeniu, wartosc: "wysiedlenie z Kościerzyna, Nowogrodzka 42, obóz w Pruszkowie (1944); „nigdy nie narzekali”", data: {tekst: "1939–1944", od: 1939, do: 1944}, miejsce: pruszkow-oboz,
