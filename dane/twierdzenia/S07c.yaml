   zrodla: [{segment: S07-p35-s01, cytat: "Od 1922 r do 1939 był Prezesem Związku Ziemian, który to oddział uważany był za najlepszy w Zarządzie w W-wie[?] Duże zasługi miał w organizowaniu handlu rolniczego. Pracował w Radzie Nadzorczej Syndykatu Rolniczego w Kaliszu później w Sp. Rolniczej Kaliskiej, a po zlikwidowaniu tych jednostek zorganizował sprawnie pracującą do II wojny Spół. Rolniczą w Sieradzu."}], pewnosc_odczytu: pewna}
- {id: S07-474, podmiot: koscierzyn, relacja: opis, wartosc: "gospodarstwo i hodowla na wysokim poziomie: ziarno siewne, buraki cukrowe, kartofle na Śląsk; hodowla koni (ogiery i klacze z Węgier, młodzież sprzedawana na „remontach” wojsku); masło i baranina do Francji i Belgii; tuczone gęsi; wełna do Leszczyna[?] na samodziały i koce",
   zrodla: [{segment: S07-p35-s01, cytat: "W Kościerzynie gospodarstwo rolne i hodowlę postawione były b. wysoko. Produkowano"},
            {segment: S07-p36-s01, cytat: "ziarno siewne, buraki cukrowe, kartofle wysyłane były na Śląsk. Była piękna hodowla koni. Z Węgier sprowadzane były ogiery i klacze rozpłodowe."},
            {segment: S07-p36-s01, cytat: "Masło i baranina wysyłane były do Francji i Belgji. Gęsi (tylko tuczone) sprzedawane były na mięso. Wełna szła do Leszczyna[?] zamie-niana na samodziały i koce."}], pewnosc_odczytu: pewna}
- {id: S07-475, podmiot: przadzynski-stanislaw-1871, relacja: fundacja, obiekt: koscierzyn, wartosc: "nowy dwór ukończony ok. 1916 r. (kanalizacja, centralne ogrzewanie, elektrownia, telefon); dom dla rządcy, czworaki, budynki gospodarcze", data: {tekst: "±1916 r.", od: 1915, do: 1917},
   zrodla: [{segment: S07-p36-s01, cytat: "Nowy dwór skończył Dziadzio budować ±1916 r. Była w nim kanalizacja, centralne ogrzewanie, elektryczność z własnej elektrowni."},
            {segment: S07-p36-s01, cytat: "Dziadzio wybudował też ładny dom dla rządcy,"},
            {segment: S07-p37-s01, cytat: "czworaki dla ordynarjuszy i parę budynków"}], pewnosc_odczytu: pewna}
- {id: S07-476, podmiot: wojciech-centralka, relacja: zawod, wartosc: "obsługiwał centralkę telefoniczną w starym dworze; wcześniej nosił teczkę za senatorem Prządzyńskim do senatu",
   zrodla: [{segment: S07-p36-s01, cytat: "Telefon przeniesiony był ze starego dworu (była tam centralka obsługi-wana przez starego Wojciecha będącego na emeryturze, poprzednio nosił za senatorem Prządzyńskim teczkę do senatu."}], pewnosc_odczytu: pewna}
- {id: S07-477, podmiot: przadzynski-stanislaw-1871, relacja: opis, wartosc: "pracowity, energiczny, wymagający, sprawiedliwy, dbały o pracowników (rzadko odchodzili); dobry organizator — co roku przyjmował praktykantów-studentów rolnictwa",
   zrodla: [{segment: S07-p37-s01, cytat: "Dziadzio był bardzo pracowity, energiczny i wyma-gający od siebie i pracowników o których b. dbał i był sprawiedliwy. Ludzie b. rzadko odchodzili."},
            {segment: S07-p37-s01, cytat: "proszono, aby przyjął praktykantów studjujących rolnictwo."}], pewnosc_odczytu: pewna}
