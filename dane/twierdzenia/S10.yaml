- {id: S10-055, podmiot: niemojowska-powstanka, relacja: udzial_w_wydarzeniu, wartosc: "wg Zimogrodzkiego: kobieta walcząca w polskich szeregach, ocaliła sztandar, wyrwawszy go z rąk śmiertelnie rannego kosyniera", miejsce: radoszewice, data: {tekst: "1863", od: 1863, do: 1863},
   zrodla: [{segment: S10-p5-s03, cytat: "Pod Radoszewicami kobieta, walcząca w polskich szeregach, Niemojowska, ocaliła sztandar powstańczy, wyrwawszy go z rąk śmiertelnie ranio-nego kosyniera."}], pewnosc_odczytu: pewna, uwagi: "„Zimogrodzkiego” — odczyt prawdopodobny."}
- {id: S10-056, podmiot: niemojowska-powstanka, relacja: udzial_w_wydarzeniu, wartosc: "wg Bruchnalskiej: odznaczyła się w bitwie Cieszkowskiego z Rosjanami pod Radoszewicami; udała się do obozu z prowiantem, opatrunkami, może bronią złożoną w jej dworze; w ogniu uratowała sztandar z rąk śmiertelnie rannego kosyniera", miejsce: radoszewice, data: {tekst: "27.III. 1863 r.", od: 1863-03-27, do: 1863-03-27},
   zrodla: [{segment: S10-p5-s04, cytat: "W bitwie stoczonej przez Cieszkowskiego z Rosjana-mi w ziemi Kaliskiej, pod Radoszewicami (27.III. 1863 r.) odznaczyła się pani Niemojowska."}, {segment: S10-p6-s01, cytat: "Musiała udać się do obozu dla dostarczenia prowiantów, opatrunków, a może i broni, poprzednio w jej dworze złożonej."}, {segment: S10-p6-s01, cytat: "ratując z rąk śmiertelnie ranionego kosyniera, sztandar polski, który moskal chciał unieść."}], pewnosc_odczytu: pewna,
   uwagi: "Za: Maria Bruchnalska, „Miejsce Piastowe” 1934, s. 221."}
- {id: S10-057, podmiot: niemojowska-powstanka, relacja: wlasnosc, obiekt: radoszewice, wartosc: "bitwa „odbywała się w jej majątku” (wg Bruchnalskiej)",
   zrodla: [{segment: S10-p6-s01, cytat: "Bitwa, wśród której się znalazła w obozie, odby-wała się w jej majątku."}], pewnosc_odczytu: pewna,
