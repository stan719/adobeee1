- {id: S10-053, podmiot: cieszkowski-1863, relacja: udzial_w_wydarzeniu, wartosc: "zaatakowany pod Radoszewicami przez wielokrotnie silniejszego nieprzyjaciela cofał się 11 km w zwartym szyku, pod Kiełczygłowem przeszedł do przeciwnatarcia i zmusił Rosjan do odwrotu", miejsce: radoszewice, data: {tekst: "27.III.1863", od: 1863-03-27, do: 1863-03-27},
   zrodla: [{segment: S10-p5-s03, cytat: "pod wsią Radoszewicami (w pobliżu Wielu-nia), Cieszkowski cofał się zwolna w zwartym szyku na przestrzeni 11 km, wreszcie pod wsią Kiełczygłowem, sformował się do przeciwataku"}], pewnosc_odczytu: pewna,
   uwagi: "Za: J. Zimogrodzki, „Województwo Kaliskie w walce w roku 1863 i 1864”, s. 10; data z S10-p5-s04."}
- {id: S10-054, podmiot: kielczyglow, relacja: opis, wartosc: "miejsce kontrataku oddziału Cieszkowskiego po bitwie pod Radoszewicami (1863)",
