- {id: S10-058, podmiot: niemojowska-powstanka, relacja: opis, wartosc: "jej sława dotarła za granicę: w 1864 r. Polki w Dreźnie nosiły paski z jej wizerunkiem na klamrze i błędnym napisem Mme „Niemojewska”", miejsce: drezno, data: {tekst: "W 1864 r.", od: 1864, do: 1864},
