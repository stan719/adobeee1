# --- s. 7–8: dwór (pałacyk)
- {id: S10-070, podmiot: radoszewice-dwor, relacja: opis, wartosc: "po wyzwoleniu w 1945 r. parcelacja majątku; pałac zamieniono na szkołę podstawową, która mieści się w nim nadal (1978)", data: {tekst: "w 1945 r.", od: 1945, do: 1978},
   zrodla: [{segment: S10-p7-s01, cytat: "Po wyzwoleniu w 1945 r. nastąpiła parcelacja majątku. Pałac podworski zamieniono na szkołę podstawową. W budynku tym mieści się szkoła do chwili obecnej."}], pewnosc_odczytu: pewna}
- {id: S10-071, podmiot: radoszewice-dwor, relacja: opis, wartosc: "budynek z XVIII w., styl klasycystyczny",
   zrodla: [{segment: S10-p7-s01, cytat: "Budynek pochodzi z XVIII w., styl klasycyzmu."}], pewnosc_odczytu: pewna,
   uwagi: "Na s. 8 autor pisze, że pałacyk wybudowali Niemojowscy (S10-075) — nie łączy obu informacji."}
- {id: S10-072, podmiot: radoszewice-dwor, relacja: opis, wartosc: "od północy podpiwniczony; w środku ogromna wędzarnia; grube ściany z czerwonej cegły dużego formatu, od wewnątrz wykładane belkami; dach z gontu (obecnie pokryty papą); ściany wewnętrzne wielokrotnie przerabiane na potrzeby szkoły; bez większych zmian zachowała się główna sala środkowa",
   zrodla: [{segment: S10-p7-s01, cytat: "Od strony północnej jest podpiwniczony. W środku budynku znajduje się ogromna wędzarnia."}, {segment: S10-p7-s01, cytat: "są mu-rowane z czerwonej cegły dużego formatu, od stro-ny wewnętrznej wykładane belkami drewnianymi. Dach kryty gontami (obecnie na gonty nałożono papę)."}, {segment: S10-p7-s01, cytat: "Zachowała się bez większych zmian główna sala środkowa."}], pewnosc_odczytu: pewna}
- {id: S10-073, podmiot: radoszewice-dwor, relacja: opis, wartosc: "stan w 1978 r.: szybko się pogarsza z powodu ciasnoty (ponad 240 uczniów) i braku remontu — odpadają tynki, zachodni balkon żelazny w opłakanym stanie, duże schody od zachodu się rozsypują, słabe podłogi na piętrze", data: {tekst: "1978", od: 1978, do: 1978},
   zrodla: [{segment: S10-p7-s01, cytat: "szkoła posiada ponad 240 uczniów a nikt nie zabrał się do tej pory solidnie do remontu."}, {segment: S10-p7-s01, cytat: "balkon żelazny od strony zachod-niej w opłakanym stanie, duże schody od strony zachodniej rozsypują się, na piętrze bardzo słabe podłogi."}], pewnosc_odczytu: pewna}
- {id: S10-074, podmiot: radoszewice-dwor, relacja: opis, wartosc: "postulat autora: zbudować nową szkołę, a pałacyk po remoncie oddać społeczeństwu lub szkole do innych celów",
   zrodla: [{segment: S10-p7-s01, cytat: "aby wła-dze szkolne wybudowały budynek szkolny nowy, a pałacyk po wyremontowaniu oddać społeczeństwu czy szkole do innych celów."}], pewnosc_odczytu: pewna}
- {id: S10-075, podmiot: radoszewice-dwor, relacja: opis, wartosc: "pałacyk wybudowany przez Niemojowskich; zdjęcie nr 3 — pałacyk (szkoła) od frontu",
   zrodla: [{segment: S10-p8-s01, cytat: "Zdjęcie nr 3 – Pałacyk, obecnie szkoła, od strony frontowej Pałacyk jest wybudowany przez Niemojowskich."}], pewnosc_odczytu: pewna, uwagi: "Por. S10-071 (XVIII w.)."}

# --- s. 8–9: park
- {id: S10-076, podmiot: radoszewice-park, relacja: opis, wartosc: "duży park wokół pałacyku z dwóch części: starej i młodej; stara część (od północy i zachodu) była otoczona murem jeszcze po wyzwoleniu; zaraz po wyzwoleniu rozebrano stodoły, obory, inne zabudowania i mur",
   zrodla: [{segment: S10-p8-s02, cytat: "Wokół pałacyku rozprzestrzeniał się duży park składający się z dwu części: starego parku i młodego parku."}, {segment: S10-p8-s02, cytat: "Ale zaraz po wyzwoleniu rozebrano stodoły, obory i inne zabudowania oraz mur otaczający park."}], pewnosc_odczytu: pewna}
- {id: S10-077, podmiot: radoszewice-park, relacja: opis, wartosc: "w latach 50. XX w. zaczęły usychać stare drzewa (głównie wiązy); usunięto drzewa starego parku od szkoły aż do kościoła i plebanii (tak daleko sięgał park); przez park przeprowadzono szosę; część gruntu oddano księdzu w zamian za pole wzięte pod budowę „kuchty[?] sprzętowej”; ze starego parku został fragment", data: {tekst: "W latach 50-tych", od: 1950, do: 1959},
   zrodla: [{segment: S10-p8-s02, cytat: "W latach 50-tych bieżącego stulecia zaczęły wysychać niektóre gatunki starych drzew; głównie wiąz."}, {segment: S10-p8-s02, cytat: "aż do kościoła i plebanii (park tak daleko sięgał)"}, {segment: S10-p8-s02, cytat: "wybudowania kuchty[?] sprzętowej. Po latach 50-tych został tylko fragment starego parku."}], pewnosc_odczytu: niepewna,
   uwagi: "„kuchty” — wyraz niejasny (może „bazy sprzętowej”/„kuźni”)."}
- {id: S10-078, podmiot: radoszewice-park, relacja: opis, wartosc: "fotografia nr 4 — fragment starego parku; fotografia nr 5 — kwitnące zawilce (zdjęć nie sfotografowano)",
   zrodla: [{segment: S10-p8-s03, cytat: "Fotografia nr 4 – Fragment starego parku."}, {segment: S10-p8-s05, cytat: "Fotografia nr 5 – Kwitnące zawilce."}], pewnosc_odczytu: pewna}
- {id: S10-079, podmiot: radoszewice-park, relacja: opis, wartosc: "młodsza część parku na południe od budynku, ok. 0,70 ha; grab, wiąz, świerk, osika, lipa, kasztanowiec, kilka starych tui; ok. 60% drzewostanu to leszczyna, wiosną kwitną zawilce; winniczki, kilka okazałych lip",
   zrodla: [{segment: S10-p8-s04, cytat: "Powierzchnia wynosi ok. 0,70 ha. Do głównych gatun-ków drzew należą: grab, wiąz, świerk, osika, lipa, kasztanowiec; jest kilka okazów starej tui (żywotnik). W ok. 60% drzewostanu stanowi leszczyna."}, {segment: S10-p8-s04, cytat: "zwarcie łączący się"}, {segment: S10-p8-s06, cytat: "W parku spotyka się ślimaka winniczka. Znajdujemy kilka okazów wspaniałych lip."}], pewnosc_odczytu: niepewna,
