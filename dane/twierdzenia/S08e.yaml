   zrodla: [{segment: S08-p149-s03, cytat: "córki ostatniego właściciela Ksawerego Franciszka"}], pewnosc_odczytu: pewna}
- {id: S08-180, podmiot: siemkowice, relacja: opis, wartosc: "1882: majątek Karśnickich — Siemkowice i folwarki Kleszczowice, Miedzno, Łukomierz, osady młyńskie Łukomierz, Kij, Jarzęb, Papierek; razem 3439 mórg; w samych Siemkowicach 647 mórg gruntów, 185 łąk, 87 pastwisk, 1331 lasu, 106 nieużytków, 6 budynków murowanych i 14 drewnianych; inwentarz Siemkowic, Chorzewa, Wręczycy i Dylowa po śmierci Jana i Delfiny z Załuskich (księga notarialna F. Lisieckiego 1815, archiwum w Sieradzu)", data: {tekst: "w 1882 r.", od: 1882, do: 1882},
   zrodla: [{segment: S08-p145-s01, cytat: "W końcu XIX w. (w 1882 r.) majątek Karśnickich składał się z Siemkowic i okolicznych folwarków: Kleszczowic, Miedzno i Łukomierz oraz osad młyńskich: Łukomierz, Kij, Jarzęb i Papierek; obejmując łącznie 3439 mórg."}, {segment: S08-p145-f24, cytat: "inwentarz tej wsi (a także Chorzewa, Wręczycy i Dylowa) zawierający podziały dokonane po śmierci Jana i Delfiny z Załuskich przechowywany w księdze notarialnej F. Lisieckiego z 1815 r. w archiwum w Sieradzu."}], pewnosc_odczytu: pewna}
- {id: S08-181, podmiot: siemkowice-dwor, relacja: opis, wartosc: "zniszczony w czasie wojny, w ruinie; remont 1951–1953 przywrócił budynek do stanu mieszkalnego (usunięto XIX-wieczne dobudówki, nowy drewniany most przez fosę); potem do dyspozycji Urzędu Gminy, po 1974 r. Gminny Ośrodek Kultury (aktywny koniec lat 70. – pocz. 80.); obecnie przyszłość nierozstrzygnięta", data: {tekst: "1951–1953", od: 1951, do: 1991},
   zrodla: [{segment: S08-p145-s02, cytat: "Po usunięciu Karśnickich dwór, zniszczony w trakcie wojny, pozostawał w ruinie24, remont przeprowadzony w latach 1951–1953 przywrócił budynek do stanu mieszkalnego."}, {segment: S08-p145-s02, cytat: "Po pracach badawczych, przeprowadzonych w 1974 r., zajęty został przez Gminny Ośrodek Kultury"}], pewnosc_odczytu: pewna}
- {id: S08-182, podmiot: siemkowice-kopiec-laki, relacja: opis, wartosc: "pierwsza siedziba: drewniany obronny dwór na kopcu w łąkach ok. 200 m na NW od dworu (materiały J. Kamińskiej, 1955); kopiec zniwelowany, rozwieziony ok. 1971; tradycja o „tunelu” do „zamku”; powstał w 2 poł. XIII lub na przełomie XIII/XIV w., opuszczony w końcu 1 poł. XV w. przy podziale włości na siemkowicką i radoszewicką", data: {tekst: "2 poł. XIII – 1 poł. XV w.", od: 1250, do: 1450},
   zrodla: [{segment: S08-p145-s03, cytat: "Dlatego też zebrane tu dane będą rodzajem autorskiej wizji, zawierającej poglądy autora na ten temat."}, {segment: S08-p145-s04, cytat: "w łąkach odległych o około 200 m na północny zachód od dworu, znajdował się kopiec ziemny, będący pozostałością po drewnianym obronnym dworze."}, {segment: S08-p146-s01, cytat: "relikt został w międzyczasie całkowicie rozwieziony (prawdopodobnie w 1971 r.)"}, {segment: S08-p146-s01, cytat: "zachowała się jeszcze wiadomość o „tunelu” wiodącym od kopca do „zamku”"}, {segment: S08-p146-s01, cytat: "Prawdopodobnie założenie w łąkach powstać mogło w 2 połowie XIII lub na przełomie XIII i XIV w., a zostało opuszczone w końcu 1 połowy XV w. w związku z podziałem włości siemkowickiej na część siemkowicką i radoszewicką"}], pewnosc_odczytu: pewna}
- {id: S08-183, podmiot: radoszewski-stogniew-1467, relacja: fundacja, obiekt: siemkowice-dwor, wartosc: "hipotetycznie fundator „kamieńca” (lata 1441–1456?): kamienny dwór na usypanym kopcu z fosą, plan 9,8×10,2 m, ok. 10 m wys., trzy kondygnacje, mury do 2 m, dach namiotowy; jego wnętrze (6,5×6,8 m) to dzisiejsza izba IV (NW część budynku)", data: {tekst: "lata 1441–1456 ?", od: 1441, do: 1456},
   zrodla: [{segment: S08-p146-s02, cytat: "Był to budynek fundowany na planie zbliżonym do kwadratu (9,8 × 10,2 m), prawdopodobnie trzykondygnacyjny"}, {segment: S08-p146-s02, cytat: "Fundację obiektu przypisano hipotetycznie Stoigniewowi z Sie-mkowic, synowi Imbrama, a chronologia wzniesienia (lata 1441–1456 ?)"}, {segment: S08-p146-s02, cytat: "a jego wnętrze (o wymiarach 6,5 × 6,8 m) to obecnie izba IV."}], pewnosc_odczytu: pewna}
- {id: S08-184, podmiot: siemkowski-jan-1563, relacja: wlasnosc, obiekt: siemkowice-dwor, wartosc: "przy dziale Siemkowic w 1563 r. dostał „zameczek z przykopem i sadzawką”; zapewne skarbnik sieradzki i poborca podatkowy", data: {tekst: "1563 r.", od: 1563, do: 1563},
   zrodla: [{segment: S08-p146-s03, cytat: "podział Siemkowic z 1563 r., w którym odnotowano, że Janowi Siemkows-kiemu dostał się „zameczek z przykopem i sadzawką, przykopowi należącą”"}, {segment: S08-p146-s03, cytat: "Wymieniony w tym przekazie Jan to zapewne skarbnik sieradzki i poborca"}, {segment: S08-p147-s01, cytat: "podatkowy, znany przez heraldyków"}], pewnosc_odczytu: pewna}
- {id: S08-185, podmiot: siemkowska-matka-bielskiego, relacja: opis, wartosc: "z Siemkowic pochodziła matka Joachima Bielskiego, „Siemkowska herbu Oxe” (wg kroniki Marcina Bielskiego)",
   zrodla: [{segment: S08-p146-s03, cytat: "A ztamtąd była matka Joachima Bielskiego, Siemkowska herbu Oxe...”"}], pewnosc_odczytu: pewna}
- {id: S08-186, podmiot: siemkowski-jerzy-1564, relacja: fundacja, obiekt: siemkowice-dwor, wartosc: "prawdopodobnie ok. 1550–1560 rozbudował „kamieniec” do dużego renesansowego dworu (17,3×18,6 m, trzy kondygnacje, krzyżowy podział, izby I–IV na parterze, na piętrze dwie izby i sala ok. 7,8×14,5 m z 7–8 oknami, kamieniarka renesansowa, wys. ok. 10 m, dach gontowy) — w epoce zwany „zamkiem” (1589)", data: {tekst: "około 1550–1560", od: 1550, do: 1560},
   zrodla: [{segment: S08-p147-s01, cytat: "Obecność „zamku” odnotowano także w regestrze spisanym w 1589 r. przy odbieraniu siedziby od Boguckiego"}, {segment: S08-p147-s01, cytat: "Prawdopodobnie renesansowa murowana siedziba dworska w Siemkowicach powstała z inicjatywy Jerzego Siemkowskiego (†1564), znanego z omówionej już płyty nagrobnej, w latach około 1550–1560."}, {segment: S08-p147-s02, cytat: "Powstała trzykondygnacjowa budowla (17,3 × 18,6 m) o krzyżowym podziale wnętrza"}, {segment: S08-p147-s03, cytat: "Jak na lata około połowy XVI w. dwór w Siemkowicach, posiadający 6 dużych izb i niemal „pałacową” salę, był obiektem bardzo obszernym"}], pewnosc_odczytu: pewna}
- {id: S08-187, podmiot: siemkowski-jerzy-1564, relacja: smierc, data: {tekst: "1564 r.", od: 1564, do: 1564},
