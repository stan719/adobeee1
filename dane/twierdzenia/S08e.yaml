- {id: S08-190, podmiot: siemkowice-dwor, relacja: opis, wartosc: "faza z końca XVII w. (Święciccy, 1692): wymiana stropów, dobudowa ceglanego narożnego alkierza 6,8×7,8 m (sklepienie kolebkowe z lunetami w przyziemiu), może barokowe obramienie wejścia, zapewne łamany dach polski; fazy do ok. 1800: drewniany dwór w łąkach, kamieniec, dwór renesansowy, przebudowa Święcickich",
   zrodla: [{segment: S08-p147-s04, cytat: "którą hipotetycznie datować można na koniec XVII w. i łączyć z przejściem dworu od Siemkowskich do Święcickich. Data 1692 wyryta na sosrębie w izbie II jest jedynym elementem datującym"}, {segment: S08-p148-s01, cytat: "Alkierz, wzniesiony z cegły w wątku blokowym-kowadełkowym, ma wymiary 6,8 × 7,8 m"}, {segment: S08-p148-s02, cytat: "Przebudowa Święcickich z końca XVII w. polegała głównie na dostosowaniu starego dworu do wymagań epoki (wzniesienie narożnego alkierza) i na remoncie budynku."}], pewnosc_odczytu: pewna}
- {id: S08-191, podmiot: siemkowice-dwor, relacja: opis, wartosc: "faza Karśnickich: ok. 1850 pożar; dwór obniżono do jednej kondygnacji (4 duże izby), alkierz podwyższono w wieżę z neogotyckim krenelażem; dwie dobudówki (pokoje służby; kuchnia); poza kopcem klasycyzujące oficyny i rządcówka; bruk wokół dworu; remont 1951–1953 rozebrał dobudówki, obniżył wieżę do alkierza, odsłonił kamienny wątek XV w., nowe podłogi, stropy i więźba; GOK wydzielił ściankami pokoje w alkierzu", data: {tekst: "około 1850 r.; 1951–1953", od: 1850, do: 1953},
   zrodla: [{segment: S08-p148-s03, cytat: "W tradycji tej rodziny zachowała się wiado-mość, że około 1850 r. dwór uległ spaleniu."}, {segment: S08-p148-s03, cytat: "zaś wieża uzyskała zwieńczenie neogotyckim krenelażem."}, {segment: S08-p149-s01, cytat: "Wtedy też poza kopcem powstały klasycyzujące w formie budynki: oficyny i rządcówki"}, {segment: S08-p149-s02, cytat: "Rozebrano więc obie dobudówki „psujące bryłę”, a zwieńczoną neogotyckim krenelażem wieżę obniżono znów do formy alkierza."}, {segment: S08-p149-s02, cytat: "oprócz wydzielenia prowizorycznymi ściankami izb w alkierzu"}], pewnosc_odczytu: pewna}
