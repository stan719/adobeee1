# S08 cz. 5: L. Kajzer, „Siemkowice — dwory”, s. 139–152

- {id: S08-167, podmiot: siemkowice, relacja: opis, wartosc: "duża wielodrożna wieś między Wieluniem a Pajęcznem; do rozbiorów na południowym skraju pow. i woj. sieradzkiego (bywa niesłusznie łączona z ziemią wieluńską); potem gubernia kaliska, w końcu XIX w. wieś gminna i parafialna pow. wieluńskiego; po wojnie woj. łódzkie, pow. pajęczański (od 1956); obecnie siedziba gminy w woj. sieradzkim; nazwa patronimiczna od „Siemek” (S. Rospond)",
   zrodla: [{segment: S08-p139-s01, cytat: "SIEMKOWICE — DWORY"}, {segment: S08-p139-s02, cytat: "1. Informacje wstępne i stan badań. 2. Dzieje wsi i jej właścicieli. 3. Przemiany dworów. 4. Siemkowice za Karśnickich."}, {segment: S08-p139-s03, cytat: "Siemkowice to duża wielodrożna wieś, stanowiąca ważny lokalny węzeł komunikacyjny, położona jest między Wieluniem a Pajęcznem"}, {segment: S08-p139-s04, cytat: "Zdaniem S. Rosponda wieś ma bez wątpienia charakter patronimiczny, pochodzący od nazwy osobowej „Siemek” lub „potom-ków Siemka”"}, {segment: S08-p141-s02, cytat: "gdyż powiat pajęczański powstał dopiero w 1956 r."}], pewnosc_odczytu: pewna}
- {id: S08-168, podmiot: siemkowice-kosciol, relacja: opis, wartosc: "murowany kościół pw. św. Marcina, najstarsza część (późnogotycka ośmioboczna wieża) z przełomu XV/XVI w.; płyty nagrobne Jerzego Siemkowskiego (†1564, pełna postać rycerza z herbami, niezbyt wysokiego poziomu) i Zofii Boguckiej (†1587)",
   zrodla: [{segment: S08-p139-s04, cytat: "We wsi znajduje się murowany kościół pod wezwaniem św. Marcina którego najstarsze partie (późnogotycka ośmioboczna wieża) sięgają chyba przełomu XV i XVI w."}, {segment: S08-p144-s01, cytat: "płyta nagrobna Jerzego Siemikowskiego (Siemkowskiego), zmar-łego w 1564 r., z pełną postacią stojącego rycerza i przedstawieniami heraldycz-nymi"}, {segment: S08-p144-s01, cytat: "W kościele zachowała się także inna płyta nagrobkowa — Zofii Boguckiej (†1587)"}], pewnosc_odczytu: pewna}
- {id: S08-169, podmiot: siemkowice-dwor, relacja: opis, wartosc: "zespół dworski na NW skraju wsi, ok. 100 m na zachód od drogi do Radoszewic i Osjakowa; „zameczek” — od dawna obiekt zainteresowania badaczy: M. Bielski (koniec XVI w.), M. Walicki (szesnastowieczny, otoczony wodą, obniżony o kondygnację), Katalog Zabytków (dwór obronny z XVII w. na miejscu XVI-wiecznego), A. Miłobędzki (1692), remont 1951–1953 z inicjatywy Z. Cieklińskiego, M. Pracuta (1972), badania 1974 (M. Głosek, L. Kajzer), T. Jakimowicz (1979), Kajzer i Augustyniak (1986); w latach 50. J. Kamińska zidentyfikowała „kopiec w łąkach”; plany, rzuty i rzut z okresu międzywojennego — kreśliły Maria Cyrek i Anna Marciniak-Kajzer",
   zrodla: [{segment: S08-p139-s04, cytat: "Zespół dworski znajduje się na północno-zachodnim skraju zabudowy wiejskiej, w odległości około 100 m na zachód od drogi wiodącej do pobliskich Radoszewic i dalej Osjakowa."}, {segment: S08-p139-s05, cytat: "Istniejący „zameczek” — murowany dwór posiada sporą literaturę i od dawna interesował badaczy."}, {segment: S08-p141-s02, cytat: "który podał o obiekcie trzy prawdziwe informacje: iż jest szesnastowieczny, otoczony wodą i obniżony o górną kondygnację."}, {segment: S08-p141-s02, cytat: "jako XVII-wieczny (pochodzący z 1692 r.) określił go A. Miłobędzki"}, {segment: S08-p142-s02, cytat: "zidentyfikowała wtedy jeszcze zachowane relikty starszej od dworu murowanego siedziby pańskiej, rysujące się jako „kopiec w łąkach”."}, {segment: S08-p143-s02, cytat: "Najistotniejsze znaczenie dla uformowania jego obecnie zachowanej bryły miały wspomniane już prace remontowe przeprowadzone w latach 1951–1953"}, {segment: S08-p140-s01, cytat: "Siemkowice. Plan sytuacyjny. Kreśliły Maria Cyrek i Anna Marciniak-Kajzer"}, {segment: S08-p141-s01, cytat: "Siemkowice. Wyspa z dworem i wyko-pami badawczymi z 1974 r."}, {segment: S08-p142-s01, cytat: "Siemkowice. Dwór — rzuty piwnic, parteru i pod-dasza, stan współczesny."}, {segment: S08-p142-f11, cytat: "Materiały przechowywane w magazynach Muzeum Archeologicznego i Etnograficznego w Łodzi pod nr inw. IV b/1955/3."}], pewnosc_odczytu: pewna}
- {id: S08-170, podmiot: wrszowiec-jan, relacja: opis, wartosc: "wg Kosmasa po zabójstwie księcia praskiego Świętopełka Wrszowcy uciekli do Polski i dostali od Krzywoustego nadania; śladem mogą być nazwiska Warsz i Męcina (Mutina) w XIII w. (np. u Rawiczów); M. Bielski pisze o „Czystesie Wierszowicu” (Jan syn Czesty) jako fundatorze „zameczku” w Siemkowicach „między wodą i lasy”; legendę Kajzer uważa za bardzo prawdopodobną, choć bez bezpośredniego potwierdzenia",
   zrodla: [{segment: S08-p143-s03, cytat: "po zamordowaniu księcia praskiego Świętopełka rodzina Wrszowców, która współdziałała w zabójstwie, uciekła do Polski i została obdarzona znacznymi nadaniami „które ród [...] do dziś posiada” przez Bolesława Krzywoustego"}, {segment: S08-p143-s03, cytat: "śladem pobytu potomków Wrszowców w Polsce mogą być nazwiska Warsz i Męcina (Mutina), spotykane w XIII w., np. w rodzinie Rawiczów."}, {segment: S08-p144-s01, cytat: "w Siemkowicach wspomina natomiast M. Bielski14. Legendę heraldyczną o osiedleniu się w Siemkowicach przedstawicieli rodu czeskich Wrszowców już na początku XII w. traktować należy jako bardzo prawdopodobną"}, {segment: S08-p146-s03, cytat: "„tenże (Czystes Wierszowic, czyli Jan syn Czesty z rodu Wrszowców, zabójca księcia czeskiego) w tych Siemkowicach zameczek, onych czasów dość mocny, między wodą i lasy zbudował."}, {segment: S08-p139-s04, cytat: "Siemkowice wraz z sąsiednimi Radoszewicami związane są tradycją sięgającą osiedlenia się na początku XII w. potomków rodu czeskich Wrszowców."}, {segment: S08-p139-s05, cytat: "a sporządzający go Marcin Bielski, sąsiad z pobliskiej Białej, może uchodzić za osobę znającą realia siemkowickie"}], pewnosc_odczytu: pewna}
- {id: S08-171, podmiot: siemkowice, relacja: opis, wartosc: "pierwsze wzmianki 1401 i 1403; w późnym średniowieczu ośrodek klucza: Chorzów (dziś Chorzew), Wręczyca, Broszęcin, Zielęcin, Bogumiłowice; pierwszy znany posiadacz Imram-Imbram (1412, 1413); przed poł. XVI w. Siemkowscy stracili Zielęcin i Bogumiłowice, nabyli Stróżę; majątek średnio duży, właściciele na lokalnych urzędach; największa prosperity Siemkowskich w XVI i 1 poł. XVII w.", data: {tekst: "1401", od: 1401, do: 1650},
   zrodla: [{segment: S08-p144-s01, cytat: "Pojawia się ona w źródłach pisanych dopiero w 1401 r., a następnie w 1403 r."}, {segment: S08-p144-s01, cytat: "Chorzów (obecnie Chorzew, znany jako duża stacja kolejowa na tzw. magistrali węglowej), Wręczyca, Broszęcin, Zielęcin i Bogumiłowice"}, {segment: S08-p144-s01, cytat: "Pierwszy dowodnie znany z imienia posiadacz klucza siemkowickiego to Imram-Imbram, wymieniany w dokumentach z lat 1412 i 1413"}, {segment: S08-p144-s01, cytat: "Przed połową XVI w. Siemkowscy utracili Zielęcin i Bogumiłowice, nabyli natomiast Strożę"}, {segment: S08-p144-s01, cytat: "Wydaje się, że okresem największej prosperity Siemkowskich był wiek XVI i 1 połowa wieku XVII."}], pewnosc_odczytu: pewna}
- {id: S08-172, podmiot: radoszewski-imbram-1412, relacja: wlasnosc, obiekt: siemkowice, wartosc: "pierwszy znany z imienia posiadacz klucza siemkowickiego", data: {tekst: "1412 i 1413", od: 1412, do: 1413},
   zrodla: [{segment: S08-p144-s01, cytat: "Pierwszy dowodnie znany z imienia posiadacz klucza siemkowickiego to Imram-Imbram"}], pewnosc_odczytu: pewna}
- {id: S08-173, podmiot: siemkowice-dwor, relacja: opis, wartosc: "w końcu XVI w. krótko mieszkali we dworze Boguccy (1589 — spis odebrania od nieznanego z imienia Boguckiego, z ruchomościami); Siemkowscy opuścili Siemkowice zapewne w końcu XVII w. (tradycja: do końca XVIII w. — prawdziwa dla Radoszewic, nie dla Siemkowic); włość przeszła do Święcickich h. Jastrzębiec (data 1692 wyryta na sosrębie w izbie II); Święciccy ok. 100 lat; ok. 1800 Karśniccy z przydomkiem Fundament h. Jastrzębiec (kolator 1797 Franciszek Święcicki, 1802 Jacek Fundament Karśnicki); Karśniccy do 1945", data: {tekst: "1589; 1692; 1797–1802", od: 1589, do: 1945},
   zrodla: [{segment: S08-p144-s01, cytat: "Rodzina ta w końcu XVI w. krótko zamieszkiwała we dworze w Siemkowicach"}, {segment: S08-p144-f21, cytat: "gdzie wykonany w 1589 r. spis odebrania w Siemkowicach wraz z licznymi ruchomościami od nieznanego z imienia Boguckiego."}, {segment: S08-p144-s01, cytat: "Sądzić należy, że opuścili oni Siemkowice już w końcu XVII w. i wtedy włość wraz z rezydencją przeszła do Święcickich, herbu Jastrzębiec."}, {segment: S08-p144-s01, cytat: "jest rok 1692 (zapewne związany z remontem budynku) wyryty na belce sosrębu w drugiej izbie parteru"}, {segment: S08-p144-f22, cytat: "Oglądany w 1974 r."}, {segment: S08-p144-s01, cytat: "Święciccy utrzymali się w Siemkowicach około 100 lat"}, {segment: S08-p145-s01, cytat: "w roku 1797 jako kolator występował Franciszek Święcicki, a w 1802 r. Jacek Fundament Karśnicki23. W ręku rodziny Karśnickich wieś i włość pozostawały do 1945 r."}], pewnosc_odczytu: pewna}
- {id: S08-174, podmiot: swiecicki-franciszek-1797, relacja: opis, wartosc: "kolator kościoła w Siemkowicach w 1797 r.", miejsce: siemkowice, data: {tekst: "1797", od: 1797, do: 1797},
   zrodla: [{segment: S08-p145-s01, cytat: "w roku 1797 jako kolator występował Franciszek Święcicki"}], pewnosc_odczytu: pewna}
