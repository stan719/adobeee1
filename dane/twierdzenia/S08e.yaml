- {id: S08-200, podmiot: siemkowice-dwor, relacja: opis, wartosc: "układ międzywojenny: wejście z zadaszonego ganku w ścianie południowej; 1 hall, 2 spiżarnia, 3 kredens, 4 buduar, 5 sypialnia, 6 salon (wnętrze XV-wiecznej kamienicy), 7 jadalnia, 8 pokój basztowy (bilardowy, biblioteka) w alkierzu, 9 kuchnia, 10–11 pokój pokojówki i garderobianej, przedsionek; ściany bielone, boazeria w basztowym, adamaszek w kąciku brydżowym, parkiety, piece z kolorowych kafli",
   zrodla: [{segment: S08-p143-s01, cytat: "Siemkowice. Dwór — rzut z okresu międzywojennego z określeniem funkcji pomieszczeń. 1 hall, 2 spiżar-nia, 3 kredens, 4 buduar, 5 sypialnia, 6 salon, 7 jadalnia, 8 pokój bilar-dowy-biblioteka, 9 kuchnia, 10 po-kój gospodarczy i pokojówki, 11 przedsionek."}, {segment: S08-p149-s04, cytat: "Podziały wnętrz w okresie międzywojen-nym były inne."}, {segment: S08-p150-s01, cytat: "W partii północnej, tak jak dziś, były dwa duże pomieszczenia: północno-zachodnie (wnętrze XV-wiecznej kamienicy) pełniące funkcję salonu (6)"}, {segment: S08-p150-s02, cytat: "Alkierz to dawny tzw. pokój basztowy (8), zwany też bilardowym lub bibliotecznym."}, {segment: S08-p150-s03, cytat: "Ogrzewano je piecami z ozdobnych, wytłaczanych kolorowych kafli"}], pewnosc_odczytu: pewna}
- {id: S08-201, podmiot: siemkowice-dwor, relacja: opis, wartosc: "wyposażenie (Karśniccy): salon — kanapa i empirowe fotele w adamaszku, palisandrowy stolik karciany, fortepian Steinway, 12 dużych obrazów alegorycznych „w manierze Rubensa” („sybille”, zaginione); jadalnia — gdańskie stół i zydle, meble w skórze jeleniej, portrety rodzinne XVII–XIX w. (m.in. mężczyzna w kirysie z buzdyganem, sygn. „Martin Ramela pinx. AD 1757 9 Martij”; kilka obrazów w Muzeum Sztuki w Łodzi — rewindykacja), militaria XVII–XVIII w., rzędy końskie, buńczuki tureckie (wiązane z Wiedniem 1683), ryngraf na tureckiej tkaninie; srebra z herbami Jastrzębiec i Samson, porcelana chińska, korzecka, Rosenthal; sekretarzyk Ludwik Filip",
   zrodla: [{segment: S08-p150-s04, cytat: "Wyposażenia dopełniał fortepian firmy „Steinway”."}, {segment: S08-p150-s04, cytat: "Alegorie te, zwane w tradycji rodzinnej „sybillami”, zaginęły"}, {segment: S08-p150-s04, cytat: "sygnaturą „Martin Ramela pinx. AD 1757 9 Martij”. Kilka obrazów z jadalni w Siemkowicach znajduje się obecnie w Muzeum Sztuki w Łodzi"}, {segment: S08-p150-s04, cytat: "tureckie buńczuki, łączone tradycyjnie z wyprawą wiedeńską 1683 r."}, {segment: S08-p151-s01, cytat: "W sypialni, z ciekawszego wyposażenia znajdował się sekretarzyk w stylu Ludwika Filipa."}], pewnosc_odczytu: pewna}
- {id: S08-202, podmiot: siemkowice-dwor, relacja: opis, wartosc: "biblioteka w pokoju basztowym: ponad 10 tys. tomów i roczników czasopism („Merkuryusz Polski Ordynaryjny”, „Kłosy”, „Revue des Revues”), oprawy skórzane, pieczęcie (bez ekslibrisu), najstarsze z XVII w., białe kruki (Śniadeccy, wczesne wydania Mickiewicza); babka Zofia wypożyczała wsi Kraszewskiego, Prusa, Sienkiewicza; trofea myśliwskie, lampy; dokumenty rodzinne w kasie pancernej — zaginęły",
   zrodla: [{segment: S08-p151-s02, cytat: "mieściło się ponad 10 tysięcy tomów książek i oprawnych roczników czasopism"}, {segment: S08-p151-s02, cytat: "babka Zofia zwyczajowo wypożyczała mieszkańcom wsi klasykę polską — książki Kraszewskiego, Prusa, Sienkiewicza"}, {segment: S08-p151-f30, cytat: "Ibidem, s. 4–5."}, {segment: S08-p151-s03, cytat: "bardzo duży zbiór trofeów myśliwskich"}, {segment: S08-p151-s03, cytat: "Kolejni posiadacze Siemkowic przechowywali dokumenty rodzinne i ważniejsze papiery majątkowe w pancernej kasie, lecz wszystkie zaginęły"}], pewnosc_odczytu: pewna}
- {id: S08-203, podmiot: siemkowice-dwor, relacja: opis, wartosc: "oficyna murowana kryta gontem przy kopcu, zwana „Savoyem” (pokoje gościnne); stało tam czarne neogotyckie łoże (francuskie, poł. XIX w.) z błękitnym baldachimem w złote gwiazdy — trafiło do zamku w Oporowie koło Kutna jako „łóżko fundatora” abp. Władysława Oporowskiego", miejsce: oporow,
   zrodla: [{segment: S08-p151-s04, cytat: "stojąca obok kopca kryta gontem oficyna murowana, mieszcząca pokoje gościnne, zwana przez domowników „Savoyem”."}, {segment: S08-p151-s04, cytat: "Opisane łoże znajdowało się bowiem do niedawna we wschodniej izbie parteru domu zamkowego w Oporowie koło Kutna, w tzw. sypialni arcybiskupiej, jako... łóżko fundatora zamku"}], pewnosc_odczytu: pewna}
- {id: S08-204, podmiot: siemkowice-park, relacja: opis, wartosc: "przy kopcu ponad 600-letnia lipa (obwód ponad 7 m); 22 rodzaje drzew i 10 krzewów; trzy etapy (XV–XVI w., przełom XVII/XVIII, XIX w. — przebudowa za Karśnickich: system wodny, jesiony i klony nad stawami, ogrody); nieco ponad 5 ha (1,8 ha wody); aleja różana (tamaryszek, dereń, forsycja, róża japońska), aleja grabowa do „dzikiej” części; przez fosę dwa mosty (frontowy i kuchenny) i molo opleciony clematisem; murowana brama zamknięta łukiem",
   zrodla: [{segment: S08-p151-s05, cytat: "stojącą obok kopca ponad 600-letnią lipę — pomnik przyrody — o obwodzie pnia przekraczającym 7 m, na obecność w parku 22 rodzajów drzew i 10 krzewów"}, {segment: S08-p152-s01, cytat: "Karśnickich nastąpiła całkowita przebudowa starszego barokowego parku"}, {segment: S08-p152-s01, cytat: "Centralną aleją parku była tzw. aleja różana, wysadzona także tamaryszkiem, dereniem, forsycją i różą japońską."}, {segment: S08-p152-s01, cytat: "Przez fosę przerzucone były dwa mosty: frontowy i kuchenny"}, {segment: S08-p152-f32, cytat: "op.cit., s. 5–6."}], pewnosc_odczytu: pewna}
- {id: S08-205, podmiot: karsnicki-antoni-1991, relacja: udzial_w_wydarzeniu, wartosc: "z bratem Ksawerym Franciszkiem, studenci SGGW, w wojnie bolszewickiej 1920; wg tej strony synowie właściciela (Ignacego)", data: {tekst: "w roku 1920", od: 1920, do: 1920},
   zrodla: [{segment: S08-p152-s02, cytat: "kiedy dwaj synowie właściciela: Antoni i Ksawery Franciszek, wówczas studenci SGGW, brali udział w wojnie bolszewickiej."}], pewnosc_odczytu: pewna, uwagi: "Na s. 145 Antoni to „syn ostatniego właściciela” — niespójność źródła."}
- {id: S08-206, podmiot: karsnicki-ksawery-1896, relacja: rodzic, obiekt: karsnicki-ignacy-1937, wartosc: "wg s. 152: syn właściciela",
   zrodla: [{segment: S08-p152-s02, cytat: "dwaj synowie właściciela: Antoni i Ksawery Franciszek"}], pewnosc_odczytu: pewna}
- {id: S08-207, podmiot: siemkowice-dwor, relacja: opis, wartosc: "w I wojnie i 1920 r. nieuszkodzony; w II wojnie Niemcy wysiedlili Zofię Karśnicką do rządcówki, wnętrza służyły jako recepcja dla dygnitarzy III Rzeszy; w styczniu 1945 podpalony na rozkaz (oficer wehrmachtu, podobno syn wiedeńskiego historyka sztuki) — spłonęły ganek, dach i stropy; ruina do remontu Z. Cieklińskiego; dziś malowniczy, licznie odwiedzany zabytek", data: {tekst: "styczeń 1945 r.", od: 1945-01, do: 1945-01},
   zrodla: [{segment: S08-p152-s02, cytat: "Niemcy wysiedlili Zofię Karśnicką z dworu do rządcówki, ale utrzymywali wnętrza w doskonałym stanie. Służyły one jako pomieszczenia recepcyjne dla zjeżdżających się tu dygnitarzy III Rzeszy. Destrukcję przyniósł dopiero styczeń 1945 r."}, {segment: S08-p152-s02, cytat: "Spłonęły wtedy: ganek, dach i całe belkowanie stropu."}, {segment: S08-p152-s03, cytat: "nadal budynkiem bardzo malowniczym, licznie odwiedzanym przez turystów"}], pewnosc_odczytu: pewna}
