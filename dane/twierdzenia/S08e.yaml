   zrodla: [{segment: S08-p145-s01, cytat: "a w 1802 r. Jacek Fundament Karśnicki"}], pewnosc_odczytu: pewna}
- {id: S08-176, podmiot: siemkowice, relacja: opis, wartosc: "wg tradycji Karśnickich weszli oni w posiadanie Siemkowic już ok. 1639 r. przez małżeństwo z Radoszewską (relacja T. Karśnickiej-Kozłowskiej, Gdańsk 1991)", data: {tekst: "około 1639 r.", od: 1639, do: 1639},
   zrodla: [{segment: S08-p145-f23, cytat: "Warto jednak zaznaczyć, że w tradycji rodziny Karśnickich zachowała się wersja iż weszli oni w posiadanie Siemkowic już około 1639 r., poprzez małżeństwo z Radoszewską"}], pewnosc_odczytu: pewna}
- {id: S08-177, podmiot: karsnicki-antoni-1991, relacja: smierc, miejsce: gliwice, data: {tekst: "1 kwietnia 1991 r.", od: 1991-04-01, do: 1991-04-01},
   zrodla: [{segment: S08-p145-f23, cytat: "z woli Antoniego Karśnickiego, syna ostatniego właściciela Siemkowic, który zmarł 1 kwietnia 1991 r. w Gliwicach"}], pewnosc_odczytu: pewna}
- {id: S08-178, podmiot: karsnicka-kozlowska-teresa, relacja: opis, wartosc: "mgr inż.; autorka „Opisu dworu (dworu obronnego-zamku) w Siemkowicach” (Gdańsk 1991) dla L. Kajzera; córka ostatniego właściciela Ksawerego Franciszka", data: {tekst: "1991", od: 1991, do: 1991},
   zrodla: [{segment: S08-p145-f23, cytat: "T. Karśnicka-Kozłowska, Opis dworu (dworu obronnego-zamku) w Siemkowicach. Gdańsk 1991."}, {segment: S08-p149-s03, cytat: "obszernemu opracowaniu T. Karśnickiej-Kozłowskiej29, córki ostatniego właściciela Ksawerego Franciszka."}, {segment: S08-p149-f29, cytat: "T. Karśnicka-Kozłowska, op.cit."}], pewnosc_odczytu: pewna}
