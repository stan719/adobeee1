   zrodla: [{segment: S08-p149-s03, cytat: "a ostatnim Ksawery Franciszek Karśnicki (1896–1939), ożeniony z Wandą z Orzechowskich, który jako ochotnik — oficer rezerwy — zginął w czasie kampanii wrześniowej. Do września 1939 r. powierzchnia majętności wynosiła około 1465 ha, z czego blisko 2/3 stanowiły lasy."}], pewnosc_odczytu: pewna}
