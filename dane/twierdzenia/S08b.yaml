- {id: S08-081, podmiot: radoszewski-jozefat-1830, relacja: udzial_w_wydarzeniu, wartosc: "w powstaniu styczniowym naczelnik powiatu, potem więziony na Cytadeli; w nowym dworze w Krempie ukrywał powstańców po bitwie pod Niemysłowem; jego żona, w zaawansowanej ciąży, upiła Kozaków, którzy nie splądrowali domu", miejsce: krempa-dwor, data: {tekst: "1863", od: 1863, do: 1863},
   zrodla: [{segment: S08-p074-s03, cytat: "w czasie powstania Józefat był naczelnikiem powiatu (potem więziono go na Cytadeli), ukrywał w nowej rezydencji po-wstańców po bitwie pod Niemysłowem, a jego znajdująca się w zaawansowanej ciąży żona zdołała upić Kozaków, którzy nie splądrowali domu."}], pewnosc_odczytu: pewna}
- {id: S08-082, podmiot: radoszewski-jozefat-1830, relacja: zamieszkanie, miejsce: cytadela-warszawska, wartosc: "więziony na Cytadeli po powstaniu",
