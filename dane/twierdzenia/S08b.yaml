- {id: S08-090, podmiot: krempa-dwor, relacja: opis, wartosc: "wnętrze dwutraktowe, trójdzielne: 1 sień-hall ze schodami, 2 pokój stołowy (z wyjściem na taras), 3 salon czterookienny, 4 salonik, 5 pokój dziecinny, 6 sypialnia, 7 łazienka i WC, 8 korytarz, 9 pokój dzienny, 10 gabinet, 11–12 pomieszczenia gospodarcze (z rozbudowy); kuchnia, pokoje gościnne i służbowe w oficynie; pokoje na piętrze gościnne; przed wojną dwór oplecony clematisem i caprifolium; szkic parteru — kreśliły Maria Cyrek i Anna Marciniak-Kajzer",
   zrodla: [{segment: S08-p075-s02, cytat: "Ukształtowanie wnętrza dworu było zasadniczo dwutraktowe i trójdzielne."}, {segment: S08-p076-s01, cytat: "Krempa. Dwór — orientacyjny szkic parteru z zaznaczeniem funkcji pomieszczeń. 1 sień-hall, 2 pokój stołowy, 3 salon, 4 salonik, 5 pokój dziecinny, 6 pokój sypialny, 7 łazienka i WC, 8 korytarz, 9 pokój dzienny, 10 gabinet, 11 i 12 pomieszczenia gospodarcze."}, {segment: S08-p076-s02, cytat: "Kuchnia natomiast, wraz z pokojami gościnnymi i służbowymi, znajdowała się w oficynie."}, {segment: S08-p076-s02, cytat: "opisany dwór opleciony był krzewami ozdobnymi, głównie clematisem i caprifolium."}], pewnosc_odczytu: pewna}
- {id: S08-091, podmiot: radoszewski-jerzy-1902, relacja: wlasnosc, obiekt: krempa, wartosc: "po śmierci Michała przejął włość w 1934 r.; dobra ok. 700 ha (ponad 200 ha lasów), młyn motorowy, gorzelnie, oficyna, lamus", data: {tekst: "w 1934 r.", od: 1934, do: 1939},
   zrodla: [{segment: S08-p076-s02, cytat: "Po śmierci Michała (przedostatniego właściciela) włość przejął w 1934 r. Jerzy Radoszewski (1902–1967), ożeniony z Anną z Prządzyńskich, z omówionego w poprzednim haśle Kościerzyna. W okresie międzywojennym łączna po-wierzchnia dóbr wynosiła około 700 ha, z czego przeszło 200 ha obejmowały lasy, a prócz tego w majątku znajdował się młyn motorowy i gorzelnie."}], pewnosc_odczytu: pewna}
- {id: S08-092, podmiot: radoszewski-jerzy-1902, relacja: urodzenie, data: {tekst: "1902", od: 1902, do: 1902},
