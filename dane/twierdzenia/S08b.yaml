- {id: S08-095, podmiot: krempa-dwor, relacja: opis, wartosc: "wystrój (z pamięci rodzinnej): tapety, parkiety (w salonach deseniowe z kolorowego drewna), sztukaterie, wysokie piece z kolorowych kafli, kominek marmurowy w salonie i kaflowy w pokoju dziennym; salon w stylu Ludwika Filipa, salonik Ludwika XV, sypialnia — empire „późniejszy”, stołowy — meble „gdańskie”; w stołowym kolekcja ponad 20 obrazów rodzinnych, głównie portretów Radoszewskich z XVII–XX w. — 8 ocalało i po konserwacji jest w domach dzieci Anny i Jerzego Radoszewskich w Warszawie i pod Warszawą",
   zrodla: [{segment: S08-p076-s02, cytat: "Ściany dworu wyłożone były tapetami, a podłogi parkietami"}, {segment: S08-p076-f15, cytat: "A. Radoszewska, op. cit., s. 2."}, {segment: S08-p076-s02, cytat: "Salon utrzymany był w stylu Ludwika Filipa, a salonik w stylu"}, {segment: S08-p077-s01, cytat: "Ludwika XV. Sypialnia utrzymana była w empirze „późniejszym”, zaś stołowy zastawiony był meblami „gdańskimi”."}, {segment: S08-p077-s01, cytat: "kolekcja obrazów rodzinnych, głównie portretów Radoszewskich z XVII–XX w. Obrazy jako jedyne elementy wyposażenia budynku częściowo ocalały i przechowywane są (8 sztuk po niedawnej konserwacji) w domach dzieci Anny i Jerzego Radoszewskich w Warszawie i pod Warszawą."}], pewnosc_odczytu: pewna}
- {id: S08-096, podmiot: krempa-dwor, relacja: opis, wartosc: "biblioteka na piętrze ponad 5000 tomów (głównie polskie i francuskie), kompletowana od XVII w., szczególnie wzbogacona przez Michała Radoszewskiego; oprawy skórzane i półskórek, własny ekslibris (wić roślinna z kłosami i herb Oksza) i katalog; archiwum rodzinne (dokumenty, korespondencja, drzewo genealogiczne)",
   zrodla: [{segment: S08-p077-s01, cytat: "Biblioteka na piętrze liczyła ponad 5000 tomów, głównie polskich i francuskich. Kompletowano ją od XVII w., a szczególnie wzbogacona i uzupełniona została przez Michała Radoszewskiego."}, {segment: S08-p077-s01, cytat: "biblioteka miała swój exlibris, skomponowany z wici roślinnej z kłosami i herbu Oksza, a także katalog."}], pewnosc_odczytu: pewna}
- {id: S08-097, podmiot: krempa-park, relacja: opis, wartosc: "park ok. 5 ha, skomponowany za Józefata i Teofili Radoszewskich w poł. XIX w.: aleja wjazdowa z piramidalnymi tujami, szpaler grabowy, aleja kasztanowców, dęby-pomniki przyrody, wiązy, modrzewie, srebrne świerki, płaczące jesiony, morwy (Teofila hodowała jedwabniki), lipy, tulipanowce, bzy, jaśminy; w dziupli dębu kapliczka z figurką Matki Boskiej (dziś w kościele w Niemysłowie); 4 stawy z balustradami; w 1976 r. (H. Rutowicz, R. Sowa) całkowicie zniszczony przez podział między 8 użytkowników i Wytwórnię Owocowo-Warzywną PP „Las” — tylko 2 stawy, aleja grabowa, jawory, lipy, sosny wejmutki, tuje",
   zrodla: [{segment: S08-p077-s02, cytat: "Dwór otaczał spory, obejmujący około 5 ha park."}, {segment: S08-p077-s02, cytat: "Opisywany park był, według przekazów rodzinnych skomponowany za czasów Józefata i Teofili Radoszewskich w połowie XIX w."}, {segment: S08-p077-s02, cytat: "morwy (gdyż Teofila Radoszewska prowadziła hodowlę jedwabników)"}, {segment: S08-p077-s02, cytat: "W dużej dziupli jednego z pomnikowych dębów umieszczona była kapliczka z figurką Matki Boskiej. Figura ta zachowała się, obecnie znajduje się w kościele w Niemysłowie"}, {segment: S08-p077-s02, cytat: "podzielenie go między 8 użytkowników (!), oraz wprowadzenie się tu Wytwórni Owocowo-Warzywnej PP „Las”"}, {segment: S08-p077-f16, cytat: "op. cit., por. przypis 3."}], pewnosc_odczytu: pewna}
- {id: S08-098, podmiot: szeliska-teofila-1842, relacja: opis, wartosc: "żona Józefata; współtwórczyni parku w Krempie; prowadziła hodowlę jedwabników (morwy w parku)",
   zrodla: [{segment: S08-p077-s02, cytat: "za czasów Józefata i Teofili Radoszewskich w połowie XIX w."}, {segment: S08-p077-s02, cytat: "Teofila Radoszewska prowadziła hodowlę jedwabników"}], pewnosc_odczytu: pewna}
- {id: S08-099, podmiot: niemyslow, relacja: opis, wartosc: "w kościele w Niemysłowie figurka Matki Boskiej z parku w Krempie i ławka kolatorska z herbem Oksza",
   zrodla: [{segment: S08-p077-s02, cytat: "obecnie znajduje się w kościele w Niemysłowie, gdzie do dziś stoi ławka kolatorska z herbem Oksza."}], pewnosc_odczytu: pewna}
- {id: S08-100, podmiot: krempa-dwor, relacja: opis, wartosc: "zespół zniszczony pod koniec II wojny i ostatecznie po usunięciu Radoszewskich: we dworze mieszkały rodziny zainteresowane jego zniszczeniem i przeprowadzką „do bloków”, park dewastowało przedsiębiorstwo „Las”; opis znalazł się w tomie z powodu zagłady dworu",
   zrodla: [{segment: S08-p077-s03, cytat: "Opisany zespół dworsko-parkowy został zniszczony w końcu II wojny, a następnie ostatecznie, po usunięciu z Krempy Radoszewskich."}, {segment: S08-p078-s01, cytat: "„Las” (!!!)."}, {segment: S08-p078-s01, cytat: "Ostateczne zniszczenie dworu i prawie całkowita zagłada parku"}], pewnosc_odczytu: pewna}
