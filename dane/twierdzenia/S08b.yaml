- {id: S08-083, podmiot: krempa, relacja: opis, wartosc: "za Józefata uregulowano serwituty i przesiedlono wieś, położoną pierwotnie na tzw. Sadziskach przy ostatnim (czwartym) stawie, w stronę dawnej krochmalni, potem gorzelni dworskiej; stare dwory w Dominikowicach i Śmiechowie opuszczono",
   zrodla: [{segment: S08-p074-s03, cytat: "Opuszczeniu uległy stare dwory w Dominikowicach i Śmie-chowie, a nowy wzniesiony został w Krempie."}, {segment: S08-p074-s03, cytat: "Z działalnością Józefata wiązało się też uregulowanie serwitutów i przesiedlenie wsi, która pierwotnie mieściła się na tzw. Sadziskach koło ostatniego (wtedy czwartego) stawu, w stronę dawnej krochmalni, potem gorzelni dworskiej."}], pewnosc_odczytu: pewna}
- {id: S08-084, podmiot: krempa-dwor, relacja: opis, wartosc: "dwór murowany, podpiwniczony, z pięterkiem, na planie prostokąta, prawdopodobnie neobarokowy; fronton siedmioosiowy zwieńczony herbem Oksza, ganek z łukiem odcinkowym i niskim trójkątnym szczytem (później dobudowany daszek na słupie), pilastry, dwie barokowe facjatki z okulusami; elewacje szczytowe trójosiowe, od ogrodu taras; przebudowa i rozbudowa w końcu XIX w. przez Michała Radoszewskiego (1865–1942) i Ewelinę z Drohojowskich (1880–1955) h. Korczak — zbyt duża nadstawka piętra, dobudówka gospodarcza (dziewięć osi), rozebrana po II wojnie",
   zrodla: [{segment: S08-p074-s04, cytat: "Murowany dwór Józefata Radoszewskiego był budynkiem podpiwniczonym, z pięterkiem, wzniesionym na planie prostokąta, prawdopodobnie neobaroko-"}, {segment: S08-p075-s01, cytat: "obraz budowli po przebudowie i rozbudowie dokonanej przez Michała Radosze-wskiego (1865–1942) w końcu XIX w. Fronton dworu, który wieńczył herb Oksza, był siedmioosiowy"}, {segment: S08-p075-s01, cytat: "Prawdopodobnie w końcu lat dziewięćdziesiątych XIX w. dwór został rozbudowany z inicjatywy Michała i Eweliny z Drohojowskich (1880–1955) herbu Korczak."}, {segment: S08-p075-s01, cytat: "rozebrana została bezpośrednio po II wojnie światowej"}], pewnosc_odczytu: pewna}
