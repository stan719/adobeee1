# S08 cz. 2: Kościerzyn — aneks źródłowy (s. 69–70); L. Kajzer, „Krempa — dwór” (s. 71–78)

# --- Kościerzyn, aneks: inwentarz 1783
- {id: S08-044, podmiot: koscierzyn, relacja: opis, wartosc: "inwentarz z 24 VIII 1783 („Stan czyli opisanie dóbr Kościerzyna w trakcie zaczętey possesyi Wielmożnych Żeromskich”, AGAD Castr. Sirad. rel. 168 f. 933–936 v; rozszerzone powtórzenie inwentarza z 15 IX 1782 przy wydzierżawieniu na 3 lata Aleksandrowi Jaxa Żeromskiemu, Terr. Sirad. 93): wjazd i płoty złe, poobalane", data: {tekst: "dnia 24 sierpnia Roku 1783", od: 1783-08-24, do: 1783-08-24},
   zrodla: [{segment: S08-p069-s01, cytat: "5. ANEKS ŹRÓDŁOWY Archiwum Główne Akt Dawnych w Warszawie, Castr. Sirad. rel. 168"}, {segment: S08-p069-s02, cytat: "Stan czyli opisanie dóbr Kościerzyna w trakcie zaczętey possesyi Wielmożnych Żeromskich... dnia 24 sierpnia Roku 1783 spisany"}, {segment: S08-p069-s03, cytat: "A najprzód wjazd na podwórze, do dworu wrota z gruntu złe, te się obalają"}, {segment: S08-p070-s03, cytat: "Uwaga"}, {segment: S08-p070-s04, cytat: "Inwentarz dóbr Kościerzyna w województwie i powiecie sieradzkim leżących przy wypuszczeniu w possesyę trzechletnią dzierżawną Wielmożnego Imci Panu Aleksandrowi Jaxa Żeromskiemu [...] na gruncie dóbr rzeczonych Kościerzyna dnia 15 miesiąca września Roku Pańskiego 1782"}], pewnosc_odczytu: pewna}
- {id: S08-045, podmiot: koscierzyn, relacja: opis, wartosc: "dwór w 1783 r.: zły dach, zgniłe przyciesie; sień, kuchenka, pokoik czeladny z piecem i kominkiem; izba z pokoikami letnim i zimowym (okna po 16 szyb, piec z białych kafli, podłogi łatane gliną); druga izba z kredensem i alkierzykiem; kapliczka z pięcioma ławkami; schowanie; schody do dwóch górnych pokoików (wyłączonych z dzierżawy); osobna komora od sadu; sztachety wokół dworu złe",
   zrodla: [{segment: S08-p069-s04, cytat: "Dwór ten przykrycie ma złe, pod nim przyciesie zgniełe"}, {segment: S08-p069-s04, cytat: "Z tego alkierzyka[!] do prawey ręce jest kapliczka, do której wchodząc drzwi na zawiasach żelaznych z haczykiem bez zamka, w niey ławek pięć"}, {segment: S08-p069-s04, cytat: "są schody na górne pokoiki dwa, które są excypowane"}, {segment: S08-p069-s05, cytat: "Koło tego całego dworu sztacheciki są złe"}], pewnosc_odczytu: pewna}
- {id: S08-046, podmiot: koscierzyn-kopiec-park, relacja: opis, wartosc: "1783: „Dwór na kopcu czyli officyny stare i z gruntu złe”, z powodu ruiny nikt w nich nie mieszka; płoty i mostek złe", data: {tekst: "1783", od: 1783, do: 1783},
   zrodla: [{segment: S08-p069-s06, cytat: "Dwór na kopcu czyli officyny stare i z gruntu złe, reperacyi potrzebują, w których dla ruinowania nikt nie mieszka, płoty kole tych officyn złe, płatwione, mostek do tych officyn idąc zły."}], pewnosc_odczytu: pewna}
- {id: S08-047, podmiot: koscierzyn, relacja: opis, wartosc: "zabudowania dworskie 1783: osobna kuchnia, chlewiki, karmniki, ozdownia (słodownia), studnie, suszarnia przędziwa, mielcuch, wozownie, dwa spichrze, 8 stodół (4 nowo postawione za Żeromskich), nowe stajnie, sieczkarnia, obora i owczarnia (złe), karczma z zajazdem",
   zrodla: [{segment: S08-p069-s06, cytat: "Pobudynki dworskie. Kuchia na rogu dworu osobna, stara zła"}, {segment: S08-p069-s06, cytat: "Stodół ośm, z tych cztery z gruntu złe, reperacyi potrzebuią, cztery zaś te się"}, {segment: S08-p070-s01, cytat: "poobalały, lecz teraz za possesyi Imci Państwa Żeromskich są postawione nowo"}, {segment: S08-p070-s01, cytat: "Karczma z stajnią wjezdna zdezelowana, reperacyi potrzebuie"}], pewnosc_odczytu: pewna}
- {id: S08-048, podmiot: koscierzyn, relacja: opis, wartosc: "poddani 1783: 7 kmieci (Jędrzej Boch, Kazimierz Sierzchała, Maciej Nosek, Adam Graczyk, Filip Domagalik, Szymek Wielki, Kazimierz Kałęda), 7 zagrodników (Mateusz Dalecki, Maciej Wielki, Maciej Peter, Jakub Zabijak, Witek Antczak, Marian Masiak, Tomasz Pawlak), półrolnik Szymon Domagała, 3 chałupników, 7 komornic; rejestry zbóż i inwentarza (opuszczone przez wydawcę)", data: {tekst: "1783", od: 1783, do: 1783},
   zrodla: [{segment: S08-p070-s02, cytat: "[opuszczono opis domów i powinności 7 kmieci — Jędrzeja Bocha, Kazimierza Sierzchały, Macieja Noska, Adama Graczyka, Filipa Domagalika, Szymka Wielkiego, Kazimierza Kałędy, 7 zagrodników — Mateusza Daleckiego, Macieja Wielkiego, Macieja Petera, Jakuba Zabijaka, Witka Antczaka, Mariana Masiaka,Tomasza Pawlaka, półrolnika Szymona Domagały, 3 chałupników, 7 komornic oraz regestry zbóż i inwentarza żywego]"}], pewnosc_odczytu: pewna}

# --- Krempa
- {id: S08-049, podmiot: krempa, relacja: opis, wartosc: "wieś (też Krępa) ok. 8 km na zachód od Poddębic; dwór całkowicie zniszczony — zachowała się tylko jedna cegła przeniesiona „na pamiątkę” do nowego domu właścicieli pod Warszawą; podstawą opisu tradycja rodziny Radoszewskich h. Oksza",
   zrodla: [{segment: S08-p071-s01, cytat: "KREMPA — DWÓR"}, {segment: S08-p071-s02, cytat: "1. Podstawowe dane o dziejach wsi i jej właścicielach. 2. Dwór Radoszewskich"}, {segment: S08-p071-s03, cytat: "Wieś Krempa (niekiedy Krępa) położona około 8 km na zachód od Poddębic nie budziła zainteresowania badaczy."}, {segment: S08-p071-s03, cytat: "z którego możliwa do zidentyfikowania jest tylko jedna cegła, wyciągnięta z niszczejącego budynku i przeniesiona „na pamiątkę” do nowego domu właścicieli Krępy położonego pod Warszawą."}, {segment: S08-p071-s03, cytat: "tradycja i wspomnienia rodziny Radosze-wskich herbu Oksza"}], pewnosc_odczytu: pewna}
- {id: S08-050, podmiot: krempa, relacja: opis, wartosc: "brak u Zajączkowskich; pierwsza wzmianka 1488 (Terr. Schad. 6 f. 272 v, informacja S. M. Zajączkowskiego); w XVI w. w parafii Niemysłów; 1552 — 10 osadników, 1553 — 3 łany; w I RP pow. szadkowski woj. sieradzkiego, w XIX w. gm. Niewiesz pow. turecki gub. kaliskiej; międzywojnie pow. turecki, okupacja Warthegau, po wojnie woj. łódzkie, pow. poddębicki (do 1975), obecnie gm. Poddębice woj. sieradzkie; brak w Katalogu Zabytków, uboga „biała karta” w WKZ", data: {tekst: "1488", od: 1488, do: 1488},
   zrodla: [{segment: S08-p071-s04, cytat: "Po raz pierwszy odnotowana została w źródłach pisanych w 1488 r., a następnie wzmianki o niej pojawiają się w XVI w. jako o należącej do parafii w Nie-mysłowie"}, {segment: S08-p071-s04, cytat: "a w XIX w. należała do gminy Niewiesz, powiatu tureckiego, wchodzącego w skład guberni kaliskiej"}, {segment: S08-p071-f1, cytat: "gdzie w 1552 r. w Krempie odnotowano obecność 10 osadników a w 1553 r. 3 łany."}, {segment: S08-p071-f1, cytat: "(za Terr. Schad. 6, f. 272 v)"}, {segment: S08-p072-s01, cytat: "Obecnie jest to wieś należąca do gminy Poddębice w województwie sieradzkim."}], pewnosc_odczytu: pewna}
- {id: S08-051, podmiot: olszowski-antoni-1727, relacja: wlasnosc, obiekt: krempa, wartosc: "właściciel Krempy, Dominikowic, Krajkowic i Śmiechowa; po jego śmierci w 1727 r. spisano majątek: 19 pozycji sukien, gotówka 3569 zł (59 czerwonych złotych, 136 talarów bitych, 54 półtalary, tynfy)", data: {tekst: "w 1727 r.", od: 1727, do: 1727},
   zrodla: [{segment: S08-p072-s02, cytat: "Najobszerniejsze są dane spisane po śmierci właściciela Krempy, Dominikowic, Krajkowic i Śmiechowa Antoniego Olszowskiego w 1727 r."}, {segment: S08-p072-s02, cytat: "spora ilość gotowizny (59 czerwonych złotych, 136 bitych talarów, 54 półtalary, tynfy itp.) na łączną sumę 3569 złotych polskich"}], pewnosc_odczytu: pewna}
- {id: S08-052, podmiot: olszowski-antoni-1727, relacja: smierc, data: {tekst: "1727 r.", od: 1727, do: 1727},
   zrodla: [{segment: S08-p072-s02, cytat: "po śmierci właściciela Krempy"}], pewnosc_odczytu: pewna}
- {id: S08-053, podmiot: krempa, relacja: opis, wartosc: "1727: drewniany dwór kryty gontem, co najmniej 8 pomieszczeń (sień, 2 izby, alkierz, izdebka, 2 komory, kuchnia) — osiowy dwutraktowy dwór z 2 poł. XVII / 1 poł. XVIII w.; mielcuch nad sadzawką, szopa, chlewy, obory, owczarnia, stodoły; 5 kmieci, 4 zagrodników, 3 rzemieślników (szewc, kołodziej), 5 komornic, karczmarz", data: {tekst: "1727", od: 1727, do: 1727},
   zrodla: [{segment: S08-p072-s02, cytat: "W Krempie stał wtedy drewniany dwór, pobity gontami, w którym znajdowało się co najmniej 8 pomieszczeń."}, {segment: S08-p072-s02, cytat: "Nie ulega wątpliwości, że był to osiowo rozplanowany dwutraktowy dwór, typowy dla czasów swego powstania, czyli 2 połowy XVII i 1 połowy XVIII w."}, {segment: S08-p072-s02, cytat: "Na osiadłość Krempy składali się: pięciu kmieci, 4 zagrodników, 3 rzemieślników (w tym szewc i kołodziej), 5 komornic i karczmarz"}, {segment: S08-p072-f5, cytat: "por. też tamże na f. 606–607 opis inwentarza ruchomego znajdującego się w oborach i owczarniach w Dominikowicach, Krajkowicach i Krempie."}], pewnosc_odczytu: pewna}
- {id: S08-054, podmiot: bajbuza-antoni, relacja: opis, wartosc: "dzierżawca browaru, obór i stajni w Krempie (inwentarz 1747); mieszkał w izbach w browarze — dworu nie wymieniono", miejsce: krempa, data: {tekst: "1747", od: 1747, do: 1747},
   zrodla: [{segment: S08-p072-s02, cytat: "Inwentarz z 1747 r. nie zawiera pełnego opisu budynków, lecz tylko stan browaru obór i stajni wydzie-rżawionych Antoniemu Bajbuzie. Nie wymieniono tu dworu, a funkcję rezydencji dzierżawcy pełniły izby mieszkalne w browarze"}], pewnosc_odczytu: pewna}
- {id: S08-055, podmiot: krempa, relacja: opis, wartosc: "1780: mała część w ręku Pabianowskich; większa część Krempy oraz Dominikowice, Krajkowice i Śmiechów należały już do Radoszewskich h. Oksza; klucz czterowioskowy uformował się zapewne za Olszowskich w XVII w.", data: {tekst: "w 1780 r.", od: 1780, do: 1780},
   zrodla: [{segment: S08-p072-s02, cytat: "Natomiast w 1780 r. od-notowano tylko stan zasiewów i sporządzono wykaz chłopów na małej części pozostającej w ręku Pabianowskich10. Pozostała, większa część, a także sąsiednie wsie: Dominikowice, Krajkowice i Śmiechów należały już wtedy do Radoszewskich herbu Oksza."}, {segment: S08-p073-s01, cytat: "Sądzić należy, że czterowioskowy klucz krempski ma stosunkowo młodą metrykę i uformował się dopiero w czasach Olszowskich w XVII w."}], pewnosc_odczytu: pewna}
- {id: S08-056, podmiot: wielun-kolegiata-kaplica, relacja: opis, wartosc: "Radoszewscy (wg tradycji od czeskich Wrszowców, z Siemkowic i Radoszewic) w okresie największej prosperity (1 poł. XVII w.) wznieśli przy kolegiacie wieluńskiej kopułową kaplicę z renesansowymi nagrobkami z figurami leżącymi: Jerzego, podkomorzego wieluńskiego, i późniejszy Andrzeja; kaplica wraz z kolegiatą zbombardowana na początku września 1939 r. i rozebrana przez Niemców; od 1989 r. prace archeologiczno-architektoniczne",
   zrodla: [{segment: S08-p073-s01, cytat: "Rodzina ta, wywodząca się według tradycji heraldycznych od czeskich Wrszowców, pochodziła z Siemkowic"}, {segment: S08-p073-s01, cytat: "Wtedy to przy kolegiacie wieluńskiej wzniesiono kopułową kaplicę, w której ufundowali renesansowe nagrobki, z figurami leżącymi w bogatej oprawie architektonicznej: podkomorzego wieluńskiego Jerzego Radoszewskiego i późniejszy — Andrzeja Radoszewskiego."}, {segment: S08-p073-f11, cytat: "Kaplica Radoszewskich wraz z kolegiatą w Wieluniu zbombardowana została w początku września 1939 r. i rozebrana przez Niemców w czasie okupacji. Obecnie od 1989 r. prowadzone są tam prace terenowe"}], pewnosc_odczytu: pewna}
- {id: S08-057, podmiot: radoszewski-marek-1641, relacja: opis, wartosc: "najwybitniejszy przedstawiciel rodziny: podkomorzy, potem kasztelan wieluński, przywódca szlachty ziemi wieluńskiej w 2. ćwierci XVII w.; prawdopodobnie sprowadził do Polski obraz „Grosz czynszowy” przypisywany Tycjanowi",
   zrodla: [{segment: S08-p073-s01, cytat: "Najwybit-niejszym przedstawicielem rodziny był jednak Marek, podkomorzy, a potem kasztelan wieluński, przywódca szlachty tej ziemi w 2 ćwierci XVII w., który prawdopodobnie sprowadził do Polski obraz Grosz Czynszowy, przypisywany Tycjanowi"}], pewnosc_odczytu: pewna, uwagi: "S02 (za Szczygielskim) przypisuje sprowadzenie obrazu Jerzemu."}
- {id: S08-058, podmiot: radoszewski-michal-1775, relacja: opis, wartosc: "wg przekazów rodzinnych bezpośrednio po I rozbiorze, ok. 1775 r., Michał Radoszewski sprzedał Radoszewice Niemojowskim i przeniósł się do Krempy koło Poddębic", data: {tekst: "chyba około 1775 r.", od: 1775, do: 1775},
   zrodla: [{segment: S08-p073-s01, cytat: "stało się to bezpośrednio po I rozbiorze Polski, chyba około 1775 r. Wtedy to Michał Radoszewski sprzedał Radoszewice Niemojowskim i przeniósł się w okolice łęczyckich Poddębic do Krempy."}], pewnosc_odczytu: pewna}
- {id: S08-059, podmiot: radoszewski-michal-1775, relacja: wlasnosc, obiekt: krempa, wartosc: "przeniósł się do Krempy ok. 1775 r.; od końca XVIII w. do II wojny Krempa stale w rękach Radoszewskich", data: {tekst: "około 1775 r.", od: 1775, do: 1775},
   zrodla: [{segment: S08-p073-s01, cytat: "Od końca XVIII w. do II wojny Krempa przez cały czas znajdowała się w ręku Radoszewskich."}], pewnosc_odczytu: pewna}
- {id: S08-060, podmiot: krempa, relacja: opis, wartosc: "w XIX w. wieś średniej wielkości: 1827 — 10 domów, 98 mieszkańców; koniec wieku — 10 domów, 224 mieszkańców", data: {tekst: "1827", od: 1827, do: 1900},
   zrodla: [{segment: S08-p073-s01, cytat: "W wieku XIX była to wieś średniej wielkości, w 1827 r. liczyła 10 domów i 98 mieszkańców, a w końcu wieku 10 domów i 224 mieszkańców"}], pewnosc_odczytu: pewna}
- {id: S08-061, podmiot: radoszewski-jerzy-1902, relacja: udzial_w_wydarzeniu, wartosc: "w grudniu 1939 r. rodzina Radoszewskich wysiedlona z Krempy do obozu przejściowego w Bochni koło Krakowa", miejsce: bochnia, data: {tekst: "W grudniu 1939 r.", od: 1939-12, do: 1939-12},
   zrodla: [{segment: S08-p073-s01, cytat: "W grudniu 1939 r. rodzina Radoszewskich została wysiedlona z Krempy i osadzona w obozie przejściowym w Bochni koło Krakowa."}], pewnosc_odczytu: pewna, uwagi: "Twierdzenie o rodzinie; przypisane Jerzemu jako ówczesnemu właścicielowi."}
- {id: S08-062, podmiot: krempa-dwor, relacja: opis, wartosc: "po wojnie budynek mieszkalny w gestii gminy; po opuszczeniu i dewastacji rozebrany ok. 1985 r. (w latach 80., bez zainteresowania sieradzkich służb konserwatorskich); autor widział go zamieszkanym, w złym stanie, w końcu lat 70.", data: {tekst: "około 1985 r.", od: 1985, do: 1985},
   zrodla: [{segment: S08-p073-s01, cytat: "Po wojnie dwór służył jako budynek mieszkalny, pozostający w gestii gminy, a po opuszczeniu i zdewastowaniu rozebrany został około 1985 r."}, {segment: S08-p078-s01, cytat: "byłem w Krempie i stwierdziłem, że dwór jeszcze zamieszkiwano, choć jego stan techniczny (szczególnie dachu) był bardzo zły. W latach osiemdziesiątych, przy braku zainteresowania sieradzkich służb konserwatorskich, rozebrano budynek."}], pewnosc_odczytu: pewna}
- {id: S08-063, podmiot: radoszewski-jozefat-1830, relacja: fundacja, obiekt: krempa-dwor, wartosc: "murowany dwór wzniesiony z jego inicjatywy po połowie XIX w. (po 1847, przed 1863, ok. 1860); wcześniejsza rezydencja z przełomu XVIII/XIX w. nieznana", data: {tekst: "około 1860 r.", od: 1847, do: 1863},
   zrodla: [{segment: S08-p073-s02, cytat: "Nie znamy rezydencji Radoszewskich z końca XVIII i początku XIX w. Niedawno rozebrany dwór murowany powstał bezpośrednio po połowie XIX w. z inicjatywy Józefata Radoszewskiego"}, {segment: S08-p073-f13, cytat: "A. Radoszewska, Dwór w Krempie, Brwinów 1991"}, {segment: S08-p074-s03, cytat: "Stało się to więc na pewno po 1847 r. a przed 1863"}, {segment: S08-p074-s03, cytat: "wydaje się jednak, że dwór powstał około 1860 r."}], pewnosc_odczytu: pewna}
- {id: S08-064, podmiot: radoszewski-jozef-1791, relacja: malzonek, obiekt: zajaczek-aleksandra, wartosc: "na początku XIX w. ślub z córką (właściwie bratanicą-wychowanicą) gen. Józefa Zajączka — „najposażniejszą partią w ówczesnej Polsce”; mieszkańcy Krempy oceniali to chłodno (Zajączek uchodził za zdrajcę), pieniądze namiestnika do Krempy nie dotarły",
   zrodla: [{segment: S08-p073-s02, cytat: "Było to małżeństwo Józefa Radoszew-skiego z córką (właściwie bratanicą-wychowanicą) Józefa Zajączka (†1826)"}, {segment: S08-p073-s02, cytat: "czyli z najposażniejszą partią w ówczesnej Polsce."}, {segment: S08-p074-s01, cytat: "wpłynęła zapewne niejednoznaczna ocena generała, który dla sporej części społeczeństwa polskiego był zdrajcą-renegatem. Nie dotarły też do Krempy pieniądze namiestnikowskie"}], pewnosc_odczytu: pewna,
   uwagi: "Utożsamienie żony z Aleksandrą z Zajączków (S07) — prawdopodobne."}
- {id: S08-065, podmiot: zajaczek-aleksandra, relacja: opis, wartosc: "córka (właściwie bratanica-wychowanica) gen. Józefa Zajączka",
   zrodla: [{segment: S08-p073-s02, cytat: "z córką (właściwie bratanicą-wychowanicą) Józefa Zajączka"}], pewnosc_odczytu: pewna}
- {id: S08-066, podmiot: zajaczek-jozef-general, relacja: urzad, wartosc: "generał, uczestnik insurekcji kościuszkowskiej i wojen napoleońskich; od 1815 namiestnik cesarski w Królestwie Polskim, od 1818 książę", data: {tekst: "od 1815 r.", od: 1815, do: 1826},
   zrodla: [{segment: S08-p073-s02, cytat: "generała, uczestnika insurekcji kościuszkowskiej i wojen napoleońskich, od 1815 r. cesarskiego namiestnika w Królestwie Polskim (i od 1818 r. księcia)"}], pewnosc_odczytu: pewna}
