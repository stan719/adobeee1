- {id: S08-076, podmiot: radoszewski-jozefat-starszy, relacja: rodzenstwo, obiekt: radoszewski-franciszek-1790, wartosc: "starszy brat; gospodarował w dobrach Śmiechów z przyległością Krempa (wycena 30 000 złp / 4500 rs), siedziba w Śmiechowie; Franciszek — Dominikowice z przyległością Krajkowice (40 000 złp / 6000 rs), siedziba w Dominikowicach; w 1847 r. Krempa nie była ośrodkiem włości", data: {tekst: "1847", od: 1847, do: 1847},
   zrodla: [{segment: S08-p074-s02, cytat: "Bracia Franciszek i Józefat (starszy, a więc stryj budowniczego dworu w Krempie) gospodarowali w dobrach Śmiechów z przy-ległością Krempa i Dominikowice z przyległością Krajkowice, przy czym siedzibą Franciszka były Dominikowice. Część ta wyceniona była na 40 000 złp (6 tysięcy rs), a Śmiechów na 30 000 (4500 rs)."}, {segment: S08-p074-s02, cytat: "W roku 1847 Krempa nie stanowiła więc ośrodka całej włości i nie w niej mieścił się dwór."}], pewnosc_odczytu: pewna}
