- {id: S08-078, podmiot: radoszewski-franciszek-1790, relacja: zamieszkanie, miejsce: dominikowice, wartosc: "drewniany dwór w Dominikowicach; meble wyceniono na ponad 201 rs, szkło i porcelanę na prawie 48 rs, 2 obrazy „na papierze” na 60 kop., narzędzia gorzelni i browaru na ponad 969 rs; aktywa spadku 22 129 rs, „stan bierny” 27 733 rs — długi przewyższały aktywa o 5,6 tys. rubli", data: {tekst: "1847", od: 1847, do: 1847},
   zrodla: [{segment: S08-p074-s02, cytat: "Wartość mebli stojących we dworze w Dominikowicach, wyceniono na ponad 201 rs., szkło i porcelanę na prawie 48 rs., 2 obrazy „na papierze” na 60 kopiejek, zaś narzędzia do gorzelni i browaru aż na ponad 969 rs. W sumie aktywa pozostałe po śmierci Franciszka Radoszewskiego wyceniono na 22 129 rs., zaś „stan bierny” aż na 27 733 rs., czyli suma pozostawionych długów przewyższała 5,6 tysiąca rubli."}], pewnosc_odczytu: pewna}
